# Development override: runs `yarn start` (frontend + backend with hot reload) from the
# bind-mounted source tree. Linux node_modules live in named volumes so they never
# clash with the host's (macOS) node_modules.
#
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up
#
# Frontend: http://localhost:${APP_PORT:-3000}  Backend: http://localhost:${BACKSTAGE_PORT:-7007}

services:
  backstage:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: backstage-dev:local
    # Only app-config.yaml: a host-oriented app-config.local.yaml (localhost infra)
    # is visible through the bind mount and must not be picked up here.
    command:
      - sh
      - -c
      - yarn install --immutable && yarn start --config /app/app-config.yaml --inspect 0.0.0.0:9229
    environment:
      NODE_ENV: development
      # Keep Yarn's install state with the container's node_modules, not in the
      # bind-mounted .yarn/ that the host install uses.
      YARN_INSTALL_STATE_PATH: /app/node_modules/.yarn-install-state.gz
      APP_CONFIG_app_baseUrl: http://localhost:${APP_PORT:-3000}
      APP_CONFIG_app_listen_host: 0.0.0.0
      APP_CONFIG_app_listen_port: 3000
      APP_CONFIG_backend_baseUrl: http://localhost:${BACKSTAGE_PORT:-7007}
      APP_CONFIG_backend_cors_origin: http://localhost:${APP_PORT:-3000}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_node_modules:/app/packages/app/node_modules
      - backend_node_modules:/app/packages/backend/node_modules
      - brand_node_modules:/app/packages/brand/node_modules
      - yarn_global:/root/.yarn/berry
    ports:
      - '${APP_PORT:-3000}:3000'
      - '127.0.0.1:9229:9229' # Node.js inspector (backend), loopback only
    # Apple `container` gives each container 1 GB unless told otherwise; the dev
    # servers plus `yarn install` need far more.
    deploy:
      resources:
        limits:
          memory: 8g
    healthcheck:
      start_period: 900s

volumes:
  node_modules:
  app_node_modules:
  backend_node_modules:
  brand_node_modules:
  yarn_global:
