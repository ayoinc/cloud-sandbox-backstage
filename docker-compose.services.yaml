# Infrastructure services for Backstage: PostgreSQL, Redis, MinIO (+ bucket init)
# and the on-demand TechDocs generator.
#
# Standalone (Backstage runs natively, e.g. via Devbox):
#   docker compose -f docker-compose.services.yaml up -d --wait
# Full stack: docker-compose.yaml includes this file, so just run `docker compose up -d --wait`.
#
# Works with Docker Engine and with Apple `container` via the socktainer Docker context.

name: backstage

services:
  # PostgreSQL 18. Since 18 the image keeps data in /var/lib/postgresql/<major>/docker,
  # so the volume is mounted at /var/lib/postgresql (enables `pg_upgrade --link` later).
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis 8 used purely as the Backstage cache: bounded memory, no persistence.
  redis:
    image: redis:8.10-alpine
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # MinIO (S3-compatible) for TechDocs and branding assets.
  # MinIO no longer publishes images on Docker Hub/Quay; Chainguard builds it from source.
  # Chainguard's free tier only publishes `latest`/`latest-dev`; `-dev` adds the shell and
  # wget needed by the healthcheck.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-backstage}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-backstage123}
    volumes:
      - minio_data:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          'http://127.0.0.1:9000/minio/health/live',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot bucket initialisation (idempotent).
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-backstage}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-backstage123}
      TECHDOCS_BUCKET: ${TECHDOCS_BUCKET:-techdocs}
      BRANDING_BUCKET: ${BRANDING_BUCKET:-backstage-assets}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${TECHDOCS_BUCKET}" local/scaffolder "local/$${BRANDING_BUCKET}"
        mc anonymous set download "local/$${TECHDOCS_BUCKET}"
        mc anonymous set download "local/$${BRANDING_BUCKET}"
        echo 'MinIO buckets initialised'
    restart: 'no'

  # On-demand TechDocs generator (`make techdocs-docker`): builds every catalog/template
  # mkdocs site into ./techdocs-output using the same toolchain as the Backstage image.
  techdocs:
    build:
      context: .
      dockerfile: Dockerfile
      target: toolchain
    image: backstage-toolchain:local
    working_dir: /src
    volumes:
      - ./catalog:/src/catalog:ro
      - ./templates:/src/templates:ro
      - ./techdocs-output:/out
    entrypoint: ['/usr/local/bin/build-techdocs', '/out']
    profiles:
      - tools

volumes:
  postgres_data:
  minio_data:
