name: Terraform Validate

# The repository is public: nothing a pull request, issue or fork does starts
# a run, and every run must have been started by the repository owner.
on:
  push:
    branches: [main, develop]
    paths: ['catalog/terraform-modules/**/*.tf']

jobs:
  validate:
    name: Validate & Lint
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: catalog/terraform-modules

      - name: TFLint Init
        run: tflint --init
        working-directory: catalog/terraform-modules

      - name: TFLint
        run: tflint --recursive
        working-directory: catalog/terraform-modules

      - name: Validate All Modules
        run: |
          find . -name "*.tf" -exec dirname {} \; | sort -u | while read dir; do
            echo "Validating $dir"
            cd "$dir"
            terraform init -backend=false 2>/dev/null || true
            terraform validate || true
            cd - > /dev/null
          done
        working-directory: catalog/terraform-modules
