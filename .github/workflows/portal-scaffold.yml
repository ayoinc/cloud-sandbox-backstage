# =============================================================================
# Portal Scaffold Workflow
# =============================================================================
# Runs one software template for the Cloudflare portal. The portal starts this
# workflow when a user creates something from a template; the run executes the
# template steps in a real Backstage scaffolder and reports every event back
# (edge/scripts/pipeline/run-template.mjs). A sync follows, so the new
# component and its documentation appear in the portal.
#
# Repository configuration: see portal-sync.yml. Here PORTAL_GITHUB_TOKEN must
# also be allowed to create repositories and push workflow files for the
# owners the templates publish to.
# =============================================================================

name: Portal scaffold
run-name: Create from ${{ inputs.template_ref }} for ${{ inputs.created_by }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Id of the portal task to report to
        required: true
        type: string
      template_ref:
        description: Template entity ref, e.g. template:default/nodejs-service
        required: true
        type: string
      values:
        description: The form values, as a JSON object
        required: true
        type: string
      created_by:
        description: Entity ref of the user who started the run
        required: true
        type: string

permissions:
  contents: read

# The same task is never run twice at once; different tasks run side by side.
concurrency:
  group: portal-scaffold-${{ inputs.task_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  run:
    name: Run the template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check configuration
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          PORTAL_PIPELINE_TOKEN: ${{ secrets.PORTAL_PIPELINE_TOKEN }}
          PORTAL_GITHUB_TOKEN: ${{ secrets.PORTAL_GITHUB_TOKEN }}
          PORTAL_TASK_ID: ${{ inputs.task_id }}
        run: |
          missing=""
          [ -n "$PORTAL_URL" ] || missing="$missing vars.PORTAL_URL"
          [ -n "$PORTAL_PIPELINE_TOKEN" ] || missing="$missing secrets.PORTAL_PIPELINE_TOKEN"
          [ -n "$PORTAL_GITHUB_TOKEN" ] || missing="$missing secrets.PORTAL_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Not configured for this repository:$missing. See 'Cloudflare Workers Deployment' in the README."
            exit 1
          fi
          # The id becomes part of a URL
          if ! printf '%s' "$PORTAL_TASK_ID" | grep -Eq '^[A-Za-z0-9-]+$'; then
            echo "::error::task_id is not a task id."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run the template
        id: template
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          PORTAL_PIPELINE_TOKEN: ${{ secrets.PORTAL_PIPELINE_TOKEN }}
          PORTAL_GITHUB_TOKEN: ${{ secrets.PORTAL_GITHUB_TOKEN }}
          PORTAL_TASK_ID: ${{ inputs.task_id }}
          PORTAL_TEMPLATE_REF: ${{ inputs.template_ref }}
          PORTAL_TASK_VALUES: ${{ inputs.values }}
          PORTAL_CREATED_BY: ${{ inputs.created_by }}
        run: yarn workspace @internal/edge template:run

      # The script reports its own failures. This covers a run that broke
      # before the script started, so the user is not left watching a task
      # that never ends.
      - name: Tell the portal the run could not start
        if: ${{ always() && steps.template.outcome != 'success' && steps.template.outcome != 'failure' && steps.template.outcome != 'cancelled' }}
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          PORTAL_PIPELINE_TOKEN: ${{ secrets.PORTAL_PIPELINE_TOKEN }}
          PORTAL_TASK_ID: ${{ inputs.task_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          message="The template was not run: the GitHub Actions run stopped while it was being set up. See $RUN_URL"
          jq --null-input --arg message "$message" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            events: [
              { type: "log", body: { message: $message }, createdAt: $now },
              {
                type: "completion",
                body: {
                  message: "Run completed with status: failed",
                  error: { name: "Error", message: $message }
                },
                createdAt: $now
              }
            ]
          }' > "$RUNNER_TEMP/events.json"
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer $PORTAL_PIPELINE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "@$RUNNER_TEMP/events.json" \
            "$PORTAL_URL/api/pipeline/tasks/$PORTAL_TASK_ID/events"

  sync:
    name: Sync the portal
    needs: run
    uses: ./.github/workflows/portal-sync.yml
    secrets:
      PORTAL_PIPELINE_TOKEN: ${{ secrets.PORTAL_PIPELINE_TOKEN }}
      PORTAL_GITHUB_TOKEN: ${{ secrets.PORTAL_GITHUB_TOKEN }}
