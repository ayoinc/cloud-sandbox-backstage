# =============================================================================
# Portal Scaffold Workflow
# =============================================================================
# Runs one software template for the Cloudflare portal. The portal starts this
# workflow when a user creates something from a template; the run executes the
# template steps in a real Backstage scaffolder and reports every event back
# (edge/scripts/pipeline/run-template.mjs). A sync follows, so the new
# component and its documentation appear in the portal.
#
# Only the portal starts it, acting as the repository owner; a run started by
# anyone else does nothing.
#
# The portal gives a run the id of its task and the name of the template, no
# more: a run's inputs, its name and its log can be read by everyone who can
# see this repository. The values of the template form and who filled it in
# are asked of the portal by the script, with the pipeline's token, and are
# not printed.
#
# Repository configuration: see portal-sync.yml. Here PORTAL_GITHUB_TOKEN must
# also be allowed to create repositories and push workflow files for the
# owners the templates publish to.
#
# Optional repository variable:
#   PORTAL_VERBOSE_LOG   'true' to print in the run's log what each step of
#                        the template logs. Off by default, because this
#                        repository's logs may be public and a step's
#                        messages name what the user is creating. Without
#                        it the log names the steps and how each ended; the
#                        user reads the messages in the portal either way.
# =============================================================================

name: Portal scaffold
# The portal finds a task's run by the task id in this name
run-name: Create from ${{ inputs.template_ref }} (${{ inputs.task_id }})

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Id of the portal task to report to
        required: true
        type: string
      template_ref:
        description: Template entity ref, e.g. template:default/nodejs-service
        required: true
        type: string

permissions:
  contents: read

# The same task is never run twice at once; different tasks run side by side.
concurrency:
  group: portal-scaffold-${{ inputs.task_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  # actions/checkout runs `git init`, which prints a hint about the default
  # branch name unless one is configured; name it so the hint is not printed.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  run:
    name: Run the template
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PORTAL_GITHUB_TOKEN: ${{ secrets.PORTAL_GITHUB_TOKEN }}
          PORTAL_TASK_ID: ${{ inputs.task_id }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing secrets.CLOUDFLARE_ACCOUNT_ID"
          [ -n "$PORTAL_GITHUB_TOKEN" ] || missing="$missing secrets.PORTAL_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Not configured for this repository:$missing. See 'Cloudflare Workers Deployment' in the README."
            exit 1
          fi
          # The id is put into a URL and, if the run cannot start, into SQL
          if ! printf '%s' "$PORTAL_TASK_ID" | grep -Eq '^[A-Za-z0-9-]+$'; then
            echo "::error::task_id is not a task id."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run the template
        id: template
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PORTAL_GITHUB_TOKEN: ${{ secrets.PORTAL_GITHUB_TOKEN }}
          PORTAL_TASK_ID: ${{ inputs.task_id }}
          PORTAL_VERBOSE_LOG: ${{ vars.PORTAL_VERBOSE_LOG }}
        run: yarn workspace @internal/edge template:run

      # The script reports its own failures. This covers a run that broke
      # before the script started, so the user is not left watching a task
      # that never ends. Nothing is installed at that point, so the task is
      # ended with SQL: the same two events and status that appendTaskEvents
      # in edge/src/scaffolder.ts writes for a failed run.
      - name: Tell the portal the run could not start
        if: ${{ always() && steps.template.outcome != 'success' && steps.template.outcome != 'failure' && steps.template.outcome != 'cancelled' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PORTAL_TASK_ID: ${{ inputs.task_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Checked again here: this step also runs when the first one failed
          if ! printf '%s' "$PORTAL_TASK_ID" | grep -Eq '^[A-Za-z0-9-]+$'; then
            echo "::error::task_id is not a task id."
            exit 1
          fi
          message="The template was not run: the GitHub Actions run stopped while it was being set up. See $RUN_URL"
          now="strftime('%Y-%m-%dT%H:%M:%fZ', 'now')"
          open="FROM tasks WHERE id = '$PORTAL_TASK_ID' AND status = 'open'"
          npx --yes wrangler@4 d1 execute cloud-sandbox --remote --command "
            INSERT INTO task_events (task_id, event_type, body, created_at)
              SELECT id, 'log', json_object('message', '$message'), $now $open;
            INSERT INTO task_events (task_id, event_type, body, created_at)
              SELECT id, 'completion', json_object('message', 'Run completed with status: failed', 'error', json_object('name', 'Error', 'message', '$message')), $now $open;
            UPDATE tasks SET status = 'failed', last_heartbeat_at = $now WHERE id = '$PORTAL_TASK_ID' AND status = 'open';
          "

  sync:
    name: Sync the portal
    needs: run
    uses: ./.github/workflows/portal-sync.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PORTAL_GITHUB_TOKEN: ${{ secrets.PORTAL_GITHUB_TOKEN }}
