name: Terraform Security

# The repository is public: nothing a pull request, issue or fork does starts
# a run, and a pushed run must have been started by the repository owner.
on:
  push:
    branches: [main]
    paths: ['catalog/terraform-modules/**/*.tf']
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am

env:
  # actions/checkout runs `git init`, which prints a hint about the default
  # branch name unless one is configured; name it so the hint is not printed.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  security:
    name: Security Scan
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: catalog/terraform-modules
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif
          check_existence: false

      - name: TFSec Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: catalog/terraform-modules
          soft_fail: true
          format: sarif
          sarif_file: tfsec-results.sarif

      - name: Upload TFSec Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          check_existence: false

      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # The Trivy release the action's master branch installed; v0.36.0 of the
          # action would otherwise default to the older v0.70.0
          version: 'v0.76.2'
          scan-type: 'config'
          scan-ref: 'catalog/terraform-modules'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          check_existence: false
