name: Terraform Test

# The repository is public: nothing a pull request, issue or fork does starts
# a run, and every run must have been started by the repository owner.
on:
  push:
    branches: [main, develop]
    paths:
      [
        'catalog/terraform-modules/**/*.tf',
        'catalog/terraform-modules/**/*.tftest.hcl',
      ]

env:
  # actions/checkout runs `git init`, which prints a hint about the default
  # branch name unless one is configured; name it so the hint is not printed.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    name: Test ${{ matrix.provider }}
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        provider: [azure, aws, gcp]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: catalog/terraform-modules/${{ matrix.provider }}

      - name: Test Infrastructure Layer
        run: |
          cd infrastructure
          terraform init -backend=false
          terraform validate
          terraform test -verbose
        working-directory: catalog/terraform-modules/${{ matrix.provider }}

      - name: Test Resource Modules
        run: |
          for module in resources/*/; do
            if [ -d "$module/tests" ]; then
              echo "Testing $module"
              cd "$module"
              terraform init -backend=false
              terraform validate
              terraform test -verbose || true
              cd ../..
            fi
          done
        working-directory: catalog/terraform-modules/${{ matrix.provider }}

  test-shared:
    name: Test Shared Modules
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0

      - name: Test Shared Modules
        run: |
          for module in naming tagging validation; do
            if [ -d "$module" ]; then
              echo "Testing shared/$module"
              cd "$module"
              terraform init -backend=false
              terraform validate
              terraform test -verbose || true
              cd ..
            fi
          done
        working-directory: catalog/terraform-modules/shared
