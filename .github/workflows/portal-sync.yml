# =============================================================================
# Portal Sync Workflow
# =============================================================================
# Rebuilds what the Cloudflare portal serves: processes the catalog with a real
# Backstage backend, builds the TechDocs sites with mkdocs, and writes both to
# the portal's database and bucket (edge/scripts/pipeline/sync-catalog.mjs).
#
# The runner cannot call the portal's public address: Cloudflare answers it
# with a challenge page. The script starts the portal Worker on the runner
# with Wrangler instead, bound to the deployed data through Cloudflare's API
# (edge/scripts/pipeline/bridge.mjs).
#
# The repository is public: nothing a pull request, issue or fork does starts
# a run, and every run must have been started by the repository owner.
#
# Repository configuration (Settings > Secrets and variables > Actions):
#   secrets.CLOUDFLARE_API_TOKEN   Cloudflare API token allowed to edit D1,
#                                  Workers R2 Storage and Workers Scripts
#   secrets.CLOUDFLARE_ACCOUNT_ID  the Cloudflare account the portal is in (a
#                                  secret only so that logs mask it)
#   secrets.PORTAL_GITHUB_TOKEN    reads this repository and the repositories
#                                  created from templates
# =============================================================================

name: Portal sync

on:
  push:
    paths:
      - 'catalog/**'
      - 'templates/**'
      - 'app-config.yaml'
      - 'app-config.pipeline.yaml'
      - 'packages/backend/src/pipeline.ts'
      - 'edge/scripts/pipeline/**'
      # The TechDocs tool versions are read from the Dockerfile
      - 'Dockerfile'
      - '.github/workflows/portal-sync.yml'
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      PORTAL_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.13'
  # actions/checkout runs `git init`, which prints a hint about the default
  # branch name unless one is configured; name it so the hint is not printed.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  sync:
    name: Sync catalog and documentation
    # Pushes count only on the default branch, whatever it is called. A manual
    # run, or one started by the portal, syncs the branch it was started on.
    if: github.actor == github.repository_owner && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One sync at a time, across every workflow that runs this job: two of
    # them interleaving would stage rows into each other's catalog. A waiting
    # sync is replaced by a newer one, which carries the same changes.
    concurrency:
      group: portal-sync
      cancel-in-progress: false
    steps:
      - name: Check configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PORTAL_GITHUB_TOKEN: ${{ secrets.PORTAL_GITHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing secrets.CLOUDFLARE_ACCOUNT_ID"
          [ -n "$PORTAL_GITHUB_TOKEN" ] || missing="$missing secrets.PORTAL_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Not configured for this repository:$missing. See 'Cloudflare Workers Deployment' in the README."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Documentation from other repositories is built here: leave no
          # token behind for it to find.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the TechDocs toolchain
        run: |
          # The versions pinned in the Dockerfile, so both build the same way
          read -ra pip_packages <<< "$(node edge/scripts/pipeline/toolchain.mjs pip)"
          pip install "${pip_packages[@]}"
          d2_version=$(node edge/scripts/pipeline/toolchain.mjs d2)
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/d2.tar.gz" \
            "https://github.com/terrastruct/d2/releases/download/${d2_version}/d2-${d2_version}-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/d2-${d2_version}/bin/d2" /usr/local/bin/d2
          mkdocs --version
          d2 --version

      - name: Sync the portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PORTAL_GITHUB_TOKEN: ${{ secrets.PORTAL_GITHUB_TOKEN }}
          # 'true' also prints the addresses of registered files that had a
          # problem. Off by default: this repository's logs may be public.
          PORTAL_VERBOSE_LOG: ${{ vars.PORTAL_VERBOSE_LOG }}
        # Writes the counts to the job summary itself
        run: yarn workspace @internal/edge catalog:sync
