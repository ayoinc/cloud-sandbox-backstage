# =============================================================================
# Template Check Workflow
# =============================================================================
# Renders every software template with the real Backstage scaffolder, using
# the sample-values.json next to each template.yaml, without publishing
# anything (edge/scripts/pipeline/check-templates.mjs). A template whose form
# rejects its sample values, whose steps fail, or that leaves template syntax
# in its output fails here instead of in front of a user of the portal.
#
# The repository is public: nothing a pull request, issue or fork does starts
# a run, and every run must have been started by the repository owner.
# =============================================================================

name: Template check

on:
  push:
    paths:
      - 'templates/**'
      - 'catalog/terraform-modules/templates/**'
      - 'app-config.pipeline.yaml'
      - 'packages/backend/src/pipeline.ts'
      - 'packages/backend/src/pipeline/**'
      - 'edge/scripts/pipeline/**'
      - '.github/workflows/template-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-check-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # actions/checkout runs `git init`, which prints a hint about the default
  # branch name unless one is configured; name it so the hint is not printed.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  render:
    name: Render every template
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Render the templates
        run: yarn workspace @internal/edge template:check
