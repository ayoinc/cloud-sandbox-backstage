# =============================================================================
# Continuous Integration Workflow
# =============================================================================
# Runs on pushes to the main branch to validate the codebase. The repository
# is public: nothing a pull request, issue or fork does starts a run, and every
# run must have been started by the repository owner.
#
# Jobs:
# - build: Install dependencies and compile TypeScript
# - test: Run unit tests
# - lint: Run ESLint and Prettier checks
# - docker: Build Docker image (on main branch only)
# - summary: Generate CI summary report
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # actions/checkout runs `git init`, which prints a hint about the default
  # branch name unless one is configured; name it so the hint is not printed.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # ===========================================================================
  # Build Job
  # ===========================================================================
  build:
    name: Build
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    outputs:
      build_duration: ${{ steps.build_time.outputs.duration }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        id: install
        run: |
          start_time=$(date +%s)
          yarn install --immutable
          echo "install_duration=$(($(date +%s) - start_time))s" >> "$GITHUB_OUTPUT"

      - name: TypeScript compilation
        run: yarn tsc

      - name: Build backend
        id: build_time
        run: |
          start_time=$(date +%s)
          yarn build:backend
          echo "duration=$(($(date +%s) - start_time))s" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: packages/backend/dist/
          retention-days: 7

      - name: Generate build summary
        run: |
          {
            echo "## Build Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Node.js Version | ${{ env.NODE_VERSION }} |"
            echo "| Install Duration | ${{ steps.install.outputs.install_duration }} |"
            echo "| Build Duration | ${{ steps.build_time.outputs.duration }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Test Job
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      test_count: ${{ steps.test_results.outputs.count }}
      coverage: ${{ steps.test_results.outputs.coverage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        id: test_results
        run: |
          yarn test --coverage --passWithNoTests --json --outputFile=test-results.json 2>/dev/null || true
          yarn test --coverage --passWithNoTests

          # Extract test counts if results file exists
          if [ -f test-results.json ]; then
            total=$(jq '.numTotalTests // 0' test-results.json)
            passed=$(jq '.numPassedTests // 0' test-results.json)
            echo "count=${passed}/${total}" >> "$GITHUB_OUTPUT"
          else
            echo "count=N/A" >> "$GITHUB_OUTPUT"
          fi

          # Extract coverage if available
          if [ -f coverage/coverage-summary.json ]; then
            coverage=$(jq '.total.lines.pct // 0' coverage/coverage-summary.json)
            echo "coverage=${coverage}%" >> "$GITHUB_OUTPUT"
          else
            echo "coverage=N/A" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            test-results.json
            coverage/
          retention-days: 7

      - name: Generate test summary
        if: always()
        run: |
          {
            echo "## Test Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Tests Passed | ${{ steps.test_results.outputs.count }} |"
            echo "| Coverage | ${{ steps.test_results.outputs.coverage }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Lint Job
  # ===========================================================================
  lint:
    name: Lint
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        id: eslint
        run: yarn lint:all

      - name: Check Prettier formatting
        id: prettier
        run: yarn prettier:check

      - name: Generate lint summary
        if: always()
        run: |
          {
            echo "## Lint Results"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.eslint.outcome }}" == "success" ]; then
            echo "| ESLint | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ESLint | ❌ Failed |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.prettier.outcome }}" == "success" ]; then
            echo "| Prettier | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Prettier | ❌ Failed |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Docker Build and Push Job
  # ===========================================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-24.04
    needs: [build, test, lint]
    # Only build Docker image on main/master branch pushes
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      image_tag: ${{ steps.build_image.outputs.image_tag }}
      image_size: ${{ steps.build_image.outputs.image_size }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_image
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          start_time=$(date +%s)
          docker buildx build \
            --push \
            --tag "${IMAGE_TAG}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .
          echo "build_duration=$(($(date +%s) - start_time))s" >> "$GITHUB_OUTPUT"

          # Get image size
          docker pull "${IMAGE_TAG}"
          size=$(docker image inspect "${IMAGE_TAG}" --format='{{.Size}}' | numfmt --to=iec-i --suffix=B)
          echo "image_size=${size}" >> "$GITHUB_OUTPUT"

      - name: Test Docker image
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }} node --version

      - name: Generate Docker summary
        run: |
          {
            echo "## Docker Build Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Image | \`${{ steps.build_image.outputs.image_tag }}\` |"
            echo "| Size | ${{ steps.build_image.outputs.image_size }} |"
            echo "| Build Duration | ${{ steps.build_image.outputs.build_duration }} |"
            echo ""
            echo "### Pull Command"
            echo "\`\`\`bash"
            echo "docker pull ${{ steps.build_image.outputs.image_tag }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Summary Job
  # ===========================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    needs: [build, test, lint, docker]
    if: always() && github.actor == github.repository_owner
    steps:
      - name: Generate CI Summary
        env:
          # Never written into the script itself: a commit message is text
          # its author chose, and would be run as shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'N/A' }}
        run: |
          {
            echo "# CI Pipeline Summary"
            echo ""
            echo "## Run Information"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Commit Message | $(printf '%s' "$COMMIT_MESSAGE" | head -n 1) |"
            echo "| Triggered By | ${{ github.actor }} |"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Workflow Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "## Job Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || needs.build.result == 'failure' && '❌ Failed' || needs.build.result == 'skipped' && '⏭️ Skipped' || '⚠️ Unknown' }} |"
            echo "| Test | ${{ needs.test.result == 'success' && '✅ Passed' || needs.test.result == 'failure' && '❌ Failed' || needs.test.result == 'skipped' && '⏭️ Skipped' || '⚠️ Unknown' }} |"
            echo "| Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || needs.lint.result == 'failure' && '❌ Failed' || needs.lint.result == 'skipped' && '⏭️ Skipped' || '⚠️ Unknown' }} |"
            echo "| Docker | ${{ needs.docker.result == 'success' && '✅ Passed' || needs.docker.result == 'failure' && '❌ Failed' || needs.docker.result == 'skipped' && '⏭️ Skipped' || '⚠️ Unknown' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Overall status
          if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.lint.result }}" == "success" ]; then
            echo "## ✅ Pipeline Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Pipeline Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Docker image info if available
          if [ "${{ needs.docker.result }}" == "success" ]; then
            {
              echo "## Docker Image"
              echo ""
              echo "\`\`\`bash"
              echo "docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
