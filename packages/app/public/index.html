<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#1f2933"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#161c22"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Developer portal. Find services, APIs and documentation, and create new components from approved templates."
    />
    <meta name="application-name" content="Developer Portal" />
    <meta name="apple-mobile-web-app-title" content="Developer Portal" />
    <link
      rel="manifest"
      href="<%= publicPath %>/manifest.json"
      crossorigin="use-credentials"
    />
    <link rel="icon" href="<%= publicPath %>/favicon.ico" sizes="48x48" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="<%= publicPath %>/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= publicPath %>/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= publicPath %>/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= publicPath %>/apple-touch-icon.png"
    />
    <link
      rel="mask-icon"
      href="<%= publicPath %>/safari-pinned-tab.svg"
      color="#3f4a5a"
    />
    <title>
      <%= config.getOptionalString('app.title') ?? 'Developer Portal' %>
    </title>
    <style>
      /* Shown until the app renders into #root (and when JavaScript is off). */
      .brand-boot {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        box-sizing: border-box;
        background: #f4f3f7;
        color: #1a1c1e;
        font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        text-align: center;
      }
      .brand-boot__status {
        margin: 0;
        color: #43474e;
      }
      .brand-boot__bar {
        width: 160px;
        height: 4px;
        border-radius: 9999px;
        background: #dde2ea;
        overflow: hidden;
      }
      .brand-boot__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 9999px;
        background: #3f4a5a;
        animation: brand-boot-slide 1.5s ease-in-out infinite;
      }
      @keyframes brand-boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .brand-boot__bar::after {
          animation: none;
          width: 100%;
        }
      }
      @media (prefers-color-scheme: dark) {
        .brand-boot {
          background: #121316;
          color: #e3e2e6;
        }
        .brand-boot__status {
          color: #c3c6cf;
        }
        .brand-boot__bar {
          background: #3a4452;
        }
        .brand-boot__bar::after {
          background: #bcc7db;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <style>
        #root {
          display: none;
        }
      </style>
      <div class="brand-boot">
        <p class="brand-boot__status">
          You need to turn on JavaScript to use this portal.
        </p>
      </div>
    </noscript>
    <div id="root">
      <div class="brand-boot" role="status">
        <div class="brand-boot__bar" aria-hidden="true"></div>
        <p class="brand-boot__status">Loading</p>
      </div>
    </div>
  </body>
</html>
