apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-user-invite-template
  title: Invite User to GitHub Organization
  description: Invite a person to join a GitHub organization by email, optionally into teams.
  tags:
    - github
    - user
    - organization
    - management
spec:
  owner: platform-team
  type: management
  parameters:
    - title: User Information
      required:
        - org
        - inviteeEmail
        - role
      properties:
        org:
          title: GitHub Organization
          type: string
          description: The organization to invite the person to
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]*$'
          maxLength: 39
          ui:autofocus: true
          ui:help: 'The name in the address of the organization: github.com/<organization>'
        inviteeEmail:
          title: User Email
          type: string
          description: The email address of the person to invite
          format: email
          ui:help: 'The email address associated with their GitHub account'
        role:
          title: Organization Role
          type: string
          description: The role this user will have in the organization
          default: direct_member
          enum:
            - direct_member
            - admin
            - billing_manager
          enumNames:
            - Member (standard access)
            - Admin (full organization access)
            - Billing Manager (billing access only)
    - title: Team Assignment (Optional)
      properties:
        teamSlugs:
          title: Add to Teams
          type: array
          description: Slugs of the teams the user joins on accepting the invitation
          items:
            type: string
          uniqueItems: true
          ui:help: 'Example: engineering, devops, platform-team'

  steps:
    - id: invite-user
      name: Send Organization Invitation
      action: github:org:invitation:create
      input:
        org: ${{ parameters.org }}
        email: ${{ parameters.inviteeEmail }}
        role: ${{ parameters.role }}
        teamSlugs: ${{ parameters.teamSlugs }}

  output:
    links:
      - title: View Pending Invitations on GitHub
        url: https://github.com/orgs/${{ parameters.org }}/people/pending_invitations
      - title: View Organization Members
        url: https://github.com/orgs/${{ parameters.org }}/people
      - title: View Users in Backstage
        url: /catalog?filters[kind]=user
