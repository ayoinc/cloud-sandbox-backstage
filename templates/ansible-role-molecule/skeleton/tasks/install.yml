---
- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when:
    - ${{ values.rolePrefix }}_update_cache | bool
    - ansible_facts.os_family == 'Debian'

- name: Install packages
  ansible.builtin.package:
    name: '{{ __${{ values.rolePrefix }}_base_packages + ${{ values.rolePrefix }}_packages }}'
    state: present
