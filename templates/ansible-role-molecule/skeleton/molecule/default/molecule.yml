---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: ${{ values.moleculeDriver }}

platforms:
  - name: instance
    # Systemd-enabled images, rebuilt weekly and published without version
    # tags; MOLECULE_DISTRO selects the distribution.
{%- if values.moleculeDriver == 'podman' %}
    image: 'docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-${{ values.distros[0] }}}-ansible:latest'
    pre_build_image: true
    systemd: always
    command: /usr/lib/systemd/systemd
{%- else %}
    image: 'geerlingguy/docker-${MOLECULE_DISTRO:-${{ values.distros[0] }}}-ansible:latest'
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    pre_build_image: true
    # systemd needs a writable cgroup tree. Run the tests on a disposable
    # machine or CI runner, not on a shared host.
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
{%- endif %}

provisioner:
  name: ansible
  env:
    # converge.yml refers to the role by the name of its checkout directory.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      callback_result_format: yaml
      interpreter_python: auto_silent

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
