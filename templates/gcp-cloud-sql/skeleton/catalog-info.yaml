apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ (values.description or 'GCP Cloud SQL instance') | dump }}
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
  tags:
    - gcp
    - cloud-sql
    - database
    - ${{ values.environment }}
  links:
    - url: https://console.cloud.google.com/sql/instances
      title: GCP Console
      icon: cloud
spec:
  type: resource
  owner: ${{ values.owner }}
  lifecycle: ${{ values.environment }}
  system: database-services
