# Configuration of the dev stack. To take values and short-lived cloud
# credentials from Pulumi ESC instead, add an `environment:` list here; see
# "Pulumi ESC" in the README.
config:
  {% if values.cloud == 'aws' %}aws:region{% elif values.cloud == 'azure' %}azure-native:location{% else %}gcp:region{% endif %}: ${{ values.region }}
  ${{ values.name }}:logRetentionDays: 30
  ${{ values.name }}:forceDestroy: true
