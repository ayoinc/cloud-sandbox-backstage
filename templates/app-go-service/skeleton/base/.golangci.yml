version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - unconvert
  settings:
    sloglint:
      no-mixed-args: true

formatters:
  enable:
    - gofmt
    - goimports
