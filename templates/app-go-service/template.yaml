apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: app-go-service
  title: Go Service
  description: Create a Go HTTP service with structured logging, OpenTelemetry tracing and a distroless image
  tags:
    - go
    - api
    - backend
    - opentelemetry
    - docker
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:software-backend
  type: service

  parameters:
    - title: Project Information
      required:
        - name
        - owner
      properties:
        name:
          title: Project Name
          type: string
          description: Name of the project, the repository and the catalog entry
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 50
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What this project is for
        owner:
          title: Owner
          type: string
          description: Team that owns this resource
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Service Configuration
      required:
        - router
      properties:
        router:
          title: Router
          type: string
          description: The standard library ServeMux, or chi for route groups and per-route middleware
          enum:
            - stdlib
            - chi
          enumNames:
            - net/http ServeMux
            - chi
          default: stdlib

        port:
          title: Port
          type: integer
          description: Port the service listens on
          default: 8080
          minimum: 1024
          maximum: 65535

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton/base
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description or 'Go service' }}
          owner: ${{ parameters.owner }}
          router: ${{ parameters.router }}
          port: ${{ parameters.port or 8080 }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-router
      name: Add Router
      action: fetch:template
      input:
        url: ./skeleton/router-${{ parameters.router }}
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description or 'Go service' }}
          owner: ${{ parameters.owner }}
          router: ${{ parameters.router }}
          port: ${{ parameters.port or 8080 }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: 'Go service: ${{ parameters.name }}'
        repoVisibility: private
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
