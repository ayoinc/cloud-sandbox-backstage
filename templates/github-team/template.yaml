apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-team-template
  title: Create GitHub Team
  description: Create a new team in a GitHub organization.
  tags:
    - github
    - team
    - organization
    - management
spec:
  owner: platform-team
  type: management
  parameters:
    - title: Team Information
      required:
        - org
        - teamName
        - description
      properties:
        org:
          title: GitHub Organization
          type: string
          description: The organization to create the team in
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]*$'
          maxLength: 39
          ui:autofocus: true
          ui:help: 'The name in the address of the organization: github.com/<organization>'
        teamName:
          title: Team Name
          type: string
          description: The name of the team to create
          pattern: '^[a-zA-Z][a-zA-Z0-9\-_ ]+$'
          ui:help: 'Use letters, numbers, hyphens, underscores, or spaces'
        description:
          title: Description
          type: string
          description: A brief description of the team's purpose
        privacy:
          title: Team Privacy
          type: string
          description: The level of privacy for this team
          default: closed
          enum:
            - closed
            - secret
          enumNames:
            - Closed (visible to all org members)
            - Secret (only visible to team members)
        notificationSetting:
          title: Notification Setting
          type: string
          description: How team members receive notifications
          default: notifications_enabled
          enum:
            - notifications_enabled
            - notifications_disabled
          enumNames:
            - Enabled
            - Disabled

  steps:
    - id: create-team
      name: Create GitHub Team
      action: github:team:create
      input:
        org: ${{ parameters.org }}
        name: ${{ parameters.teamName }}
        description: ${{ parameters.description }}
        privacy: ${{ parameters.privacy }}
        notificationSetting: ${{ parameters.notificationSetting }}

  output:
    links:
      - title: View Teams on GitHub
        url: https://github.com/orgs/${{ parameters.org }}/teams
      - title: View Groups in Backstage
        url: /catalog?filters[kind]=group
