---
- name: Install the OpenSSH server
  ansible.builtin.package:
    name: openssh-server
    state: present

# Starting the service first makes sure host keys exist, which the
# configuration check below needs.
- name: Ensure the SSH daemon is enabled and running
  ansible.builtin.systemd_service:
    name: '{{ __linux_hardening_ssh_service }}'
    state: started
    enabled: true

- name: Ensure the main configuration reads the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload the SSH daemon

- name: Create the drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write the login banner
  ansible.builtin.copy:
    content: '{{ linux_hardening_ssh_banner }}'
    dest: /etc/issue.net
    owner: root
    group: root
    mode: '0644'
  when: linux_hardening_ssh_banner | length > 0

# sshd uses the first value it reads for each keyword, so the file name sorts
# ahead of the distribution's and cloud-init's own drop-ins.
- name: Write the hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload the SSH daemon

- name: Restrict permissions on the main configuration
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
