---
- name: Converge
  hosts: all
  become: true

  vars:
    # A container shares its kernel with the machine running the tests, so
    # kernel-wide state is written to disk but not activated here: sysctl
    # values and the audit subsystem belong to the host. The firewall is
    # loaded for real, inside the container's own network namespace.
    linux_hardening_sysctl_apply: false
    linux_hardening_auditd_apply: false
    linux_hardening_ssh_allow_groups:
      - sudo
      - wheel
    linux_hardening_sysctl_overrides:
      net.ipv4.ip_forward: 1
    linux_hardening_firewall_allowed_tcp_ports:
      - 443
    linux_hardening_auditd_extra_rules:
      - '-w /etc/ssh/sshd_config.d -p wa -k sshd-config'

  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
