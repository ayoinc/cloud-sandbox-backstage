apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.name }}
  description: ${{ (values.description or ('AWS CloudFront Distribution ' + values.name)) | dump }}
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
  tags:
    - aws
    - cloudfront
    - cdn
    - ${{ values.environment }}
  links:
    - url: https://console.aws.amazon.com/cloudfront/home
      title: AWS Console
      icon: cloud
spec:
  type: cdn
  owner: ${{ values.owner }}
  lifecycle: ${{ values.environment }}
  system: cloud-infrastructure
