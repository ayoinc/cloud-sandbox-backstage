# Renders and validates the composition and builds the configuration package
# on every push. A pushed tag such as v0.1.0 also publishes the package to the
# GitHub container registry. No cluster or cloud account is needed.
name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
{%- raw %}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CROSSPLANE_CLI_VERSION: 'v2.5.0'

jobs:
  test:
    name: Render Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the Crossplane CLI
        run: |
          curl -sfL "https://cli.crossplane.io/install.sh" | XP_VERSION="$CROSSPLANE_CLI_VERSION" sh
          sudo install crossplane /usr/local/bin/crossplane
          rm crossplane

      # Docker and yq are part of the runner image.
      - name: Render, validate and check
        run: make test

      - name: Upload rendered resources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered
          path: _output/*.yaml
          retention-days: 5

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the Crossplane CLI
        run: |
          curl -sfL "https://cli.crossplane.io/install.sh" | XP_VERSION="$CROSSPLANE_CLI_VERSION" sh
          sudo install crossplane /usr/local/bin/crossplane
          rm crossplane

      - name: Build
        run: make build

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: _output/*.xpkg
          retention-days: 5

  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install the Crossplane CLI
        run: |
          curl -sfL "https://cli.crossplane.io/install.sh" | XP_VERSION="$CROSSPLANE_CLI_VERSION" sh
          sudo install crossplane /usr/local/bin/crossplane
          rm crossplane

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: _output

      - name: Sign in to the GitHub container registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Push
        run: |
          package=$(ls _output/*.xpkg)
          crossplane xpkg push --package-files="$package" "ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME"
{% endraw %}
