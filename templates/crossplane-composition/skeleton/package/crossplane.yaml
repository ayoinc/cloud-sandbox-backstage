apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: ${{ values.name }}
  annotations:
    meta.crossplane.io/maintainer: ${{ values.owner | dump }}
    meta.crossplane.io/source: github.com/${{ values.destination.owner }}/${{ values.destination.repo }}
    meta.crossplane.io/description: ${{ values.description | dump }}
spec:
  crossplane:
    version: ">=v2.0.0"
  # Crossplane installs these with the configuration.
  dependsOn:
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform
      version: ">=v0.11.2"
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.7.3"
{%- if values.cloud == 'aws' %}
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      package: xpkg.crossplane.io/crossplane-contrib/provider-aws-s3
      version: ">=v2.9.0"
{%- elif values.cloud == 'azure' %}
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      package: xpkg.crossplane.io/crossplane-contrib/provider-family-azure
      version: ">=v2.8.0"
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      package: xpkg.crossplane.io/crossplane-contrib/provider-azure-storage
      version: ">=v2.8.0"
{%- else %}
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-storage
      version: ">=v3.1.0"
{%- endif %}
