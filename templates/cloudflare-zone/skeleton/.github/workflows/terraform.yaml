# Terraform pipeline for the Cloudflare zone.
#
# Every push is formatted, validated, linted, tested and scanned without a
# Cloudflare account. Plan, apply, destroy and drift detection run only once
# the CLOUDFLARE_*, R2_* and TF_STATE_BUCKET secrets exist. The API token is
# scoped to this zone; the state is kept in an R2 bucket.
name: Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
          - drift-detection
        default: plan
      confirm_destroy:
        description: Type DESTROY to confirm (destroy only)
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  PROJECT_NAME: ${{ values.name }}
  # Environment that a push to main plans and applies.
  DEFAULT_ENVIRONMENT: prod
{%- raw %}
  TF_VERSION: '1.17.1'
  TFLINT_VERSION: 'v0.66.0'
  TRIVY_VERSION: 'v0.76.2'
  CHECKOV_VERSION: '3.4.3'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialise without a backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate -no-color

  lint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Install TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  test:
    name: Terraform Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Initialise without a backend
        run: terraform init -backend=false

      - name: Run tests
        run: terraform test -no-color

      # Catches a variable file that no longer matches the configuration.
      - name: Plan every environment against mocked providers
        run: |
          for file in environments/*.tfvars; do
            echo "::group::$file"
            terraform test -no-color -test-directory=tests/environments -var-file="$file"
            echo "::endgroup::"
          done

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Run Trivy
        run: trivy config --exit-code 1 --severity CRITICAL,HIGH,MEDIUM .

      - name: Run Checkov
        run: pipx run --spec "checkov==$CHECKOV_VERSION" checkov --directory . --config-file .checkov.yaml

  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.target.outputs.action }}
      environment: ${{ steps.target.outputs.environment }}
      credentials: ${{ steps.credentials.outputs.present }}
    steps:
      - name: Resolve action and environment
        id: target
        env:
          INPUT_ACTION: ${{ inputs.action }}
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) action="$INPUT_ACTION"; environment="$DEFAULT_ENVIRONMENT" ;;
            *) action=apply; environment="$DEFAULT_ENVIRONMENT" ;;
          esac
          if [ "$action" = destroy ] && [ "$CONFIRM_DESTROY" != DESTROY ]; then
            echo "::error::Type DESTROY in the confirmation field to destroy $environment."
            exit 1
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

      # The secrets context cannot be read in a job-level `if`, so the presence
      # of the credentials is published as an output for the jobs below.
      - name: Detect credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          present=true
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY TF_STATE_BUCKET; do
            if [ -z "${!name}" ]; then
              present=false
              missing="${missing:+$missing, }$name"
            fi
          done
          if [ "$present" = false ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::Missing repository secrets: $missing. See the README."
              exit 1
            fi
            echo "::notice::Plan and apply are skipped until these repository secrets exist: $missing."
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: [setup, validate, lint, test, security]
    if: needs.setup.outputs.credentials == 'true' && (needs.setup.outputs.action == 'plan' || needs.setup.outputs.action == 'apply')
    env:
      TF_ENVIRONMENT: ${{ needs.setup.outputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Terraform state in R2, through the S3-compatible API.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Initialise
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$PROJECT_NAME/$TF_ENVIRONMENT/terraform.tfstate"

      - name: Plan
        run: terraform plan -no-color -var-file="environments/$TF_ENVIRONMENT.tfvars" -out=tfplan

      - name: Add the plan to the run summary
        run: |
          {
            echo "## Terraform plan ($TF_ENVIRONMENT)"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ needs.setup.outputs.environment }}
          path: tfplan
          retention-days: 5

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: [setup, plan]
    if: needs.setup.outputs.action == 'apply' && github.ref == 'refs/heads/main'
    environment: ${{ needs.setup.outputs.environment }}
    env:
      TF_ENVIRONMENT: ${{ needs.setup.outputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Terraform state in R2, through the S3-compatible API.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Initialise
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$PROJECT_NAME/$TF_ENVIRONMENT/terraform.tfstate"

      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ needs.setup.outputs.environment }}

      - name: Apply
        run: terraform apply -no-color tfplan

      - name: Add the outputs to the run summary
        run: |
          {
            echo "## Terraform outputs ($TF_ENVIRONMENT)"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.credentials == 'true' && needs.setup.outputs.action == 'destroy'
    environment: ${{ needs.setup.outputs.environment }}
    env:
      TF_ENVIRONMENT: ${{ needs.setup.outputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Terraform state in R2, through the S3-compatible API.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Initialise
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$PROJECT_NAME/$TF_ENVIRONMENT/terraform.tfstate"

      - name: Destroy
        run: terraform destroy -no-color -auto-approve -var-file="environments/$TF_ENVIRONMENT.tfvars"

  drift:
    name: Drift Detection
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.credentials == 'true' && needs.setup.outputs.action == 'drift-detection'
    permissions:
      contents: read
      issues: write
    env:
      TF_ENVIRONMENT: ${{ needs.setup.outputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Terraform state in R2, through the S3-compatible API.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Initialise
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$PROJECT_NAME/$TF_ENVIRONMENT/terraform.tfstate"

      # Exit code 2 from `plan -detailed-exitcode` means the deployed
      # infrastructure no longer matches the configuration.
      - name: Compare infrastructure with configuration
        id: drift
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -var-file="environments/$TF_ENVIRONMENT.tfvars" > drift.txt 2>&1
          code=$?
          set -e
          cat drift.txt
          case "$code" in
            0) echo "drifted=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "drifted=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Open an issue for the drift
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Drift detection found differences between the Terraform configuration and the \`$TF_ENVIRONMENT\` environment."
            echo
            echo '```'
            tail -c 60000 drift.txt
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > issue.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Infrastructure drift detected in $TF_ENVIRONMENT" \
            --body-file issue.md
{% endraw %}
