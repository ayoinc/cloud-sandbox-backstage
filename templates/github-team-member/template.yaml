apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-team-member-template
  title: Add User to GitHub Team
  description: Add a GitHub user to a team of a GitHub organization, or change their role in it.
  tags:
    - github
    - team
    - user
    - management
spec:
  owner: platform-team
  type: management
  parameters:
    - title: Team Membership
      required:
        - org
        - teamSlug
        - username
        - role
      properties:
        org:
          title: GitHub Organization
          type: string
          description: The organization the team belongs to
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]*$'
          maxLength: 39
          ui:autofocus: true
          ui:help: 'The name in the address of the organization: github.com/<organization>'
        teamSlug:
          title: Team Slug
          type: string
          description: The slug (URL-friendly name) of the team
          ui:help: 'Example: engineering, devops-team, platform-team'
        username:
          title: GitHub Username
          type: string
          description: The GitHub username to add to the team
          ui:help: 'A user who is not a member of the organization yet is invited to it'
        role:
          title: Team Role
          type: string
          description: The role this user will have in the team
          default: member
          enum:
            - member
            - maintainer
          enumNames:
            - Member (regular team access)
            - Maintainer (can manage team settings and members)

  steps:
    - id: add-member
      name: Add Team Member
      action: github:team:member:add
      input:
        org: ${{ parameters.org }}
        teamSlug: ${{ parameters.teamSlug }}
        username: ${{ parameters.username }}
        role: ${{ parameters.role }}

  output:
    links:
      - title: View Team on GitHub
        url: https://github.com/orgs/${{ parameters.org }}/teams/${{ parameters.teamSlug }}/members
      - title: View Groups in Backstage
        url: /catalog?filters[kind]=group
