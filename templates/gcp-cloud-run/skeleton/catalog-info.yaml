apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ (values.description or 'GCP Cloud Run service') | dump }}
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
  tags:
    - gcp
    - cloud-run
    - serverless
    - ${{ values.environment }}
  links:
    - url: https://console.cloud.google.com/run
      title: GCP Console
      icon: cloud
spec:
  type: service
  owner: ${{ values.owner }}
  lifecycle: ${{ values.environment }}
  system: backend-services
