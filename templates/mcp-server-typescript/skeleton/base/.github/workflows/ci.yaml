name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      - name: List the tools over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node dist/index.js --stdio | tee "$RUNNER_TEMP/stdio.out"
          grep --quiet '"add_note"' "$RUNNER_TEMP/stdio.out"

  image:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      # Signs the build provenance with the identity of this workflow run.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The token exists for this step only. The image exposes the port the
      # server listens on; Docker maps it to a free port on the runner.
      - name: Start the container and call the server
        run: |
          token="$(openssl rand -hex 32)"
          docker run --detach --name app --publish-all --env MCP_AUTH_TOKEN="$token" app:ci
          address="$(docker port app | head -n 1 | awk '{ print $NF }')"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://$address/healthz"; then
              echo
              break
            fi
            sleep 1
          done
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST "http://$address/mcp")"
          if [ "$status" != 401 ]; then
            echo "Expected 401 without a token, got $status"
            docker logs app
            exit 1
          fi
          curl --fail --silent --show-error "http://$address/mcp" \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | tee "$RUNNER_TEMP/tools.out"
          grep --quiet '"search_notes"' "$RUNNER_TEMP/tools.out"

      # Reports known vulnerabilities in the image. It does not fail the
      # build: the advisory database changes daily, so the same commit would
      # pass one day and fail the next.
      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          format: table
          severity: CRITICAL,HIGH

      - name: Log in to the GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # GitHub keeps attestations for public repositories, and for private
      # ones only on Enterprise Cloud: set the ATTEST_PRIVATE variable to
      # 'true' there.
      - name: Attest build provenance
        if: github.ref == 'refs/heads/main' && (!github.event.repository.private || vars.ATTEST_PRIVATE == 'true')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
