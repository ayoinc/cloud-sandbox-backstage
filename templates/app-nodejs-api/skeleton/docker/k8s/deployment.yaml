apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ${{ values.name }}
  template:
    metadata:
      labels:
        app: ${{ values.name }}
    spec:
      containers:
        - name: ${{ values.name }}
          image: ghcr.io/${{ values.destination.owner | lower }}/${{ values.destination.repo | lower }}:latest
          ports:
            - containerPort: ${{ values.port }}
          env:
            - name: APP_ENV
              value: ${{ values.environment }}
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health/live
              port: ${{ values.port }}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: ${{ values.port }}
            initialDelaySeconds: 5
