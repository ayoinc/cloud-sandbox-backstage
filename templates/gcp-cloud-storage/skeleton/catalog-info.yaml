apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
  tags:
    - gcp
    - cloud-storage
    - storage
    - ${{ values.environment }}
  links:
    - url: https://console.cloud.google.com/storage/browser
      title: GCP Console
      icon: cloud
spec:
  type: storage-bucket
  owner: ${{ values.owner }}
  lifecycle: ${{ values.environment }}
  system: cloud-infrastructure
