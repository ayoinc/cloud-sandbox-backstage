{%- set aws = values.cloud_provider == 'aws' or values.cloud_provider == 'multi-cloud' -%}
{%- set azure = values.cloud_provider == 'azure' or values.cloud_provider == 'multi-cloud' -%}
{%- set gcp = values.cloud_provider == 'gcp' or values.cloud_provider == 'multi-cloud' -%}
{%- set datadog = values.monitoring_solution == 'datadog' -%}
{%- set newrelic = values.monitoring_solution == 'new-relic' -%}
{%- set elastic = values.monitoring_solution == 'elastic-stack' -%}
{%- set multi = values.cloud_provider == 'multi-cloud' -%}
{%- set backend = "azurerm" if values.cloud_provider == "azure" else ("gcs" if values.cloud_provider == "gcp" else "s3") -%}
{%- set envs = [] -%}
{%- for e in ["development", "staging", "production"] %}{% if e in values.environments %}{% set envs = (envs.push(e), envs) %}{% endif %}{% endfor -%}
{%- set required = [] -%}
{%- set missing = [] -%}
{%- if aws -%}
  {%- set required = (required.push("secrets.AWS_ROLE_ARN"), required) -%}
  {%- set missing = (missing.push("AWS_ROLE_ARN"), missing) -%}
{%- endif -%}
{%- if azure -%}
  {%- set required = (required.push("secrets.AZURE_CLIENT_ID"), required.push("secrets.AZURE_TENANT_ID"), required.push("secrets.AZURE_SUBSCRIPTION_ID"), required) -%}
  {%- set missing = (missing.push("AZURE_CLIENT_ID"), missing.push("AZURE_TENANT_ID"), missing.push("AZURE_SUBSCRIPTION_ID"), missing) -%}
{%- endif -%}
{%- if gcp -%}
  {%- set required = (required.push("secrets.GCP_WORKLOAD_IDENTITY_PROVIDER"), required.push("secrets.GCP_SERVICE_ACCOUNT"), required.push("secrets.GCP_PROJECT_ID"), required) -%}
  {%- set missing = (missing.push("GCP_WORKLOAD_IDENTITY_PROVIDER"), missing.push("GCP_SERVICE_ACCOUNT"), missing.push("GCP_PROJECT_ID"), missing) -%}
{%- endif -%}
{%- if backend == "azurerm" -%}
  {%- set required = (required.push("secrets.TF_STATE_STORAGE_ACCOUNT"), required) -%}
  {%- set missing = (missing.push("TF_STATE_STORAGE_ACCOUNT"), missing) -%}
{%- else -%}
  {%- set required = (required.push("secrets.TF_STATE_BUCKET"), required) -%}
  {%- set missing = (missing.push("TF_STATE_BUCKET"), missing) -%}
{%- endif -%}
{%- if datadog -%}
  {%- set required = (required.push("secrets.DD_API_KEY"), required.push("secrets.DD_APP_KEY"), required) -%}
  {%- set missing = (missing.push("DD_API_KEY"), missing.push("DD_APP_KEY"), missing) -%}
{%- endif -%}
{%- if newrelic -%}
  {%- set required = (required.push("secrets.NEW_RELIC_API_KEY"), required.push("secrets.NEW_RELIC_ACCOUNT_ID"), required) -%}
  {%- set missing = (missing.push("NEW_RELIC_API_KEY"), missing.push("NEW_RELIC_ACCOUNT_ID"), missing) -%}
{%- endif -%}
{%- if elastic -%}
  {%- set required = (required.push("secrets.EC_API_KEY"), required) -%}
  {%- set missing = (missing.push("EC_API_KEY"), missing) -%}
{%- endif -%}
name: Terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the environments
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: terraform-{% raw %}${{ github.ref }}{% endraw %}
  cancel-in-progress: false

env:
  TF_VERSION: '1.17.1'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: {% raw %}${{ env.TF_VERSION }}{% endraw %}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialise without a backend
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0

      - name: Install TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: {% raw %}${{ github.token }}{% endraw %}

      - name: Run TFLint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: {% raw %}${{ env.TF_VERSION }}{% endraw %}

      # The tests plan against mocked providers, so they need no credentials.
      # One provider download serves the stack and all of its modules.
      - name: Test the stack and its modules
        run: |
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/terraform-plugins"
          export TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE=true
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for directory in . modules/*/ modules/integrations/*/; do
            [ -d "$directory/tests" ] || continue
            echo "::group::$directory"
            terraform -chdir="$directory" init -backend=false
            terraform -chdir="$directory" test
            echo "::endgroup::"
          done

  security:
    name: Security scan ({% raw %}${{ matrix.environment }}{% endraw %})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ envs | dump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The settings of the environment are passed in so that everything it
      # switches on is scanned.
      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          tf-vars: terraform.tfvars,environments/{% raw %}${{ matrix.environment }}{% endraw %}.tfvars
          severity: HIGH,CRITICAL
          exit-code: '1'

  # Plan, apply and destroy need the credentials checked below. Until all of
  # them are configured the jobs are skipped, so a new repository is green from
  # its first push.
  credentials:
    name: Check deployment credentials
    runs-on: ubuntu-24.04
    outputs:
      available: {% raw %}${{ steps.check.outputs.available }}{% endraw %}
    steps:
      - name: Look for deployment credentials
        id: check
        env:
          REQUIRED: {% raw %}${{ {% endraw %}${{ required | join(" && ") }}{% raw %} }}{% endraw %}
          MISSING: ${{ missing | join(", ") }}
        run: |
          if [ -n "$REQUIRED" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Plan and apply skipped. Set the repository secrets $MISSING to enable them."
          fi

  plan:
    name: Plan ({% raw %}${{ matrix.environment }}{% endraw %})
    needs: [validate, lint, test, security, credentials]
    if: needs.credentials.outputs.available == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ envs | dump }}
    permissions:
      contents: read
      id-token: write
    env:
{%- if aws %}
      AWS_REGION: ${{ values.region }}
{%- endif %}
{%- if azure %}
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: {% raw %}${{ secrets.AZURE_CLIENT_ID }}{% endraw %}
      ARM_TENANT_ID: {% raw %}${{ secrets.AZURE_TENANT_ID }}{% endraw %}
      ARM_SUBSCRIPTION_ID: {% raw %}${{ secrets.AZURE_SUBSCRIPTION_ID }}{% endraw %}
{%- endif %}
{%- if gcp %}
      TF_VAR_gcp_project_id: {% raw %}${{ secrets.GCP_PROJECT_ID }}{% endraw %}
{%- endif %}
{%- if datadog %}
      DD_API_KEY: {% raw %}${{ secrets.DD_API_KEY }}{% endraw %}
      DD_APP_KEY: {% raw %}${{ secrets.DD_APP_KEY }}{% endraw %}
{%- endif %}
{%- if newrelic %}
      NEW_RELIC_API_KEY: {% raw %}${{ secrets.NEW_RELIC_API_KEY }}{% endraw %}
      NEW_RELIC_ACCOUNT_ID: {% raw %}${{ secrets.NEW_RELIC_ACCOUNT_ID }}{% endraw %}
{%- endif %}
{%- if elastic %}
      EC_API_KEY: {% raw %}${{ secrets.EC_API_KEY }}{% endraw %}
{%- endif %}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: {% raw %}${{ env.TF_VERSION }}{% endraw %}
{%- if aws %}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: {% raw %}${{ secrets.AWS_ROLE_ARN }}{% endraw %}
          aws-region: ${{ values.region }}
{%- endif %}
{%- if gcp %}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: {% raw %}${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}{% endraw %}
          service_account: {% raw %}${{ secrets.GCP_SERVICE_ACCOUNT }}{% endraw %}
{%- endif %}

      - name: Initialise with the environment's remote state
        env:
          ENVIRONMENT: {% raw %}${{ matrix.environment }}{% endraw %}
{%- if backend == "azurerm" %}
          STATE_STORAGE_ACCOUNT: {% raw %}${{ secrets.TF_STATE_STORAGE_ACCOUNT }}{% endraw %}
          STATE_CONTAINER: {% raw %}${{ vars.TF_STATE_CONTAINER || 'tfstate' }}{% endraw %}
        run: |
          terraform init \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=${{ values.name }}/$ENVIRONMENT.tfstate"
{%- elif backend == "gcs" %}
          STATE_BUCKET: {% raw %}${{ secrets.TF_STATE_BUCKET }}{% endraw %}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="prefix=${{ values.name }}/$ENVIRONMENT"
{%- else %}
          STATE_BUCKET: {% raw %}${{ secrets.TF_STATE_BUCKET }}{% endraw %}
          STATE_REGION: {% raw %}${{ vars.TF_STATE_REGION || '{% endraw %}${{ values.region }}{% raw %}' }}{% endraw %}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=${{ values.name }}/$ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$STATE_REGION"
{%- endif %}

      - name: Plan
        env:
          ENVIRONMENT: {% raw %}${{ matrix.environment }}{% endraw %}
        run: terraform plan{% raw %}${{ github.event.inputs.action == 'destroy' && ' -destroy' || '' }}{% endraw %} -var-file="environments/$ENVIRONMENT.tfvars" -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v6
        with:
          name: tfplan-{% raw %}${{ matrix.environment }}{% endraw %}
          path: tfplan
          retention-days: 5

  apply:
    name: Apply ({% raw %}${{ matrix.environment }}{% endraw %})
    needs: [plan]
    # Pushes to main apply; manual runs apply or destroy only when asked to.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'plan')
    runs-on: ubuntu-24.04
    # One environment at a time, in the order listed.
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        environment: ${{ envs | dump }}
    environment: {% raw %}${{ matrix.environment }}{% endraw %}
    permissions:
      contents: read
      id-token: write
    env:
{%- if aws %}
      AWS_REGION: ${{ values.region }}
{%- endif %}
{%- if azure %}
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: {% raw %}${{ secrets.AZURE_CLIENT_ID }}{% endraw %}
      ARM_TENANT_ID: {% raw %}${{ secrets.AZURE_TENANT_ID }}{% endraw %}
      ARM_SUBSCRIPTION_ID: {% raw %}${{ secrets.AZURE_SUBSCRIPTION_ID }}{% endraw %}
{%- endif %}
{%- if gcp %}
      TF_VAR_gcp_project_id: {% raw %}${{ secrets.GCP_PROJECT_ID }}{% endraw %}
{%- endif %}
{%- if datadog %}
      DD_API_KEY: {% raw %}${{ secrets.DD_API_KEY }}{% endraw %}
      DD_APP_KEY: {% raw %}${{ secrets.DD_APP_KEY }}{% endraw %}
{%- endif %}
{%- if newrelic %}
      NEW_RELIC_API_KEY: {% raw %}${{ secrets.NEW_RELIC_API_KEY }}{% endraw %}
      NEW_RELIC_ACCOUNT_ID: {% raw %}${{ secrets.NEW_RELIC_ACCOUNT_ID }}{% endraw %}
{%- endif %}
{%- if elastic %}
      EC_API_KEY: {% raw %}${{ secrets.EC_API_KEY }}{% endraw %}
{%- endif %}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: {% raw %}${{ env.TF_VERSION }}{% endraw %}
{%- if aws %}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: {% raw %}${{ secrets.AWS_ROLE_ARN }}{% endraw %}
          aws-region: ${{ values.region }}
{%- endif %}
{%- if gcp %}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: {% raw %}${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}{% endraw %}
          service_account: {% raw %}${{ secrets.GCP_SERVICE_ACCOUNT }}{% endraw %}
{%- endif %}

      - name: Initialise with the environment's remote state
        env:
          ENVIRONMENT: {% raw %}${{ matrix.environment }}{% endraw %}
{%- if backend == "azurerm" %}
          STATE_STORAGE_ACCOUNT: {% raw %}${{ secrets.TF_STATE_STORAGE_ACCOUNT }}{% endraw %}
          STATE_CONTAINER: {% raw %}${{ vars.TF_STATE_CONTAINER || 'tfstate' }}{% endraw %}
        run: |
          terraform init \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=${{ values.name }}/$ENVIRONMENT.tfstate"
{%- elif backend == "gcs" %}
          STATE_BUCKET: {% raw %}${{ secrets.TF_STATE_BUCKET }}{% endraw %}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="prefix=${{ values.name }}/$ENVIRONMENT"
{%- else %}
          STATE_BUCKET: {% raw %}${{ secrets.TF_STATE_BUCKET }}{% endraw %}
          STATE_REGION: {% raw %}${{ vars.TF_STATE_REGION || '{% endraw %}${{ values.region }}{% raw %}' }}{% endraw %}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=${{ values.name }}/$ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$STATE_REGION"
{%- endif %}

      - name: Download plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan-{% raw %}${{ matrix.environment }}{% endraw %}

      - name: Apply plan
        run: terraform apply tfplan
