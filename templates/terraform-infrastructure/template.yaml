apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: terraform-infrastructure
  title: Terraform Infrastructure
  description: Create enterprise-grade cloud infrastructure with Terraform, including security, monitoring, and compliance
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - recommended
    - terraform
    - infrastructure
    - cloud
    - security
    - monitoring
spec:
  owner: platform-team
  type: infrastructure
  parameters:
    - title: Infrastructure Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Infrastructure Name
          type: string
          description: Name of the infrastructure stack
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 40
          ui:autofocus: true
          ui:help: 'Lowercase letters, numbers and hyphens, starting with a letter'
        description:
          title: Description
          type: string
          description: Brief description of the infrastructure purpose
        owner:
          title: Owner
          type: string
          description: Owner of the infrastructure
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
    - title: Cloud & Infrastructure Components
      required:
        - cloud_provider
      properties:
        cloud_provider:
          title: Cloud Provider
          type: string
          description: Primary cloud platform
          default: aws
          enum:
            - aws
            - azure
            - gcp
            - multi-cloud
          enumNames:
            - Amazon Web Services
            - Microsoft Azure
            - Google Cloud Platform
            - Multi-Cloud Setup (the same stack on all three)
        infrastructure_type:
          title: Infrastructure Type
          type: string
          description: Primary infrastructure pattern. Container, ML and serverless platforms add a container registry; data and ML platforms add data-lake storage; the networking foundation adds a private DNS zone.
          default: web-application
          enum:
            - web-application
            - data-platform
            - ml-platform
            - container-platform
            - serverless-platform
            - networking-foundation
          enumNames:
            - Web Application Stack
            - Data Platform
            - ML/AI Platform
            - Container Platform (EKS/AKS/GKE)
            - Serverless Platform
            - Networking Foundation
        enable_networking:
          title: Enable Custom Networking
          type: boolean
          description: Create VPC/VNet with subnets. When off, an existing network must be named in terraform.tfvars before components that need one can be deployed.
          default: true
        enable_database:
          title: Enable Database
          type: boolean
          description: Include managed database services
          default: false
        enable_storage:
          title: Enable Object Storage
          type: boolean
          description: Include object storage (S3, Blob, etc.)
          default: true
        enable_cdn:
          title: Enable CDN
          type: boolean
          description: Include CDN for content delivery in front of the object storage (which is then created too)
          default: false
      # Regions and the databases on offer differ per provider, so these
      # fields follow the provider chosen above.
      dependencies:
        cloud_provider:
          oneOf:
            - properties:
                cloud_provider:
                  enum:
                    - aws
                region:
                  title: AWS Region
                  type: string
                  description: Region of the stack
                  default: us-east-1
                database_type:
                  title: Database Type
                  type: string
                  description: Type of managed database; used when Enable Database is on
                  default: postgresql
                  enum:
                    - postgresql
                    - mysql
                    - mongodb
                    - redis
                    - dynamodb
                  enumNames:
                    - PostgreSQL (RDS)
                    - MySQL (RDS)
                    - MongoDB compatible (DocumentDB)
                    - Redis (ElastiCache)
                    - DynamoDB
            - properties:
                cloud_provider:
                  enum:
                    - azure
                azure_location:
                  title: Azure Location
                  type: string
                  description: Location of the stack
                  default: eastus2
                database_type:
                  title: Database Type
                  type: string
                  description: Type of managed database; used when Enable Database is on
                  default: postgresql
                  enum:
                    - postgresql
                    - mysql
                    - mongodb
                    - redis
                    - cosmosdb
                  enumNames:
                    - PostgreSQL (Flexible Server)
                    - MySQL (Flexible Server)
                    - MongoDB (Cosmos DB for MongoDB)
                    - Redis (Azure Managed Redis)
                    - Cosmos DB (NoSQL)
            - properties:
                cloud_provider:
                  enum:
                    - gcp
                gcp_region:
                  title: Google Cloud Region
                  type: string
                  description: Region of the stack
                  default: us-central1
                database_type:
                  title: Database Type
                  type: string
                  description: Type of managed database; used when Enable Database is on
                  default: postgresql
                  enum:
                    - postgresql
                    - mysql
                    - redis
                  enumNames:
                    - PostgreSQL (Cloud SQL)
                    - MySQL (Cloud SQL)
                    - Redis (Memorystore)
            - properties:
                cloud_provider:
                  enum:
                    - multi-cloud
                region:
                  title: AWS Region
                  type: string
                  description: Region of the AWS part of the stack
                  default: us-east-1
                azure_location:
                  title: Azure Location
                  type: string
                  description: Location of the Azure part of the stack
                  default: eastus2
                gcp_region:
                  title: Google Cloud Region
                  type: string
                  description: Region of the Google Cloud part of the stack
                  default: us-central1
                database_type:
                  title: Database Type
                  type: string
                  description: Type of managed database; used when Enable Database is on
                  default: postgresql
                  enum:
                    - postgresql
                    - mysql
                    - redis
                  enumNames:
                    - PostgreSQL
                    - MySQL
                    - Redis
    - title: Compute & Container Services
      properties:
        enable_kubernetes:
          title: Enable Kubernetes
          type: boolean
          description: Deploy managed Kubernetes cluster
          default: false
        kubernetes_version:
          title: Kubernetes Version
          type: string
          description: Kubernetes version for the cluster
          default: default
          enum:
            - default
            - '1.35'
            - '1.36'
          enumNames:
            - Current default of the cloud
            - '1.35'
            - '1.36'
        node_instance_type:
          title: Node Instance Type
          type: string
          description: Instance type for Kubernetes nodes
          default: medium
          enum:
            - small
            - medium
            - large
            - xlarge
          enumNames:
            - Small (2 vCPU, 4GB RAM)
            - Medium (4 vCPU, 8GB RAM)
            - Large (8 vCPU, 16GB RAM)
            - XLarge (16 vCPU, 32GB RAM)
        enable_autoscaling:
          title: Enable Auto Scaling
          type: boolean
          description: Enable cluster auto-scaling between the minimum and maximum number of nodes; when off the cluster keeps the minimum
          default: true
        min_nodes:
          title: Minimum Nodes
          type: integer
          description: Minimum number of nodes
          default: 2
          minimum: 1
        max_nodes:
          title: Maximum Nodes
          type: integer
          description: Maximum number of nodes
          default: 10
          minimum: 1
    - title: Security & Compliance
      properties:
        enable_security_group_rules:
          title: Enable Security Groups/NSGs
          type: boolean
          description: Create tiered security group rules (web, app, data). When off, data stores accept traffic from the whole network range.
          default: true
        enable_waf:
          title: Enable Web Application Firewall
          type: boolean
          description: Include WAF for web protection
          default: false
        enable_secrets_manager:
          title: Enable Secrets Management
          type: boolean
          description: Include secrets manager service
          default: true
        enable_kms:
          title: Enable Key Management
          type: boolean
          description: Include KMS for encryption
          default: true
        enable_backup:
          title: Enable Backup Solutions
          type: boolean
          description: Include backup services
          default: true
        compliance_framework:
          title: Compliance Framework
          type: string
          description: Applies the framework's baseline to the stack (minimum log retention, customer-managed keys, backups, deletion protection, flow logs) and tags every resource. It does not replace an audit.
          default: none
          enum:
            - none
            - cis
            - pci-dss
            - hipaa
            - sox
            - gdpr
          enumNames:
            - No Specific Framework
            - CIS Benchmarks
            - PCI DSS
            - HIPAA
            - SOX
            - GDPR
    - title: Monitoring & Observability
      properties:
        enable_monitoring:
          title: Enable Monitoring Stack
          type: boolean
          description: Include monitoring and logging
          default: true
        monitoring_solution:
          title: Monitoring Solution
          type: string
          description: Monitoring platform. The cloud's own logging is always set up; the other choices add a managed Prometheus and Grafana, an Elastic Cloud deployment, or connect the cloud account to Datadog or New Relic.
          default: native
          enum:
            - native
            - prometheus-grafana
            - elastic-stack
            - datadog
            - new-relic
          enumNames:
            - Native Cloud Monitoring
            - Prometheus + Grafana (managed)
            - Elastic Stack (Elastic Cloud)
            - Datadog
            - New Relic
        enable_alerting:
          title: Enable Alerting
          type: boolean
          description: Setup alerting and notifications
          default: true
        log_retention_days:
          title: Log Retention (Days)
          type: integer
          description: Number of days to retain logs; a compliance framework can raise it
          default: 30
          enum: [7, 30, 90, 365]
    - title: Environment & Deployment
      properties:
        environments:
          title: Environments to Create
          type: array
          description: Target environments; each gets its own settings file, state and pipeline stage
          default: ['staging', 'production']
          minItems: 1
          items:
            type: string
            enum: ['development', 'staging', 'production']
          uniqueItems: true
          ui:widget: checkboxes
        enable_disaster_recovery:
          title: Enable Disaster Recovery
          type: boolean
          description: Setup multi-region disaster recovery
          default: false
        enable_cost_optimization:
          title: Enable Cost Optimization
          type: boolean
          description: Include cost optimization features
          default: true
        terraform_version:
          title: Terraform Version Constraint
          type: string
          description: Terraform version requirement. The modules and their tests need at least 1.10.
          default: '>= 1.10'
          enum:
            - '>= 1.10'
            - '>= 1.12'
            - '>= 1.14'
  steps:
    - id: fetch
      name: Fetch Infrastructure Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          cloud_provider: ${{ parameters.cloud_provider }}
          region: ${{ parameters.region }}
          azure_location: ${{ parameters.azure_location }}
          gcp_region: ${{ parameters.gcp_region }}
          infrastructure_type: ${{ parameters.infrastructure_type }}
          enable_networking: ${{ parameters.enable_networking }}
          enable_database: ${{ parameters.enable_database }}
          database_type: ${{ parameters.database_type }}
          enable_storage: ${{ parameters.enable_storage }}
          enable_cdn: ${{ parameters.enable_cdn }}
          enable_kubernetes: ${{ parameters.enable_kubernetes }}
          kubernetes_version: ${{ parameters.kubernetes_version }}
          node_instance_type: ${{ parameters.node_instance_type }}
          enable_autoscaling: ${{ parameters.enable_autoscaling }}
          min_nodes: ${{ parameters.min_nodes }}
          max_nodes: ${{ parameters.max_nodes }}
          enable_security_group_rules: ${{ parameters.enable_security_group_rules }}
          enable_waf: ${{ parameters.enable_waf }}
          enable_secrets_manager: ${{ parameters.enable_secrets_manager }}
          enable_kms: ${{ parameters.enable_kms }}
          enable_backup: ${{ parameters.enable_backup }}
          compliance_framework: ${{ parameters.compliance_framework }}
          enable_monitoring: ${{ parameters.enable_monitoring }}
          monitoring_solution: ${{ parameters.monitoring_solution }}
          enable_alerting: ${{ parameters.enable_alerting }}
          log_retention_days: ${{ parameters.log_retention_days }}
          environments: ${{ parameters.environments }}
          enable_disaster_recovery: ${{ parameters.enable_disaster_recovery }}
          enable_cost_optimization: ${{ parameters.enable_cost_optimization }}
          terraform_version: ${{ parameters.terraform_version }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    # The skeleton carries the modules of every provider, every third-party
    # monitoring integration and every environment; only the chosen ones stay.
    - id: remove-aws
      name: Remove AWS Modules
      if: ${{ parameters.cloud_provider != 'aws' and parameters.cloud_provider != 'multi-cloud' }}
      action: fs:delete
      input:
        files:
          - modules/aws
          - modules/integrations/*-aws/**
    - id: remove-azure
      name: Remove Azure Modules
      if: ${{ parameters.cloud_provider != 'azure' and parameters.cloud_provider != 'multi-cloud' }}
      action: fs:delete
      input:
        files:
          - modules/azure
          - modules/integrations/*-azure/**
    - id: remove-gcp
      name: Remove Google Cloud Modules
      if: ${{ parameters.cloud_provider != 'gcp' and parameters.cloud_provider != 'multi-cloud' }}
      action: fs:delete
      input:
        files:
          - modules/gcp
          - modules/integrations/*-gcp/**
    - id: remove-datadog
      name: Remove Datadog Integration
      if: ${{ parameters.monitoring_solution != 'datadog' }}
      action: fs:delete
      input:
        files:
          - modules/integrations/datadog-*/**
    - id: remove-newrelic
      name: Remove New Relic Integration
      if: ${{ parameters.monitoring_solution != 'new-relic' }}
      action: fs:delete
      input:
        files:
          - modules/integrations/newrelic-*/**
    - id: remove-elastic
      name: Remove Elastic Integration
      if: ${{ parameters.monitoring_solution != 'elastic-stack' }}
      action: fs:delete
      input:
        files:
          - modules/integrations/elastic
    - id: remove-development
      name: Remove Development Environment
      if: ${{ not ('development' in parameters.environments) }}
      action: fs:delete
      input:
        files:
          - environments/development.tfvars
    - id: remove-staging
      name: Remove Staging Environment
      if: ${{ not ('staging' in parameters.environments) }}
      action: fs:delete
      input:
        files:
          - environments/staging.tfvars
    - id: remove-production
      name: Remove Production Environment
      if: ${{ not ('production' in parameters.environments) }}
      action: fs:delete
      input:
        files:
          - environments/production.tfvars

    - id: publish
      name: Publish to Repository
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: 'Initial infrastructure setup from DevOps Platform'

    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Infrastructure Documentation
        icon: docs
        url: ${{ steps.publish.output.remoteUrl }}/blob/main/README.md
