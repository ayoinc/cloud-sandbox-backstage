# Creates the Secret "podinfo-values" that the HelmRelease reads chart values
# from. Nothing secret is stored in Git: this resource only says where to read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: podinfo-values
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${{ values.secret_store }}
  target:
    name: podinfo-values
    creationPolicy: Owner
  data:
    # The remote entry holds a YAML document of chart values. Each cluster's
    # overlay replaces the key with podinfo/<cluster>.
    - secretKey: values.yaml
      remoteRef:
        key: podinfo/base
