apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production
  prune: true
  wait: true
{%- if values.secrets_backend == 'sops' %}
  # Files named *.sops.yaml are decrypted with the age key in this Secret,
  # which exists only in the cluster. See the README for how to create it.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
{%- endif %}
