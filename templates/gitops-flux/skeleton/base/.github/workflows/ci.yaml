name: CI

on:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and validate manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: yamllint
        run: pipx run yamllint==1.38.0 --strict .

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      # Renders every kustomization and checks the result against the
      # Kubernetes, Flux and other CRD schemas, and that no Secret is
      # committed unencrypted.
      - name: Render and validate
        run: bash scripts/validate.sh

  # Installs Flux on a throwaway cluster and applies the controllers layer, to
  # catch what schemas cannot: charts that do not install, CRDs that are missing.
  install:
    name: Install infrastructure on kind
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Flux CLI
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: '2.10.0'

      - name: Create a kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: flux

      - name: Install Flux
        run: flux install

      - name: Apply the controllers and their configuration
        run: |
          kubectl apply --kustomize infrastructure/controllers
          kubectl wait helmrelease --all --all-namespaces --for=condition=Ready --timeout=10m
          kubectl apply --kustomize infrastructure/configs
          kubectl wait clusterissuer --all --for=condition=Ready --timeout=2m

      - name: Show the state of Flux
        if: failure()
        run: |
          flux get all --all-namespaces
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -n 50

  security:
    name: Scan for misconfigurations and secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
