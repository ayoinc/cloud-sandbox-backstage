[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "${{ values.name }}"
version = "0.1.0"
description = ${{ values.description | dump }}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
{%- if values.provider == 'anthropic' %}
    "anthropic>=2.8,<3",
{%- elif values.provider == 'openai' %}
    "openai>=3.49,<4",
{%- elif values.provider == 'bedrock' %}
    "boto3>=1.44,<2",
{%- endif %}
    "fastapi>=0.162,<1",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b2,<1",
    "opentelemetry-sdk>=1.45,<2",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    # The HTTP client behind FastAPI's TestClient.
    "httpx2>=2.16,<3",
    "mypy==2.4.1",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=agent --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# The provider adapter calls the network; its message conversion is tested.
omit = ["src/agent/telemetry.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use fixed example credentials.
"tests/*" = ["S101", "S105", "S106"]
# Holds values written when the repository was created, which may be long.
"src/agent/defaults.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "evals"]
plugins = ["pydantic.mypy"]
{%- if values.provider == 'bedrock' %}

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
{%- endif %}
