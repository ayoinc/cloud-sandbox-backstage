name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true

      # Fails when uv.lock does not match pyproject.toml.
      - name: Install the project and its development dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      # The tests use a scripted model: no provider is called and no
      # credentials are needed. Coverage options are set in pyproject.toml.
      - name: Pytest
        run: uv run pytest

      - name: Start the server and call the health endpoint
        run: |
          uv run uvicorn --factory agent.main:app --port 8000 &
          for _ in $(seq 1 15); do
            if curl --fail --silent http://localhost:8000/healthz; then
              echo
              exit 0
            fi
            sleep 1
          done
          exit 1

  image:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      # Signs the build provenance with the identity of this workflow run.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container runs without provider credentials: liveness does not
      # depend on them. Docker maps the exposed port to a free port.
      - name: Start the container and call the health endpoint
        run: |
          docker run --detach --name app --publish-all app:ci
          address="$(docker port app | head -n 1 | awk '{ print $NF }')"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://$address/healthz"; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      # Reports known vulnerabilities in the image. It does not fail the
      # build: the advisory database changes daily, so the same commit would
      # pass one day and fail the next.
      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          format: table
          severity: CRITICAL,HIGH

      - name: Log in to the GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # GitHub keeps attestations for public repositories, and for private
      # ones only on Enterprise Cloud: set the ATTEST_PRIVATE variable to
      # 'true' there.
      - name: Attest build provenance
        if: github.ref == 'refs/heads/main' && (!github.event.repository.private || vars.ATTEST_PRIVATE == 'true')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
