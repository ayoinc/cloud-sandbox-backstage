apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: app-hono-worker
  title: Hono API on Cloudflare Workers
  description: Create a TypeScript Hono API on Cloudflare Workers with an optional D1 or KV binding and tests that run in the Workers runtime
  tags:
    - typescript
    - hono
    - cloudflare
    - workers
    - api
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:software-backend
  type: service

  parameters:
    - title: Project Information
      required:
        - name
        - owner
      properties:
        name:
          title: Project Name
          type: string
          description: Name of the project, the repository and the catalog entry
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 50
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What this project is for
        owner:
          title: Owner
          type: string
          description: Team that owns this resource
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Worker Configuration
      required:
        - binding
      properties:
        binding:
          title: Storage Binding
          type: string
          description: Storage the Worker is bound to. The resource is created on the first deployment; no identifier is written to the repository
          enum:
            - none
            - d1
            - kv
          enumNames:
            - None
            - D1 (SQL database)
            - KV (key-value store)
          default: none

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton/base
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description or 'Hono API on Cloudflare Workers' }}
          owner: ${{ parameters.owner }}
          binding: ${{ parameters.binding }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-binding
      name: Add Routes and Tests
      action: fetch:template
      input:
        url: ./skeleton/binding-${{ parameters.binding }}
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description or 'Hono API on Cloudflare Workers' }}
          owner: ${{ parameters.owner }}
          binding: ${{ parameters.binding }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: 'Cloudflare Worker: ${{ parameters.name }}'
        repoVisibility: private
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
