spring:
  application:
    name: ${{ values.name }}

server:
  port: ${SERVER_PORT:${{ values.serverPort }}}

app:
  environment: ${APP_ENV:${{ values.environment }}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.example: DEBUG
