apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-api
  title: Python API Service
  description: Create a tested FastAPI service with a container image and a GitHub Actions pipeline
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - recommended
    - python
    - api
    - fastapi
    - microservice
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Service Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: Name of the service, its repository and its catalog entry
          pattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
          ui:help: 'Lowercase letters, numbers and hyphens, starting with a letter'
        description:
          title: Description
          type: string
          description: Brief description of the API service
        owner:
          title: Owner
          type: string
          description: Owner of the service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

    - title: Runtime
      properties:
        python_version:
          title: Python Version
          type: string
          description: Version used by the pipeline, the container image and the linters
          default: '3.12'
          enum:
            - '3.11'
            - '3.12'
            - '3.13'

    - title: Database and Cache
      properties:
        database_type:
          title: Database
          type: string
          description: Where the items of the sample resource are stored
          default: postgresql
          enum:
            - none
            - postgresql
            - mysql
            - sqlite
          enumNames:
            - No database (items kept in memory)
            - PostgreSQL (SQLAlchemy, asyncpg)
            - MySQL (SQLAlchemy, aiomysql)
            - SQLite (SQLAlchemy, aiosqlite)
        enable_caching:
          title: Enable Caching
          type: boolean
          description: Cache item reads in Redis when REDIS_URL is set, otherwise in memory
          default: true
      dependencies:
        database_type:
          oneOf:
            - properties:
                database_type:
                  enum:
                    - none
            - properties:
                database_type:
                  enum:
                    - postgresql
                    - mysql
                    - sqlite
                enable_migrations:
                  title: Enable Database Migrations
                  type: boolean
                  description: Manage the schema with Alembic migrations. Without them, python -m app.init_db creates the tables.
                  default: true

    - title: Authentication and Security
      properties:
        auth_type:
          title: Authentication
          type: string
          description: How callers of the items API authenticate
          default: jwt
          enum:
            - none
            - jwt
            - api-key
            - basic-auth
          enumNames:
            - No authentication
            - JWT bearer tokens
            - API key header
            - HTTP Basic
        enable_rate_limiting:
          title: Enable Rate Limiting
          type: boolean
          description: Limit requests per client address with slowapi
          default: true
        enable_cors:
          title: Enable CORS
          type: boolean
          description: Allow browser calls from the origins listed in CORS_ORIGINS
          default: true
        enable_security_headers:
          title: Enable Security Headers
          type: boolean
          description: Add security headers to every response
          default: true

    - title: Features
      properties:
        enable_docs:
          title: Enable API Documentation
          type: boolean
          description: Serve Swagger UI, ReDoc and the OpenAPI document
          default: true
        enable_logging:
          title: Enable Structured Logging
          type: boolean
          description: Log every request as JSON with structlog
          default: true
        enable_metrics:
          title: Enable Metrics
          type: boolean
          description: Expose Prometheus metrics on /metrics
          default: true

    - title: Quality Checks
      properties:
        enable_coverage:
          title: Enable Code Coverage
          type: boolean
          description: Measure coverage in the test run and fail below 90 percent
          default: true
        enable_linting:
          title: Enable Linting
          type: boolean
          description: Add a workflow that checks the code with Ruff (lint and format)
          default: true
        enable_type_checking:
          title: Enable Type Checking
          type: boolean
          description: Add a workflow that checks the code with mypy in strict mode
          default: true

    - title: Deployment
      properties:
        containerization:
          title: Containerization
          type: string
          description: Files added next to the Dockerfile, which every service gets
          default: docker
          enum:
            - docker
            - docker-compose
            - kubernetes
          enumNames:
            - Dockerfile only
            - Dockerfile and Docker Compose stack
            - Dockerfile and Kubernetes manifests

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton/base
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description or 'Python API service' }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          python_version: ${{ parameters.python_version }}
          database_type: ${{ parameters.database_type }}
          sql: ${{ parameters.database_type != 'none' }}
          migrations: ${{ parameters.database_type != 'none' and parameters.enable_migrations }}
          enable_caching: ${{ parameters.enable_caching }}
          auth_type: ${{ parameters.auth_type }}
          enable_rate_limiting: ${{ parameters.enable_rate_limiting }}
          enable_cors: ${{ parameters.enable_cors }}
          enable_security_headers: ${{ parameters.enable_security_headers }}
          enable_docs: ${{ parameters.enable_docs }}
          enable_logging: ${{ parameters.enable_logging }}
          enable_metrics: ${{ parameters.enable_metrics }}
          enable_coverage: ${{ parameters.enable_coverage }}
          enable_linting: ${{ parameters.enable_linting }}
          enable_type_checking: ${{ parameters.enable_type_checking }}
          containerization: ${{ parameters.containerization }}

    - id: fetch-database
      name: Add Item Storage
      action: fetch:template
      input:
        url: ./skeleton/db-${{ 'none' if parameters.database_type == 'none' else 'sql' }}

    - id: fetch-migrations
      name: Add Alembic Migrations
      if: ${{ parameters.database_type != 'none' and parameters.enable_migrations }}
      action: fetch:template
      input:
        url: ./skeleton/migrations
        copyWithoutTemplating:
          - migrations/script.py.mako

    - id: fetch-db-init
      name: Add Table Creation Command
      if: ${{ parameters.database_type != 'none' and not parameters.enable_migrations }}
      action: fetch:template
      input:
        url: ./skeleton/db-init

    - id: fetch-caching
      name: Add Cache
      if: ${{ parameters.enable_caching }}
      action: fetch:template
      input:
        url: ./skeleton/caching

    - id: fetch-auth
      name: Add Authentication
      if: ${{ parameters.auth_type != 'none' }}
      action: fetch:template
      input:
        url: ./skeleton/auth-${{ parameters.auth_type }}

    - id: fetch-rate-limiting
      name: Add Rate Limiting
      if: ${{ parameters.enable_rate_limiting }}
      action: fetch:template
      input:
        url: ./skeleton/rate-limiting

    - id: fetch-cors
      name: Add CORS Tests
      if: ${{ parameters.enable_cors }}
      action: fetch:template
      input:
        url: ./skeleton/cors

    - id: fetch-security-headers
      name: Add Security Headers
      if: ${{ parameters.enable_security_headers }}
      action: fetch:template
      input:
        url: ./skeleton/security-headers

    - id: fetch-docs
      name: Add API Documentation Tests
      action: fetch:template
      input:
        url: ./skeleton/docs-${{ 'true' if parameters.enable_docs else 'false' }}

    - id: fetch-logging
      name: Add Structured Logging
      if: ${{ parameters.enable_logging }}
      action: fetch:template
      input:
        url: ./skeleton/logging

    - id: fetch-metrics
      name: Add Metrics
      if: ${{ parameters.enable_metrics }}
      action: fetch:template
      input:
        url: ./skeleton/metrics

    - id: fetch-linting
      name: Add Lint Workflow
      if: ${{ parameters.enable_linting }}
      action: fetch:template
      input:
        url: ./skeleton/linting
        copyWithoutTemplating:
          - .github/workflows/*

    - id: fetch-type-checking
      name: Add Type Check Workflow
      if: ${{ parameters.enable_type_checking }}
      action: fetch:template
      input:
        url: ./skeleton/type-checking
        copyWithoutTemplating:
          - .github/workflows/*

    - id: fetch-docker-compose
      name: Add Docker Compose Stack
      if: ${{ parameters.containerization == 'docker-compose' }}
      action: fetch:template
      input:
        url: ./skeleton/containerization-docker-compose
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description or 'Python API service' }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          python_version: ${{ parameters.python_version }}
          database_type: ${{ parameters.database_type }}
          sql: ${{ parameters.database_type != 'none' }}
          migrations: ${{ parameters.database_type != 'none' and parameters.enable_migrations }}
          enable_caching: ${{ parameters.enable_caching }}
          auth_type: ${{ parameters.auth_type }}
          enable_rate_limiting: ${{ parameters.enable_rate_limiting }}
          enable_cors: ${{ parameters.enable_cors }}
          enable_security_headers: ${{ parameters.enable_security_headers }}
          enable_docs: ${{ parameters.enable_docs }}
          enable_logging: ${{ parameters.enable_logging }}
          enable_metrics: ${{ parameters.enable_metrics }}
          enable_coverage: ${{ parameters.enable_coverage }}
          enable_linting: ${{ parameters.enable_linting }}
          enable_type_checking: ${{ parameters.enable_type_checking }}
          containerization: ${{ parameters.containerization }}

    - id: fetch-kubernetes
      name: Add Kubernetes Manifests
      if: ${{ parameters.containerization == 'kubernetes' }}
      action: fetch:template
      input:
        url: ./skeleton/containerization-kubernetes
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description or 'Python API service' }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          python_version: ${{ parameters.python_version }}
          database_type: ${{ parameters.database_type }}
          sql: ${{ parameters.database_type != 'none' }}
          migrations: ${{ parameters.database_type != 'none' and parameters.enable_migrations }}
          enable_caching: ${{ parameters.enable_caching }}
          auth_type: ${{ parameters.auth_type }}
          enable_rate_limiting: ${{ parameters.enable_rate_limiting }}
          enable_cors: ${{ parameters.enable_cors }}
          enable_security_headers: ${{ parameters.enable_security_headers }}
          enable_docs: ${{ parameters.enable_docs }}
          enable_logging: ${{ parameters.enable_logging }}
          enable_metrics: ${{ parameters.enable_metrics }}
          enable_coverage: ${{ parameters.enable_coverage }}
          enable_linting: ${{ parameters.enable_linting }}
          enable_type_checking: ${{ parameters.enable_type_checking }}
          containerization: ${{ parameters.containerization }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        repoVisibility: private
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: CI runs
        url: ${{ steps['publish'].output.remoteUrl + '/actions' }}
