apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.componentName }}
  description: ${{ (values.description or ('AWS infrastructure stack of ' + values.projectName)) | dump }}
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
  tags:
    - terraform
    - aws
    - infrastructure
    - ${{ values.environment }}
  links:
    - url: https://${{ values.region }}.console.aws.amazon.com/console/home?region=${{ values.region }}
      title: AWS Console
      icon: cloud
spec:
  type: infrastructure
  owner: ${{ values.owner }}
  lifecycle: ${{ 'production' if values.environment in ['prod', 'dr'] else 'experimental' }}
