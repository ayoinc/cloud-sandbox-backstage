{% raw %}name: Terraform init
description: Installs Terraform, assumes the AWS role through OIDC and initialises the S3 backend for the stack.

inputs:
  environment:
    description: Environment whose state is used (dev, staging or prod)
    required: true
  terraform-version:
    description: Terraform version to install
    required: true
  aws-region:
    description: AWS region of the deployment and of the state bucket
    required: true
  role-arn:
    description: IAM role assumed through GitHub OIDC
    required: true
  state-bucket:
    description: S3 bucket holding the Terraform state
    required: true
  state-lock-table:
    description: DynamoDB table used for state locking
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Initialise the S3 backend
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        STATE_BUCKET: ${{ inputs.state-bucket }}
        LOCK_TABLE: ${{ inputs.state-lock-table }}
        STATE_REGION: ${{ inputs.aws-region }}
      run: |
        args=(
          -backend-config="bucket=$STATE_BUCKET"
          -backend-config="key=$GITHUB_REPOSITORY/$ENVIRONMENT/terraform.tfstate"
          -backend-config="region=$STATE_REGION"
          -backend-config="encrypt=true"
        )
        if [ -n "$LOCK_TABLE" ]; then
          args+=(-backend-config="dynamodb_table=$LOCK_TABLE")
        fi
        terraform init "${args[@]}"
{% endraw %}
