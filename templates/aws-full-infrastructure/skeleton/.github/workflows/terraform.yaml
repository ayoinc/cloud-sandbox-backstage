# Terraform pipeline for AWS Full Infrastructure.
#
# Runs with no configuration: formatting, validation, linting, native tests and
# security scans need no cloud account. Plan, apply, destroy and drift detection
# start once these repository (or environment) secrets exist:
#   AWS_ROLE_ARN         IAM role assumed through GitHub OIDC
#   TF_STATE_BUCKET      S3 bucket holding the Terraform state
#   TF_STATE_LOCK_TABLE  DynamoDB table for state locking (optional)
#   INFRACOST_API_KEY    enables the cost estimate on pull requests (optional)
# The repository variable AWS_REGION overrides the region used for the AWS
# session and the state bucket (default: the region chosen at creation).
# Apply and destroy run in the GitHub environment named after the stack's
# environment, so reviewers configured on it approve the change.
name: AWS Full Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: Type DESTROY to confirm a destroy
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: '1.17.1'
  TFLINT_VERSION: 'v0.66.0'
  TF_INPUT: 'false'
  TF_IN_AUTOMATION: 'true'
  DEFAULT_AWS_REGION: ${{ values.region }}
  TARGET_ENVIRONMENT: ${{ values.environment }}
{% raw %}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  settings:
    name: Settings
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.detect.outputs.aws }}
      infracost: ${{ steps.detect.outputs.infracost }}
      environment: ${{ steps.detect.outputs.environment }}
      region: ${{ steps.detect.outputs.region }}
    steps:
      - name: Detect configured credentials
        id: detect
        env:
          HAS_AWS: ${{ secrets.AWS_ROLE_ARN != '' && secrets.TF_STATE_BUCKET != '' }}
          HAS_INFRACOST: ${{ secrets.INFRACOST_API_KEY != '' }}
          REGION_OVERRIDE: ${{ vars.AWS_REGION }}
        run: |
          {
            echo "aws=$HAS_AWS"
            echo "infracost=$HAS_INFRACOST"
            echo "region=${REGION_OVERRIDE:-$DEFAULT_AWS_REGION}"
            echo "environment=$TARGET_ENVIRONMENT"
          } >> "$GITHUB_OUTPUT"
          if [ "$HAS_AWS" != "true" ]; then
            echo "AWS_ROLE_ARN and TF_STATE_BUCKET are not set: plan, apply, destroy and drift detection are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialise without a backend
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Lint with TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialise without a backend
        run: terraform init -backend=false

      - name: Run Terraform tests
        run: terraform test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'

      - name: Scan with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true

  cost:
    name: Cost estimate
    runs-on: ubuntu-latest
    needs: [settings, validate]
    if: github.event_name == 'pull_request' && needs.settings.outputs.infracost == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Estimate monthly cost
        run: |
          infracost breakdown --path . \
            --format json --out-file /tmp/infracost.json

      - name: Comment on the pull request
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          infracost comment github --path /tmp/infracost.json \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request "$PULL_REQUEST" \
            --github-token "${{ github.token }}" \
            --behavior update

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: [settings, validate, test, security]
    if: needs.settings.outputs.aws == 'true' && github.event_name != 'schedule' && inputs.action != 'destroy'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/terraform-init
        with:
          environment: ${{ needs.settings.outputs.environment }}
          terraform-version: ${{ env.TF_VERSION }}
          aws-region: ${{ needs.settings.outputs.region }}
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          state-lock-table: ${{ secrets.TF_STATE_LOCK_TABLE }}

      - name: Plan
        run: |
          terraform plan -out=tfplan
          {
            echo "### Plan for $TARGET_ENVIRONMENT"
            echo '```'
            terraform show -no-color tfplan | tail -n 200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ needs.settings.outputs.environment }}
          path: tfplan
          retention-days: 5

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: [settings, plan]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    environment: ${{ needs.settings.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/terraform-init
        with:
          environment: ${{ needs.settings.outputs.environment }}
          terraform-version: ${{ env.TF_VERSION }}
          aws-region: ${{ needs.settings.outputs.region }}
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          state-lock-table: ${{ secrets.TF_STATE_LOCK_TABLE }}

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ needs.settings.outputs.environment }}

      - name: Apply the reviewed plan
        run: terraform apply tfplan

  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    needs: settings
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' &&
      inputs.confirm_destroy == 'DESTROY' && needs.settings.outputs.aws == 'true'
    environment: ${{ needs.settings.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/terraform-init
        with:
          environment: ${{ needs.settings.outputs.environment }}
          terraform-version: ${{ env.TF_VERSION }}
          aws-region: ${{ needs.settings.outputs.region }}
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          state-lock-table: ${{ secrets.TF_STATE_LOCK_TABLE }}

      - name: Destroy
        run: terraform destroy -auto-approve

  drift:
    name: Drift
    runs-on: ubuntu-latest
    needs: settings
    if: github.event_name == 'schedule' && needs.settings.outputs.aws == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/terraform-init
        with:
          environment: ${{ needs.settings.outputs.environment }}
          terraform-version: ${{ env.TF_VERSION }}
          aws-region: ${{ needs.settings.outputs.region }}
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          state-lock-table: ${{ secrets.TF_STATE_LOCK_TABLE }}

      - name: Compare the state with the configuration
        run: |
          status=0
          terraform plan -detailed-exitcode -lock=false || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::Drift detected in $TARGET_ENVIRONMENT"
            echo "Drift detected in $TARGET_ENVIRONMENT. Run the plan action to review it." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [settings, validate, test, security, cost, plan, apply, destroy, drift]
    if: always()
    steps:
      - name: Report job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null
{% endraw %}
