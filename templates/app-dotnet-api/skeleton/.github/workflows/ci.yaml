name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      # Warnings are errors: see Directory.Build.props.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Start the server and call the health endpoint
        run: |
          ASPNETCORE_HTTP_PORTS=8080 dotnet run --project src/Api --configuration Release --no-build --no-launch-profile &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          exit 1

      # Reports packages with known vulnerabilities. It does not fail the
      # build: the advisory database changes daily, so the same commit would
      # pass one day and fail the next.
      - name: Vulnerable packages report
        run: dotnet list package --vulnerable --include-transitive

  image:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - uses: docker/setup-buildx-action@v4

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image exposes the port the service listens on; Docker maps it to
      # a free port on the runner.
      - name: Start the container and call the health endpoint
        run: |
          docker run --detach --name app --publish-all app:ci
          address="$(docker port app | head -n 1 | awk '{ print $NF }')"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://$address/health"; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      # Reports known vulnerabilities in the image. It does not fail the
      # build: the advisory database changes daily, so the same commit would
      # pass one day and fail the next.
      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          format: table
          severity: CRITICAL,HIGH

      - name: Log in to the GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
