name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # External links are checked every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  D2_VERSION: '0.9.0'

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md'

  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs with the TechDocs and D2 plugins
        run: pip install mkdocs-techdocs-core==1.7.1 mkdocs-d2-plugin==1.7.0

      - name: Install D2
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2

      - name: Build documentation the way TechDocs does
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/techdocs-site"

      - name: Build standalone site with the configured theme
        run: mkdocs build --strict --config-file mkdocs.standalone.yml --site-dir site

      - name: Upload standalone site
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
          retention-days: 7

  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Links between files in this repository must always resolve.
      - name: Check links between documentation files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true

  external-links:
    name: Check External Links
    # Other sites can be unreachable for reasons unrelated to a change here,
    # so they are checked on a schedule and on demand instead of on each push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links to other sites
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 './**/*.md'
          fail: true
