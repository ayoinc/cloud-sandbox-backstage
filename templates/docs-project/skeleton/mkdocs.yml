site_name: ${{ values.name | dump }}
site_description: ${{ values.description | dump }}

# TechDocs always renders with its own Material theme. This theme applies to
# the standalone site built from mkdocs.standalone.yml.
theme:
  name: ${{ values.theme }}
{%- if values.theme == 'material' %}
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy
{%- endif %}

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - Introduction: user-guide/introduction.md
      - Features: user-guide/features.md
      - Configuration: user-guide/configuration.md
  - Architecture:
      - Overview: architecture/overview.md
      - Components: architecture/components.md
{%- if values.includeApiDocs %}
  - API Reference: api/index.md
{%- endif %}
  - ADRs:
      - Overview: adrs/index.md
      - '0001 - Initial Architecture': adrs/0001-initial-architecture.md
  - Runbooks:
      - Overview: runbooks/index.md
      - Deployment: runbooks/deployment.md
  - Contributing: contributing.md
{%- if values.includeChangelog %}
  - Changelog: changelog.md
{%- endif %}

plugins:
  - techdocs-core
  - d2

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
