---
name: Ansible Playbook CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Inventory group to run against'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      check_mode:
        description: 'Run in check mode (dry-run)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  # ============================================
  # LINT - yamllint, ansible-lint and syntax check
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

      - name: Install dependencies
        run: pip install ansible-core ansible-lint yamllint

      - name: Install roles and collections
        run: |
          if [ -f requirements.yml ]; then
            ansible-galaxy install -r requirements.yml
          fi

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Check syntax
        run: ansible-playbook --syntax-check playbook.yml

  # ============================================
  # SECURITY - Misconfigurations and secrets
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for misconfigurations and committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Check vault files are encrypted
        run: |
          status=0
          while IFS= read -r vault_file; do
            if head -n 1 "$vault_file" | grep -q '^[$]ANSIBLE_VAULT'; then
              echo "$vault_file is encrypted"
            else
              echo "::error file=$vault_file::$vault_file is not encrypted with ansible-vault"
              status=1
            fi
          done < <(find . -name '*.vault.yml' -o -name 'vault.yml')
          exit "$status"
{%- if values.molecule_testing %}

  # ============================================
  # TEST - Molecule tests
  # ============================================
  test:
    name: Molecule Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu2404
          - debian12
          - rockylinux9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

      - name: Install dependencies
        run: pip install ansible molecule "molecule-plugins[docker]"

      - name: Run Molecule tests
        run: molecule test
        env:
          MOLECULE_DISTRO: {% raw %}${{ matrix.distro }}{% endraw %}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
{%- endif %}

  # ============================================
  # VALIDATE - Check inventory and variables
  # ============================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

      - name: Install Ansible
        run: pip install ansible-core

      - name: Validate inventory
        run: ansible-inventory -i inventory/hosts --list > /dev/null

      - name: Check variable files
        run: |
          status=0
          while IFS= read -r var_file; do
            echo "Checking variable file: $var_file"
            python -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$var_file" || status=1
          done < <(find . \( -path './group_vars/*' -o -path './host_vars/*' -o -path '*/vars/*' -o -path '*/defaults/*' \) -name '*.yml' ! -name '*vault*')
          exit "$status"

      - name: List the tasks the playbook would run
        run: ansible-playbook playbook.yml --list-tasks

  # ============================================
  # DEPLOY - Execute playbook
  # ============================================
  deploy-credentials:
    name: Check deploy credentials
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    outputs:
      available: {% raw %}${{ steps.check.outputs.available }}{% endraw %}
    steps:
      - name: Report whether SSH_PRIVATE_KEY is configured
        id: check
        env:
          SSH_PRIVATE_KEY: {% raw %}${{ secrets.SSH_PRIVATE_KEY }}{% endraw %}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH_PRIVATE_KEY is not set, so the deploy job is skipped."
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - security
{%- if values.molecule_testing %}
      - test
{%- endif %}
      - validate
      - deploy-credentials
    if: needs.deploy-credentials.outputs.available == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install roles and collections
        run: |
          if [ -f requirements.yml ]; then
            ansible-galaxy install -r requirements.yml
          fi

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: {% raw %}${{ secrets.SSH_PRIVATE_KEY }}{% endraw %}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run playbook
        env:
          ANSIBLE_VAULT_PASSWORD: {% raw %}${{ secrets.ANSIBLE_VAULT_PASSWORD }}{% endraw %}
          TARGET: {% raw %}${{ github.event.inputs.target || 'development' }}{% endraw %}
          CHECK_MODE: {% raw %}${{ github.event.inputs.check_mode }}{% endraw %}
          ANSIBLE_FORCE_COLOR: '1'
        run: |
          args=(--limit "$TARGET")
          if [ -n "$ANSIBLE_VAULT_PASSWORD" ]; then
            printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > .vault_password
            chmod 600 .vault_password
            args+=(--vault-password-file .vault_password)
          fi
          if [ "$CHECK_MODE" = "true" ]; then
            args+=(--check --diff)
          fi
          ansible-playbook playbook.yml "${args[@]}"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa .vault_password
