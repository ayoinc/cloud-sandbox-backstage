---
# Collections baked into the image. Pin exact versions: an image must not
# change because a collection published a new release.
{%- if values.collections | length %}
collections:
{%- if 'ansible.posix' in values.collections %}
  - name: ansible.posix
    version: 2.2.2
{%- endif %}
{%- if 'community.general' in values.collections %}
  - name: community.general
    version: 14.0.1
{%- endif %}
{%- if 'ansible.utils' in values.collections %}
  - name: ansible.utils
    version: 6.1.1
{%- endif %}
{%- if 'community.crypto' in values.collections %}
  - name: community.crypto
    version: 3.5.1
{%- endif %}
{%- if 'kubernetes.core' in values.collections %}
  - name: kubernetes.core
    version: 6.6.0
{%- endif %}
{%- if 'community.docker' in values.collections %}
  - name: community.docker
    version: 5.4.0
{%- endif %}
{%- if 'community.postgresql' in values.collections %}
  - name: community.postgresql
    version: 5.1.1
{%- endif %}
{%- if 'ansible.windows' in values.collections %}
  - name: ansible.windows
    version: 3.9.2
{%- endif %}
{%- else %}
collections: []
{%- endif %}
