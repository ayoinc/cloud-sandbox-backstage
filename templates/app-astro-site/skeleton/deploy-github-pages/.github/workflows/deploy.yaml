name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Skipped until the repository variable PAGES_ENABLED is "true": GitHub
  # Pages has to be switched on first (Settings > Pages > Source: GitHub
  # Actions).
  build:
    name: Build
    runs-on: ubuntu-latest
    if: vars.PAGES_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # The deployment is authorised by the workflow's OIDC token; no secret is
    # stored.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
