name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Type check and content schema
        run: npm run check

      - name: Vitest
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the site
        run: npm run build

      - name: The pages every deployment needs exist
        run: |
          for file in index.html 404.html rss.xml robots.txt health.json sitemap-index.xml posts/index.html; do
            test -s "dist/$file" || { echo "dist/$file is missing"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 7
