apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: kubernetes-microservice
  title: Kubernetes Microservice
  description: Create a containerised microservice with Kubernetes manifests, a tested pipeline and a deployment workflow
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - recommended
    - kubernetes
    - microservice
    - ci-cd
    - monitoring
    - security
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Service Information
      required:
        - name
        - description
        - owner
        - language
      properties:
        name:
          title: Service Name
          type: string
          description: Name of the microservice. It names the Kubernetes resources.
          pattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
          ui:help: 'Lowercase letters, numbers and hyphens; starts with a letter'
        description:
          title: Description
          type: string
          description: Brief description of the microservice
        owner:
          title: Owner
          type: string
          description: Owner of the microservice
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        language:
          title: Programming Language
          type: string
          description: Language of the starter service and of its image
          default: nodejs
          enum:
            - nodejs
            - python
            - java
            - golang
            - dotnet
          enumNames:
            - Node.js 24
            - Python 3.13
            - Java 21
            - Go 1.27
            - .NET 10

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

    - title: Dependencies
      required:
        - database_type
        - message_queue
      properties:
        database_type:
          title: Database Type
          type: string
          description: >-
            Gives the pods a DATABASE_URL from the Secret <name>-secrets, opens the database port in the
            NetworkPolicy and registers the database as a catalog resource. The database itself is not created.
          default: postgresql
          enum:
            - none
            - postgresql
            - mysql
            - mongodb
            - redis
            - elasticsearch
          enumNames:
            - No Database
            - PostgreSQL
            - MySQL
            - MongoDB
            - Redis
            - Elasticsearch
        message_queue:
          title: Message Queue
          type: string
          description: >-
            Gives the pods a MESSAGE_QUEUE_URL from the Secret <name>-secrets, opens the broker port in the
            NetworkPolicy and registers the queue as a catalog resource. The broker itself is not created.
          default: none
          enum:
            - none
            - rabbitmq
            - kafka
            - redis-pub-sub
            - aws-sqs
          enumNames:
            - No Message Queue
            - RabbitMQ
            - Apache Kafka
            - Redis Pub/Sub
            - AWS SQS

    - title: Cloud & Deployment
      required:
        - cloud_provider
        - environment_strategy
        - kubernetes_namespace
        - deployment_strategy
      properties:
        cloud_provider:
          title: Cloud Provider
          type: string
          description: Selects the Ingress class and how the deployment workflow signs in to the cluster
          default: aws
          enum:
            - aws
            - azure
            - gcp
            - on-premise
          enumNames:
            - Amazon Web Services (EKS)
            - Microsoft Azure (AKS)
            - Google Cloud Platform (GKE)
            - On-Premise
        environment_strategy:
          title: Environment Strategy
          type: string
          description: >-
            Single environment: one set of manifests. Multi-environment: a base with dev, staging and production
            overlays. GitOps: one set of manifests and an Argo CD Application that syncs them; no deployment workflow.
          default: multi-env
          enum:
            - single-env
            - multi-env
            - gitops
          enumNames:
            - Single Environment
            - Multi-Environment (Dev/Staging/Prod)
            - GitOps with Argo CD
        kubernetes_namespace:
          title: Kubernetes Namespace
          type: string
          description: >-
            Namespace to deploy to. With the multi-environment strategy it is a prefix: <namespace>-dev,
            <namespace>-staging and <namespace>-production.
          default: default
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 50
        deployment_strategy:
          title: Deployment Strategy
          type: string
          description: >-
            Rolling update uses a Deployment. Blue-green and canary use an Argo Rollouts Rollout and need the
            Argo Rollouts controller in the cluster.
          default: rolling-update
          enum:
            - rolling-update
            - blue-green
            - canary
          enumNames:
            - Rolling Update
            - Blue-Green Deployment (Argo Rollouts)
            - Canary Deployment (Argo Rollouts)
        enable_hpa:
          title: Enable Horizontal Pod Autoscaler
          type: boolean
          description: Scale between 2 and 10 pods on CPU and memory use
          default: true
        enable_pdb:
          title: Enable Pod Disruption Budget
          type: boolean
          description: Let node drains take down one pod at a time
          default: true

    - title: Observability & Security
      required:
        - monitoring_stack
      properties:
        monitoring_stack:
          title: Monitoring Stack
          type: string
          description: >-
            The service always exposes Prometheus metrics on /metrics. This adds the pod annotations the selected
            stack uses to discover and scrape them; Basic adds none.
          default: prometheus-grafana
          enum:
            - basic
            - prometheus-grafana
            - elastic-stack
            - datadog
            - new-relic
          enumNames:
            - Basic (no scraping annotations)
            - Prometheus + Grafana
            - Elastic Stack
            - Datadog
            - New Relic
        enable_tracing:
          title: Enable Distributed Tracing
          type: boolean
          description: >-
            Annotate the pods for auto-instrumentation by the OpenTelemetry Operator, which must be installed in the
            cluster, and allow OTLP traffic in the NetworkPolicy
          default: true
        enable_security_scanning:
          title: Enable Security Scanning
          type: boolean
          description: Add a workflow that scans the manifests, the dependencies and the image with Trivy
          default: true
        enable_policy_enforcement:
          title: Enable Policy Enforcement
          type: boolean
          description: >-
            Add OPA policies for the manifests, checked in the pipeline with conftest, and enforce the restricted
            Pod Security Standard on the namespace the template creates
          default: true

    - title: CI/CD Configuration
      properties:
        enable_automated_testing:
          title: Enable Integration Testing
          type: boolean
          description: >-
            Add a workflow that deploys the image to a throwaway kind cluster with the manifests and calls the
            service. Unit tests always run.
          default: true
        enable_code_quality:
          title: Enable Code Quality Analysis
          type: boolean
          description: Add a SonarQube analysis workflow. It is skipped until the SONAR_TOKEN secret is set.
          default: true

  steps:
    - id: fetch
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton/base
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-language
      name: Add Service Sources
      action: fetch:template
      input:
        url: ./skeleton/lang-${{ parameters.language }}
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-manifests
      name: Add Kubernetes Manifests
      action: fetch:template
      input:
        url: ./skeleton/k8s
        targetPath: ${{ 'k8s/base' if parameters.environment_strategy == 'multi-env' else 'k8s' }}
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-namespace
      name: Add Namespace
      if: ${{ parameters.environment_strategy == 'multi-env' or parameters.kubernetes_namespace != 'default' }}
      action: fetch:template
      input:
        url: ./skeleton/k8s-namespace
        targetPath: ${{ 'k8s/base' if parameters.environment_strategy == 'multi-env' else 'k8s' }}
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-hpa
      name: Add Horizontal Pod Autoscaler
      if: ${{ parameters.enable_hpa }}
      action: fetch:template
      input:
        url: ./skeleton/k8s-hpa
        targetPath: ${{ 'k8s/base' if parameters.environment_strategy == 'multi-env' else 'k8s' }}
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-pdb
      name: Add Pod Disruption Budget
      if: ${{ parameters.enable_pdb }}
      action: fetch:template
      input:
        url: ./skeleton/k8s-pdb
        targetPath: ${{ 'k8s/base' if parameters.environment_strategy == 'multi-env' else 'k8s' }}
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-overlays
      name: Add Environment Overlays
      if: ${{ parameters.environment_strategy == 'multi-env' }}
      action: fetch:template
      input:
        url: ./skeleton/k8s-overlays
        targetPath: k8s/overlays
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-argocd
      name: Add Argo CD Application
      if: ${{ parameters.environment_strategy == 'gitops' }}
      action: fetch:template
      input:
        url: ./skeleton/argocd
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-deploy
      name: Add Deployment Workflow
      if: ${{ parameters.environment_strategy != 'gitops' }}
      action: fetch:template
      input:
        url: ./skeleton/deploy-${{ parameters.cloud_provider }}
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-integration-test
      name: Add Integration Test
      if: ${{ parameters.enable_automated_testing }}
      action: fetch:template
      input:
        url: ./skeleton/integration-test
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-security
      name: Add Security Scan
      if: ${{ parameters.enable_security_scanning }}
      action: fetch:template
      input:
        url: ./skeleton/security
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-policy
      name: Add Policies
      if: ${{ parameters.enable_policy_enforcement }}
      action: fetch:template
      input:
        url: ./skeleton/policy
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-code-quality
      name: Add Code Quality Analysis
      if: ${{ parameters.enable_code_quality }}
      action: fetch:template
      input:
        url: ./skeleton/code-quality
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          database_type: ${{ parameters.database_type }}
          message_queue: ${{ parameters.message_queue }}
          cloud_provider: ${{ parameters.cloud_provider }}
          environment_strategy: ${{ parameters.environment_strategy }}
          kubernetes_namespace: ${{ parameters.kubernetes_namespace }}
          deployment_strategy: ${{ parameters.deployment_strategy }}
          enable_hpa: ${{ parameters.enable_hpa }}
          enable_pdb: ${{ parameters.enable_pdb }}
          monitoring_stack: ${{ parameters.monitoring_stack }}
          enable_tracing: ${{ parameters.enable_tracing }}
          enable_security_scanning: ${{ parameters.enable_security_scanning }}
          enable_policy_enforcement: ${{ parameters.enable_policy_enforcement }}
          enable_automated_testing: ${{ parameters.enable_automated_testing }}
          enable_code_quality: ${{ parameters.enable_code_quality }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to Repository
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: 'Initial microservice setup from DevOps Platform'
        gitAuthorName: 'DevOps Platform'
        gitAuthorEmail: 'devops@company.com'

    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: CI/CD Pipeline
        url: ${{ steps.publish.output.remoteUrl + '/actions' }}
