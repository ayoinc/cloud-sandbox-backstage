name: Deploy

# Runs after a successful CI run on main, which publishes the image, and on
# demand. Nothing is deployed until the settings below exist.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to (empty for the default)
        required: false
        type: string

permissions:
  contents: read

env:
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  settings:
    name: Check deployment settings
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deployment is skipped. Set the repository secret KUBE_CONFIG (a base64-encoded kubeconfig) to enable it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: settings
    if: needs.settings.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - name: Write the kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          umask 077
          echo "$KUBE_CONFIG" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${COMMIT:0:7}"
          if [ -n "$ENVIRONMENT" ]; then
            bash scripts/deploy.sh "$image" "$ENVIRONMENT"
          else
            bash scripts/deploy.sh "$image"
          fi
