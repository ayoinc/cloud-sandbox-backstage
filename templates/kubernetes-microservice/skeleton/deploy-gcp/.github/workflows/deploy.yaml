name: Deploy

# Runs after a successful CI run on main, which publishes the image, and on
# demand. Nothing is deployed until the settings below exist.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to (empty for the default)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  settings:
    name: Check deployment settings
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GKE_LOCATION: ${{ vars.GKE_LOCATION }}
        run: |
          if [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$GCP_SERVICE_ACCOUNT" ] && [ -n "$GKE_CLUSTER_NAME" ] && [ -n "$GKE_LOCATION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deployment is skipped. Set the repository variables GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GKE_CLUSTER_NAME and GKE_LOCATION to enable it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: settings
    if: needs.settings.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      # Workload Identity Federation trusts this repository, so no service
      # account key is stored.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_LOCATION }}

      - name: Deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${COMMIT:0:7}"
          if [ -n "$ENVIRONMENT" ]; then
            bash scripts/deploy.sh "$image" "$ENVIRONMENT"
          else
            bash scripts/deploy.sh "$image"
          fi
