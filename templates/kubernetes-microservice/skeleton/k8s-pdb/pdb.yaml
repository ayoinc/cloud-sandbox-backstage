apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  # Node drains take down one pod at a time.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
