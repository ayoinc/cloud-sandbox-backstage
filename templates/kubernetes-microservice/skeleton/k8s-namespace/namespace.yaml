apiVersion: v1
kind: Namespace
metadata:
  name: ${{ values.kubernetes_namespace }}
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
{%- if values.enable_policy_enforcement %}
    # Pod Security Admission rejects pods that do not meet the restricted
    # profile: non-root, no privilege escalation, no added capabilities.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{%- endif %}
