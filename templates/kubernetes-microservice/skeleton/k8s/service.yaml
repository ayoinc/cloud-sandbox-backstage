apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}
{%- if values.cloud_provider == 'gcp' %}
  annotations:
    # Container-native load balancing for the GKE Ingress
    cloud.google.com/neg: '{"ingress": true}'
{%- endif %}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ${{ values.name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
{%- if values.deployment_strategy == 'blue-green' %}
---
# Points at the new version until it is promoted.
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}-preview
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ${{ values.name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
{%- endif %}
