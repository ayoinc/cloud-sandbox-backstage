# SonarQube analysis settings, read by .github/workflows/code-quality.yaml.
sonar.projectKey=${{ values.destination.owner }}_${{ values.destination.repo }}
sonar.projectName=${{ values.name }}
# Needed by SonarQube Cloud; SonarQube Server ignores it.
sonar.organization=${{ values.destination.owner | lower }}
sonar.sources=.
sonar.exclusions=docs/**,k8s/**,policy/**,scripts/**,**/*test*/**,**/*_test.go,**/test_*.py
sonar.sourceEncoding=UTF-8
