name: Deploy

# Runs after a successful CI run on main, which publishes the image, and on
# demand. Nothing is deployed until the settings below exist.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to (empty for the default)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  settings:
    name: Check deployment settings
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ] && [ -n "$AKS_RESOURCE_GROUP" ] && [ -n "$AKS_CLUSTER_NAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deployment is skipped. Set the repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AKS_RESOURCE_GROUP and AKS_CLUSTER_NAME to enable it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: settings
    if: needs.settings.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      # The app registration trusts this repository through a federated
      # credential, so no client secret is stored.
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${COMMIT:0:7}"
          if [ -n "$ENVIRONMENT" ]; then
            bash scripts/deploy.sh "$image" "$ENVIRONMENT"
          else
            bash scripts/deploy.sh "$image"
          fi
