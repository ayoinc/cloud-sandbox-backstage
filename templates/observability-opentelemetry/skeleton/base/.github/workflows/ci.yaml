name: CI

on:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: yamllint
        run: pipx run yamllint==1.38.0 --strict .

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      # The collector checks its own configuration: components, keys, pipelines.
      - name: Validate with the collector
        run: bash scripts/validate.sh

  smoke-test:
    name: Send telemetry through the collector
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Starts the collector with the real configuration and a stand-in
      # backend, sends traces, metrics and logs, and checks that they arrive.
      - name: Smoke test
        run: bash scripts/smoke-test.sh

  security:
    name: Scan for misconfigurations and secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
