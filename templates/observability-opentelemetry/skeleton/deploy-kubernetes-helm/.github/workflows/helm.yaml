name: Helm

on:
  push:
  workflow_dispatch:

permissions: {}

env:
  KUBECONFORM_VERSION: 0.8.0
  KUBERNETES_VERSION: 1.37.0

jobs:
  render:
    name: Render and validate the Helm release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      # What scripts/deploy.sh would install, checked against the Kubernetes schemas.
      - name: Render the chart and validate the manifests
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP" kubeconform
          bash scripts/render.sh > "$RUNNER_TEMP/manifests.yaml"
          "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version "$KUBERNETES_VERSION" "$RUNNER_TEMP/manifests.yaml"

      # The configuration the pods will run is the one from collector/config.yaml
      # plus what the chart's presets add. The collector validates the result.
      - name: Validate the configuration as the chart renders it
        run: |
          yq 'select(.kind == "ConfigMap" and .data.relay != null) | .data.relay' \
            "$RUNNER_TEMP/manifests.yaml" > "$RUNNER_TEMP/relay.yaml"
          if [ ! -s "$RUNNER_TEMP/relay.yaml" ]; then
            echo "::error::The chart rendered no ConfigMap with the collector configuration"
            exit 1
          fi
          docker run --rm \
            --env OTLP_ENDPOINT=http://validate.invalid:4318 \
            --env OTLP_AUTHORIZATION= \
            --env PROMETHEUS_REMOTE_WRITE_ENDPOINT=http://validate.invalid:9090/api/v1/write \
            --env PROMETHEUS_REMOTE_WRITE_AUTHORIZATION= \
            --env DEPLOYMENT_ENVIRONMENT=validate \
            --env MY_POD_IP=127.0.0.1 \
            --env K8S_NODE_NAME=validate \
            --volume "$RUNNER_TEMP/relay.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.165.0 validate --config=/etc/otelcol/config.yaml
