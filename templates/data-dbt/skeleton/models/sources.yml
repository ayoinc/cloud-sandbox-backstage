version: 2

sources:
  - name: raw
    description: Raw data source tables
    # In the ci target the example_table seed stands in for the raw table.
    database: "{{ var('raw_database', target.database if target.name == 'ci' else 'raw') }}"
    schema: "{{ var('raw_schema', target.schema if target.name == 'ci' else 'raw') }}"
    tables:
      - name: example_table
        description: Example source table
        columns:
          - name: id
            description: Primary key
            data_tests:
              - unique
              - not_null
          - name: created_at
            description: Timestamp when record was created
          - name: updated_at
            description: Timestamp when record was last updated
