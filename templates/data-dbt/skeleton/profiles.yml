# Connection profiles. No credentials are stored here: every value comes from
# an environment variable. `ci` is a local DuckDB database used by the pipeline
# and for trying the project without a warehouse.
${{ values.name }}:
  target: "{{ env_var('DBT_TARGET', 'ci') }}"
  outputs:
    ci:
      type: duckdb
      path: target/ci.duckdb
      schema: main
      threads: 4
{% for target, threads in [['development', 4], ['staging', 8], ['production', 16]] %}
    ${{ target }}:
      type: ${{ values.warehouse }}
{%- if values.warehouse == 'snowflake' %}
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
{%- elif values.warehouse == 'bigquery' %}
      method: service-account
      project: "{{ env_var('BIGQUERY_PROJECT') }}"
      keyfile: "{{ env_var('BIGQUERY_KEYFILE') }}"
      dataset: "{{ env_var('DBT_SCHEMA', 'analytics_${{ target }}') }}"
{%- elif values.warehouse == 'redshift' %}
      host: "{{ env_var('REDSHIFT_HOST') }}"
      port: "{{ env_var('REDSHIFT_PORT', '5439') | as_number }}"
      user: "{{ env_var('REDSHIFT_USER') }}"
      password: "{{ env_var('REDSHIFT_PASSWORD') }}"
      dbname: "{{ env_var('REDSHIFT_DATABASE') }}"
{%- elif values.warehouse == 'postgres' %}
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DATABASE') }}"
{%- elif values.warehouse == 'databricks' %}
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'main') }}"
{%- endif %}
{%- if values.warehouse != 'bigquery' %}
      schema: "{{ env_var('DBT_SCHEMA', 'analytics_${{ target }}') }}"
{%- endif %}
      threads: ${{ threads }}
{% endfor -%}
