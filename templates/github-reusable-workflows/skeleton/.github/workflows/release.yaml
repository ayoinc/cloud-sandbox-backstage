# Moves the major version tag when a release tag is pushed: after v1.4.0 is
# pushed, v1 points at the same commit. Callers that follow a major version
# get the release; callers that pin a commit are unaffected.
name: Release
{% raw %}
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  major-tag:
    name: Move the major version tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # create or move the major version tag
    steps:
      # The tag is moved through the API: nothing is checked out and no
      # credentials are written to disk.
      - name: Move the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
              --field sha="$GITHUB_SHA" --field force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$major" --field sha="$GITHUB_SHA" >/dev/null
          fi
          echo "$major now points at $TAG ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
{% endraw %}
