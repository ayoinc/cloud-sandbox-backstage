# Reusable workflow: build a container image, scan it, publish it, sign it and
# attest how it was built. No long-lived credentials are involved:
#
#   - GitHub Container Registry: the GITHUB_TOKEN of the run.
#   - Amazon ECR: a role assumed with the run's OIDC token.
#   - Signature and provenance: Sigstore certificates issued for the run's
#     OIDC identity.
#
#   jobs:
#     publish:
#       uses: ${{ values.destination.owner }}/${{ values.destination.repo }}/.github/workflows/container-publish.yaml@<commit>
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#         attestations: write
name: Container publish
{% raw %}
on:
  workflow_call:
    inputs:
      image-name:
        description: Image name without registry and tag. Empty uses the name of the calling repository (owner/repository).
        type: string
        required: false
        default: ''
      context:
        description: Build context
        type: string
        required: false
        default: .
      dockerfile:
        description: Path of the Dockerfile. Empty uses Dockerfile in the context.
        type: string
        required: false
        default: ''
      platforms:
        description: Comma-separated target platforms
        type: string
        required: false
        default: linux/amd64
      push:
        description: Publish, sign and attest the image. false builds and scans only.
        type: boolean
        required: false
        default: true
      registry:
        description: Registry host. For Amazon ECR, the registry of the account (<account>.dkr.ecr.<region>.amazonaws.com).
        type: string
        required: false
        default: ghcr.io
      aws-role-to-assume:
        description: ARN of an IAM role to assume through OIDC before logging in to Amazon ECR. Empty logs in to the registry with GITHUB_TOKEN.
        type: string
        required: false
        default: ''
      aws-region:
        description: AWS region of the ECR registry
        type: string
        required: false
        default: ''
      fail-on-vulnerabilities:
        description: Fail when the scan finds fixable CRITICAL or HIGH vulnerabilities
        type: boolean
        required: false
        default: false
    outputs:
      image:
        description: Image name including the registry, without a tag
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Digest of the published image (sha256:...). Empty when push is false.
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

jobs:
  publish:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to the GitHub Container Registry
      id-token: write # OIDC token for the cloud role, the signature and the provenance
      attestations: write # store the provenance attestation
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name || github.repository }}
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU for other architectures
        if: contains(inputs.platforms, ',') || inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image is built for the runner's architecture first and scanned
      # before anything is published.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: scan:local
          provenance: false

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:local
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ inputs.fail-on-vulnerabilities && '1' || '0' }}

      - name: Assume the AWS role with OIDC
        if: inputs.push && inputs.aws-role-to-assume != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to Amazon ECR
        if: inputs.push && inputs.aws-role-to-assume != ''
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Log in to the registry with GITHUB_TOKEN
        if: inputs.push && inputs.aws-role-to-assume == ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layers of the scanned build are reused from the builder's cache.
      # An SBOM is attached to the image by BuildKit.
      - name: Build and push
        id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.push

      # Keyless: the certificate names this reusable workflow and the calling
      # repository, and the signature is recorded in the transparency log.
      - name: Sign the image
        if: inputs.push
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # SLSA build provenance, signed the same way and stored with the image.
      - name: Attest build provenance
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: inputs.push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published \`$IMAGE\`"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Deploy by digest: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
{% endraw %}
