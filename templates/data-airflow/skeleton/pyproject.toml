[project]
name = "${{ values.name }}"
version = "0.1.0"
description = ${{ (values.description or values.name) | dump }}
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "venv"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["dags"]
addopts = "-v --cov=dags --cov-report=term-missing"
