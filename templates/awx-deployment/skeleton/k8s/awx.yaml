---
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx-${{ values.name }}
  namespace: ${{ values.namespace }}
  labels:
    environment: ${{ values.environment }}
    managed-by: backstage
  annotations:
    backstage.io/managed-by: awx-backstage-platform
spec:
  # Service configuration
  service_type: ${{ values.service_type }}
{%- if values.service_type == 'NodePort' %}
  nodeport_port: 30080
{%- endif %}

  # Ingress configuration
{%- if values.ingress_enabled %}
  ingress_type: ingress
{%- if values.hostname %}
  hostname: ${{ values.hostname | dump }}
{%- endif %}
{%- if values.ssl_enabled %}
  # cert-manager issues the certificate into this secret.
  ingress_tls_secret: awx-${{ values.name }}-tls
  ingress_annotations: |
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
{%- else %}
  ingress_annotations: |
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
{%- endif %}
{%- else %}
  ingress_type: none
{%- endif %}

  # Admin user. The operator generates the password into the secret
  # awx-${{ values.name }}-admin-password.
  admin_user: ${{ values.admin_user | default('admin', true) | dump }}

  # Managed PostgreSQL. The operator generates its credentials into the secret
  # awx-${{ values.name }}-postgres-configuration.
{%- if values.storage_class %}
  postgres_storage_class: ${{ values.storage_class | dump }}
{%- endif %}
  postgres_storage_requirements:
    requests:
      storage: ${{ values.postgres_storage_size | default('8Gi', true) | dump }}

  # Project storage configuration
  projects_persistence: true
{%- if values.storage_class %}
  projects_storage_class: ${{ values.storage_class | dump }}
{%- endif %}
  projects_storage_size: ${{ values.project_storage_size | default('8Gi', true) | dump }}
  projects_storage_access_mode: ReadWriteMany
{%- if values.awx_version and values.awx_version != 'latest' %}

  # Image configuration
  image_version: ${{ values.awx_version | dump }}
{%- endif %}

  # Resource requirements
  web_resource_requirements:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  task_resource_requirements:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  ee_resource_requirements:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  redis_resource_requirements:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  # Environment-specific configuration
{%- if values.environment == 'production' %}
  replicas: 2
  auto_upgrade: false
{%- else %}
  replicas: 1
  auto_upgrade: true
{%- endif %}
{%- if values.ldap_enabled %}

  # LDAP configuration
  ldap_cacert_secret: awx-${{ values.name }}-ldap-cacert
{%- endif %}

  # Additional AWX settings
  extra_settings:
    - setting: SYSTEM_TASK_ABS_CPU
      value: "6"
    - setting: SYSTEM_TASK_ABS_MEM
      value: "20"
