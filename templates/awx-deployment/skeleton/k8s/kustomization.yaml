---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${{ values.namespace }}

resources:
  - namespace.yaml
  - awx.yaml
{%- if values.ldap_enabled %}
  - ldap-cacert.yaml
{%- endif %}

labels:
  - pairs:
      app.kubernetes.io/name: awx
      app.kubernetes.io/instance: awx-${{ values.name }}
      app.kubernetes.io/component: automation-platform
      app.kubernetes.io/part-of: awx-automation-platform
      environment: ${{ values.environment }}

commonAnnotations:
  backstage.io/managed-by: awx-backstage-platform
{%- if values.environment != 'production' %}

# Development and staging run with smaller resource requests.
patches:
  - target:
      group: awx.ansible.com
      kind: AWX
      name: awx-${{ values.name }}
    patch: |-
      apiVersion: awx.ansible.com/v1beta1
      kind: AWX
      metadata:
        name: awx-${{ values.name }}
      spec:
        web_resource_requirements:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
        task_resource_requirements:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
{%- endif %}
