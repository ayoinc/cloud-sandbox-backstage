# This rule is not used by the project ${{ values.name }} itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ${{ values.group }}.${{ values.domain }}.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/managed-by: kustomize
  name: ${{ values.kind_lower }}-editor-role
rules:
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}/status
  verbs:
  - get
