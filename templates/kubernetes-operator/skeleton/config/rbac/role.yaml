---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{#- controller-gen writes the rules sorted by API group. This file is generated by "make manifests"; the conditions below only reproduce that order for the API group chosen when the repository was created. #}
{%- set group = values.group + '.' + values.domain %}
{%- if group < 'apps' %}
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}/finalizers
  verbs:
  - update
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}/status
  verbs:
  - get
  - patch
  - update
{%- endif %}
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{%- if group > 'apps' and group < 'events.k8s.io' %}
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}/finalizers
  verbs:
  - update
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}/status
  verbs:
  - get
  - patch
  - update
{%- endif %}
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
{%- if group > 'events.k8s.io' %}
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}/finalizers
  verbs:
  - update
- apiGroups:
  - ${{ values.group }}.${{ values.domain }}
  resources:
  - ${{ values.plural }}/status
  verbs:
  - get
  - patch
  - update
{%- endif %}
