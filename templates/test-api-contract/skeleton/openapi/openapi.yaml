openapi: 3.1.0
info:
  title: Records API
  version: 1.0.0
  description: >-
    A sample contract: records that can be created, read and listed. Replace
    it with the description of the API under test.
servers:
  - url: http://127.0.0.1:3000
    description: The bundled sample API (node test-target/server.js)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Whether the API is up
      responses:
        '200':
          description: The API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [ok]
  /records:
    get:
      operationId: listRecords
      summary: List records
      parameters:
        - name: limit
          in: query
          description: At most this many records
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The records, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createRecord
      summary: Create a record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRecord'
      responses:
        '201':
          description: The record that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
  /records/{id}:
    get:
      operationId: getRecord
      summary: Read a record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: What was wrong with the request (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    NewRecord:
      type: object
      required: [name, amountMinor, currency]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        amountMinor:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: The amount in minor units, such as pence
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Record:
      type: object
      required: [id, name, amountMinor, currency, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
