apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  annotations:
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
    backstage.io/techdocs-ref: dir:.
  labels:
    cloud-provider: ${{ values.provider }}
    environment: ${{ values.environment }}
    component-type: ${{ values.componentType }}
  tags:
    - terraform
    - infrastructure
    - ${{ values.provider }}
    - ${{ values.environment }}
spec:
  type: infrastructure
  lifecycle: ${{ "production" if values.environment == "production" else "experimental" }}
  owner: ${{ values.owner }}
