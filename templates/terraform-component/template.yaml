apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: terraform-component
  title: Terraform Infrastructure Component
  description: Creates a Terraform infrastructure component on AWS, Azure or Google Cloud with naming and tagging conventions, isolated state per environment, tests and a validation and deployment pipeline
  tags:
    - terraform
    - infrastructure
    - cloud
    - iac
    - platform
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Component Classification
      required:
        - componentType
        - componentName
        - description
        - owner
      properties:
        componentType:
          title: Component Type
          type: string
          description: Platform components are shared infrastructure (networking, security). App components are application-specific resources.
          default: platform
          enum:
            - platform
            - application
          enumNames:
            - Platform (Shared Infrastructure)
            - Application (App-Specific)
        componentName:
          title: Component Name
          type: string
          description: Unique name for this component (e.g., core-networking, billing-app-resources)
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
          ui:help: Lowercase letters, digits and hyphens
        description:
          title: Description
          type: string
          description: What this infrastructure component manages
        owner:
          title: Owner
          type: string
          description: Team or user that owns the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        businessUnit:
          title: Business Unit
          type: string
          description: Business unit or department owning this component
          default: engineering
          enum:
            - engineering
            - platform
            - data
            - security
            - finance
            - marketing
          enumNames:
            - Engineering
            - Platform Engineering
            - Data & Analytics
            - Security
            - Finance
            - Marketing

    - title: Cloud Provider & Environment
      required:
        - provider
        - environment
      properties:
        provider:
          title: Cloud Provider
          type: string
          description: Select the cloud provider for this infrastructure
          default: aws
          enum:
            - aws
            - azure
            - gcp
          enumNames:
            - Amazon Web Services
            - Microsoft Azure
            - Google Cloud Platform
        environment:
          title: Deployment Environment
          type: string
          description: Target environment; its state is kept apart from other environments
          default: development
          enum:
            - development
            - staging
            - production
          enumNames:
            - Development (dev)
            - Staging (stg)
            - Production (prod)
      # Region names differ per provider, so the region fields follow the
      # provider chosen above.
      dependencies:
        provider:
          oneOf:
            - required:
                - region
              properties:
                provider:
                  enum:
                    - aws
                region:
                  title: Primary Region
                  type: string
                  description: Region the component is deployed to
                  default: us-east-1
                  enum:
                    - us-east-1
                    - us-west-2
                    - eu-west-1
                  enumNames:
                    - US East (N. Virginia) - us-east-1
                    - US West (Oregon) - us-west-2
                    - Europe (Ireland) - eu-west-1
                secondaryRegion:
                  title: Secondary Region (Optional)
                  type: string
                  description: Object storage is replicated to this region for disaster recovery. Has no effect unless Object storage is selected.
                  enum:
                    - us-east-1
                    - us-west-2
                    - eu-west-1
                  enumNames:
                    - US East (N. Virginia) - us-east-1
                    - US West (Oregon) - us-west-2
                    - Europe (Ireland) - eu-west-1
            - required:
                - region
              properties:
                provider:
                  enum:
                    - azure
                region:
                  title: Primary Region
                  type: string
                  description: Region the component is deployed to
                  default: eastus
                  enum:
                    - eastus
                    - westus2
                    - northeurope
                  enumNames:
                    - East US (Virginia) - eastus
                    - West US 2 (Washington) - westus2
                    - North Europe (Ireland) - northeurope
                secondaryRegion:
                  title: Secondary Region (Optional)
                  type: string
                  description: Object storage is replicated to this region for disaster recovery. Has no effect unless Object storage is selected.
                  enum:
                    - eastus
                    - westus2
                    - northeurope
                  enumNames:
                    - East US (Virginia) - eastus
                    - West US 2 (Washington) - westus2
                    - North Europe (Ireland) - northeurope
            - required:
                - region
              properties:
                provider:
                  enum:
                    - gcp
                region:
                  title: Primary Region
                  type: string
                  description: Region the component is deployed to
                  default: us-central1
                  enum:
                    - us-central1
                    - us-east1
                    - europe-west1
                  enumNames:
                    - Iowa, USA - us-central1
                    - South Carolina, USA - us-east1
                    - Belgium - europe-west1
                secondaryRegion:
                  title: Secondary Region (Optional)
                  type: string
                  description: Object storage is replicated to this region for disaster recovery. Has no effect unless Object storage is selected.
                  enum:
                    - us-central1
                    - us-east1
                    - europe-west1
                  enumNames:
                    - Iowa, USA - us-central1
                    - South Carolina, USA - us-east1
                    - Belgium - europe-west1

    - title: Project & Cost Allocation
      required:
        - projectName
        - costCenter
      properties:
        projectName:
          title: Project Name
          type: string
          description: Project name used for resource naming
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 30
          ui:help: 'Use hyphens, lowercase only. Example: acme-billing'
        costCenter:
          title: Cost Center
          type: string
          description: Cost center for financial tracking
          default: platform-engineering
          enum:
            - platform-engineering
            - application-development
            - data-platform
            - security-compliance
            - network-infrastructure
          enumNames:
            - Platform Engineering
            - Application Development
            - Data Platform
            - Security & Compliance
            - Network Infrastructure
        applicationId:
          title: Application ID (For App Components)
          type: string
          description: Application identifier from the service catalog; added to every resource as a tag
          ui:help: 'Format: app-####'
          pattern: '^app-\d{4}$'

    - title: Resource Configuration
      properties:
        createResourceGroup:
          title: Create Resource Container
          type: boolean
          description: Azure - create the resource group (otherwise an existing one is used). AWS - create a resource group that collects the component's resources by tag. Google Cloud - create a new project (otherwise an existing one is used).
          default: true
        resources:
          title: Resources
          description: Resources this component creates. This catalogue replaces an earlier list of 212 provider-specific options; every entry here is generated, tested and scanned for all three providers.
          type: array
          default:
            - object-storage
          items:
            type: string
            enum:
              - object-storage
              - virtual-network
              - key-vault
              - container-registry
              - log-workspace
              - virtual-machine
            enumNames:
              - Object storage (S3 bucket / Storage account / Cloud Storage bucket)
              - Virtual network (VPC / Virtual network with public and private subnets)
              - Key management (KMS key / Key Vault / Cloud KMS key)
              - Container registry (ECR / Container Registry / Artifact Registry)
              - Log workspace (CloudWatch log group / Log Analytics workspace / Logging bucket)
              - Virtual machine (EC2 / Linux VM / Compute Engine; adds the virtual network)
          uniqueItems: true
          ui:widget: checkboxes
        namingConvention:
          title: Naming Convention Standard
          type: string
          description: Choose naming convention standard
          default: enterprise
          enum:
            - enterprise
            - team
            - project
          enumNames:
            - Enterprise Standard (company-proj-env-type-###)
            - Team Standard (team-proj-type-env-###)
            - Project Standard (proj-type-env-###)
        autoShutdown:
          title: Auto-Shutdown Schedule (Dev/Staging Only)
          type: string
          description: Time at which virtual machines of this component are stopped outside production, in UTC. Has no effect unless Virtual machine is selected. Leave empty for no shutdown.
          default: '0 19 * * 1-5'
          pattern: '^[0-5]?[0-9] ([01]?[0-9]|2[0-3]) \* \* (\*|[0-6](-[0-6])?(,[0-6](-[0-6])?)*)$'
          ui:help: 'Cron format "minute hour * * weekdays", for example 0 19 * * 1-5. Azure stops the machine every day at that time and ignores the weekdays.'

    - title: Environment Isolation
      properties:
        backendType:
          title: Terraform Backend
          type: string
          description: Where the Terraform state is stored
          default: remote
          enum:
            - remote
            - s3
            - azure
            - gcs
          enumNames:
            - Terraform Cloud/Enterprise (Remote)
            - AWS S3 Backend
            - Azure Storage Backend
            - GCP Cloud Storage Backend
        separateWorkspaces:
          title: Use Separate Terraform Workspaces
          type: boolean
          description: Keep the state of each environment in its own Terraform workspace instead of in its own state path. Terraform Cloud always uses one workspace per environment.
          default: true
        stateFileStructure:
          title: State File Organization
          type: string
          description: How state files are organized in the backend
          default: hierarchical
          enum:
            - flat
            - hierarchical
          enumNames:
            - Flat (type-provider-env-name)
            - Hierarchical (type/provider/env/name)
        enableStateLocking:
          title: Enable State Locking
          type: boolean
          description: Prevent concurrent Terraform runs (highly recommended). Terraform Cloud always locks.
          default: true

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.componentName }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          componentType: ${{ parameters.componentType }}
          businessUnit: ${{ parameters.businessUnit }}
          provider: ${{ parameters.provider }}
          environment: ${{ parameters.environment }}
          region: ${{ parameters.region }}
          secondaryRegion: ${{ parameters.secondaryRegion }}
          projectName: ${{ parameters.projectName }}
          costCenter: ${{ parameters.costCenter }}
          applicationId: ${{ parameters.applicationId }}
          createResourceGroup: ${{ parameters.createResourceGroup }}
          resources: ${{ parameters.resources }}
          namingConvention: ${{ parameters.namingConvention }}
          autoShutdown: ${{ parameters.autoShutdown }}
          separateWorkspaces: ${{ parameters.separateWorkspaces }}
          backendType: ${{ parameters.backendType }}
          stateFileStructure: ${{ parameters.stateFileStructure }}
          enableStateLocking: ${{ parameters.enableStateLocking }}
          company: ${{ (parameters.repoUrl | parseRepoUrl).owner | lower }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
    # The Terraform code is specific to the provider; only the chosen
    # provider's code is added to the repository.
    - id: fetch-cloud
      name: Fetch Provider Infrastructure
      action: fetch:template
      input:
        url: ./clouds/${{ parameters.provider }}
        values:
          name: ${{ parameters.componentName }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          componentType: ${{ parameters.componentType }}
          businessUnit: ${{ parameters.businessUnit }}
          provider: ${{ parameters.provider }}
          environment: ${{ parameters.environment }}
          region: ${{ parameters.region }}
          secondaryRegion: ${{ parameters.secondaryRegion }}
          projectName: ${{ parameters.projectName }}
          costCenter: ${{ parameters.costCenter }}
          applicationId: ${{ parameters.applicationId }}
          createResourceGroup: ${{ parameters.createResourceGroup }}
          resources: ${{ parameters.resources }}
          namingConvention: ${{ parameters.namingConvention }}
          autoShutdown: ${{ parameters.autoShutdown }}
          separateWorkspaces: ${{ parameters.separateWorkspaces }}
          backendType: ${{ parameters.backendType }}
          stateFileStructure: ${{ parameters.stateFileStructure }}
          enableStateLocking: ${{ parameters.enableStateLocking }}
          company: ${{ (parameters.repoUrl | parseRepoUrl).owner | lower }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
    # Each provider directory carries every resource of the catalogue; the
    # ones that were not selected are removed.
    - id: remove-object-storage
      name: Remove Object Storage
      if: ${{ not ('object-storage' in parameters.resources) }}
      action: fs:delete
      input:
        files:
          - storage.tf
          - tests/storage.tftest.hcl
    - id: remove-virtual-network
      name: Remove Virtual Network
      if: ${{ not ('virtual-network' in parameters.resources or 'virtual-machine' in parameters.resources) }}
      action: fs:delete
      input:
        files:
          - network.tf
          - tests/network.tftest.hcl
    - id: remove-key-vault
      name: Remove Key Management
      if: ${{ not ('key-vault' in parameters.resources) }}
      action: fs:delete
      input:
        files:
          - key_vault.tf
          - tests/key_vault.tftest.hcl
    - id: remove-container-registry
      name: Remove Container Registry
      if: ${{ not ('container-registry' in parameters.resources) }}
      action: fs:delete
      input:
        files:
          - registry.tf
          - tests/registry.tftest.hcl
    - id: remove-log-workspace
      name: Remove Log Workspace
      if: ${{ not ('log-workspace' in parameters.resources) }}
      action: fs:delete
      input:
        files:
          - logs.tf
          - tests/logs.tftest.hcl
    - id: remove-virtual-machine
      name: Remove Virtual Machine
      if: ${{ not ('virtual-machine' in parameters.resources) }}
      action: fs:delete
      input:
        files:
          - vm.tf
          - tests/vm.tftest.hcl

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: 'feat: initial commit - ${{ parameters.componentType }} ${{ parameters.provider }} infrastructure'

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
