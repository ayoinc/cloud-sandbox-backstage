---
- name: Check the cluster settings
  ansible.builtin.assert:
    that:
      - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
      - k3s_token | length >= 32
      - k3s_api_endpoint | length > 0
      - groups['server'] | length > 0
      - not (k3s_kube_vip_enabled | bool) or k3s_api_endpoint is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
    fail_msg: >-
      k3s_version must be an exact release such as v1.37.2+k3s1, k3s_token at
      least 32 characters, the server group must not be empty, and with kube-vip
      k3s_api_endpoint must be an IPv4 address.
    quiet: true

- name: Install k3s
  ansible.builtin.import_tasks: install.yml

- name: Configure k3s
  ansible.builtin.import_tasks: configure.yml

- name: Start k3s and wait for the node
  ansible.builtin.import_tasks: service.yml
