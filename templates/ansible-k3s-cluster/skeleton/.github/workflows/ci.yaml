---
name: Playbook CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: {% raw %}${{ github.workflow }}{% endraw %}-{% raw %}${{ github.ref }}{% endraw %}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Check the inventory parses and every host has a node type
        run: |
          ansible-inventory --list > /dev/null
          ansible-inventory --graph k3s_cluster
          ansible k3s_cluster -m ansible.builtin.assert -a "that=k3s_node_type is defined" \
            --connection local -e ansible_python_interpreter=python3

      - name: Check playbook syntax
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook --syntax-check "$playbook"
          done
