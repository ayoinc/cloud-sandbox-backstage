---
k3s_cluster:
  children:
    # Control plane and etcd. The first host bootstraps the cluster.
    server:
      hosts:
{%- for host in values.servers %}
        ${{ host }}:
{%- endfor %}
    agent:
{%- if values.agents | length %}
      hosts:
{%- for host in values.agents %}
        ${{ host }}:
{%- endfor %}
{%- else %}
      hosts: {}
{%- endif %}
