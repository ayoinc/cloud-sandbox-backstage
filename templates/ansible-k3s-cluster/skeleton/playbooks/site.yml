---
# Builds the cluster, and brings an existing one back to the declared state.
# Safe to run again at any time: nodes that are already correct are not
# restarted.
- name: Prepare every node
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - role: k3s_prereq

# One server at a time: the first bootstraps etcd, and each further server
# must have joined before the next one starts, or quorum is at risk.
- name: Install the servers
  hosts: server
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: k3s

# In batches, so that a configuration change never restarts every agent at once.
- name: Install the agents
  hosts: agent
  become: true
  gather_facts: true
  serial: '25%'
  roles:
    - role: k3s

- name: Fetch a kubeconfig for the cluster
  hosts: server[0]
  become: true
  gather_facts: false
  vars:
    k3s_kubeconfig_dir: '{{ playbook_dir }}/../kubeconfig'
  tasks:
    - name: Read the admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      no_log: true

    - name: Create the local kubeconfig directory
      ansible.builtin.file:
        path: '{{ k3s_kubeconfig_dir }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    # The directory is ignored by git. The file grants cluster-admin: treat it
    # like a password.
    - name: Write the kubeconfig, pointed at the API endpoint
      ansible.builtin.copy:
        content: >-
          {{ k3s_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' ~ k3s_api_endpoint ~ ':' ~ (k3s_api_port | default(6443))) }}
        dest: '{{ k3s_kubeconfig_dir }}/config'
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true

    - name: List the nodes
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get nodes --output wide
      register: k3s_nodes
      changed_when: false

    - name: Show the cluster
      ansible.builtin.debug:
        msg: '{{ k3s_nodes.stdout_lines }}'
