# The plan: phases, and the milestones in each.
#
# `start` and `end` are a date (2027-03-01) or a week of the project
# ("week 3": a start is that week's Monday, an end is its Friday).
# `status` is one of: not started, in progress, done, at risk, blocked.
# `depends_on` lists the ids of milestones that must be done first.

project: ${{ values.projectName | dump }}
description: ${{ values.description | dump }}
sponsor: ''
manager: ''
start: ${{ values.startDate | dump }}

phases:
  - name: Discover
    milestones:
      - id: M1
        name: Scope and success measures agreed
        owner: Product lead
        start: week 1
        end: week 2
        status: in progress
      - id: M2
        name: Architecture design approved
        owner: Lead architect
        start: week 2
        end: week 4
        status: not started
        depends_on: [M1]

  - name: Build
    milestones:
      - id: M3
        name: Environments and pipeline ready
        owner: Platform lead
        start: week 3
        end: week 5
        status: not started
      - id: M4
        name: Core journeys built and tested
        owner: Engineering lead
        start: week 5
        end: week 10
        status: not started
        depends_on: [M2, M3]
      - id: M5
        name: Security and performance tested
        owner: Engineering lead
        start: week 9
        end: week 11
        status: not started
        depends_on: [M4]

  - name: Launch
    milestones:
      - id: M6
        name: Operational readiness signed off
        owner: Service owner
        start: week 11
        end: week 12
        status: not started
        depends_on: [M5]
      - id: M7
        name: Go-live
        owner: Service owner
        start: week 13
        end: week 13
        status: not started
        depends_on: [M6]
