# What the exported workbook and documents look like. `uv run scripts/build.py`
# reads this file. When `portal_url` is set to your organisation's address in
# the portal (https://portal.example.org/o/acme), its name, logo and primary
# colour are used instead, and the values below only for whatever the
# organisation has not set.

organisation: ''
# A PNG or JPEG in this repository, for example docs/assets/logo.png
logo: ''
# Headings and table headers. Six-digit hex.
primary_colour: '#3f4a5a'
classification: ${{ values.classification | dump }}
portal_url: ${{ values.portalUrl | dump }}
