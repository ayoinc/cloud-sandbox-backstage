name: k6 Load Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: '${{ values.testType or "load" }}'
        type: choice
        options:
          - load
          - stress
          - spike
          - soak
      virtual_users:
        description: 'Number of virtual users'
        required: false
        default: '${{ values.virtualUsers or 50 }}'
      duration:
        description: 'Test duration'
        required: false
        default: '${{ values.duration or "5m" }}'
      base_url:
        description: 'Target URL (empty: BASE_URL variable or secret, then ${{ values.baseUrl }})'
        required: false
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM

permissions:
  contents: read

env:
  DEFAULT_BASE_URL: ${{ values.baseUrl }}
  DEFAULT_TEST_TYPE: ${{ values.testType or "load" }}
{% raw %}
jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        # Code scanning is not available on private repositories without GitHub Advanced Security.
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  smoke-test:
    name: Validate Scripts and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Inspect scripts
        run: |
          for script in scripts/*-test.js; do
            echo "::group::k6 inspect $script"
            k6 inspect "$script"
            echo "::endgroup::"
          done

      - name: Start the bundled test target
        run: |
          node test-target/server.js &
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:3000/api/health && exit 0
            sleep 1
          done
          echo "The test target did not start" >&2
          exit 1

      - name: Run smoke tests
        env:
          BASE_URL: http://127.0.0.1:3000
        run: |
          for script in scripts/*-test.js; do
            echo "::group::k6 run $script"
            k6 run --vus 5 --duration 15s "$script"
            echo "::endgroup::"
          done

  target:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    outputs:
      configured: ${{ steps.resolve.outputs.configured }}
    steps:
      # A manual run falls back to the URL the project was created with; a
      # scheduled run only tests an environment configured on the repository.
      - name: Check for a target URL
        id: resolve
        env:
          BASE_URL: ${{ inputs.base_url || vars.BASE_URL || secrets.BASE_URL || (github.event_name == 'workflow_dispatch' && env.DEFAULT_BASE_URL) || '' }}
        run: |
          if [ -n "$BASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No BASE_URL variable or secret is set: the load test is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  load-test:
    name: Run k6 Test Against Target
    runs-on: ubuntu-latest
    # Leaves room for the four-hour soak test.
    timeout-minutes: 300
    needs: [smoke-test, target]
    if: needs.target.outputs.configured == 'true'
    env:
      VUS: ${{ inputs.virtual_users }}
      DURATION: ${{ inputs.duration }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Select test and target
        env:
          SELECTED_TEST_TYPE: ${{ inputs.test_type || env.DEFAULT_TEST_TYPE }}
          SELECTED_BASE_URL: ${{ inputs.base_url || vars.BASE_URL || secrets.BASE_URL || env.DEFAULT_BASE_URL }}
        run: |
          {
            echo "TEST_TYPE=${SELECTED_TEST_TYPE}"
            echo "BASE_URL=${SELECTED_BASE_URL}"
          } >> "$GITHUB_ENV"

      - name: Run k6 test
        run: k6 run --out json=results.json "scripts/${TEST_TYPE}-test.js"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-results
          path: results.json
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## k6 Load Test Results"
            echo ""
            echo "- **Test Type**: ${TEST_TYPE}"
            echo "- **Target URL**: ${BASE_URL}"
            echo "- **Virtual Users**: ${VUS:-script default}"
            echo "- **Duration**: ${DURATION:-script default}"
          } >> "$GITHUB_STEP_SUMMARY"
{% endraw %}
