apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: react-frontend
  title: React Frontend Application
  description: Create a React single-page application with Vite, TypeScript, Vitest and a GitHub Actions pipeline
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - recommended
    - react
    - frontend
    - typescript
    - web
spec:
  owner: platform-team
  type: website

  parameters:
    - title: Application Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Application Name
          type: string
          description: Name of the application and of its repository
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
          ui:help: 'Lowercase letters, numbers and hyphens; starts with a letter'
        description:
          title: Description
          type: string
          description: What the application is for
        owner:
          title: Owner
          type: string
          description: Team that owns the application
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

    - title: React and UI
      properties:
        react_version:
          title: React Version
          type: string
          description: Major version of react, react-dom and their type packages
          default: '18'
          enum:
            - '18'
            - '19'
        ui_framework:
          title: UI Framework
          type: string
          description: How the Button, Layout and Section components are built
          default: mui
          enum:
            - none
            - mui
            - tailwind
          enumNames:
            - Plain CSS modules
            - Material UI (MUI)
            - Tailwind CSS

    - title: State Management and Routing
      properties:
        state_management:
          title: State Management
          type: string
          description: Where the example counter state lives
          default: context
          enum:
            - context
            - zustand
            - redux
          enumNames:
            - React Context
            - Zustand
            - Redux Toolkit
        routing:
          title: Routing Library
          type: string
          description: Client-side routing with Home, About and Not Found pages, or a single page
          default: react-router
          enum:
            - none
            - react-router
          enumNames:
            - No Routing
            - React Router

    - title: API Integration
      properties:
        api_client:
          title: API Client
          type: string
          description: How the example item list calls the backend
          default: fetch
          enum:
            - fetch
            - axios
            - react-query
          enumNames:
            - Native Fetch
            - Axios
            - TanStack Query (React Query)
        api_base_url:
          title: API Base URL
          type: string
          description: Default base URL of the backend API, as a path on the same origin or an absolute URL
          default: /api
          pattern: '^(/|https?://)[A-Za-z0-9._~:/@%+-]*$'
        enable_mock_api:
          title: Enable Mock API
          type: boolean
          description: Add Mock Service Worker handlers used by the tests and, on request, by the development server
          default: true

    - title: Tooling and Delivery
      properties:
        enable_linting:
          title: Enable Linting and Formatting
          type: boolean
          description: Add Biome with a lint workflow
          default: true
        enable_storybook:
          title: Enable Storybook
          type: boolean
          description: Add Storybook with stories for the UI components and a workflow that builds it
          default: true
        enable_pwa:
          title: Progressive Web App
          type: boolean
          description: Generate a web app manifest and a service worker that precaches the build
          default: false
        enable_monitoring:
          title: Enable Web Vitals Reporting
          type: boolean
          description: Measure Core Web Vitals in the browser and report them to the console or to a URL
          default: true
        enable_docker:
          title: Enable Docker
          type: boolean
          description: Add an nginx image that serves the build and a workflow that builds, tests and publishes it
          default: true

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton/base
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          react_version: ${{ parameters.react_version }}
          ui_framework: ${{ parameters.ui_framework }}
          state_management: ${{ parameters.state_management }}
          routing: ${{ parameters.routing }}
          api_client: ${{ parameters.api_client }}
          api_base_url: ${{ parameters.api_base_url }}
          enable_mock_api: ${{ parameters.enable_mock_api }}
          enable_linting: ${{ parameters.enable_linting }}
          enable_storybook: ${{ parameters.enable_storybook }}
          enable_pwa: ${{ parameters.enable_pwa }}
          enable_monitoring: ${{ parameters.enable_monitoring }}
          enable_docker: ${{ parameters.enable_docker }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-ui
      name: Add UI Components
      action: fetch:template
      input:
        url: ./skeleton/ui-${{ parameters.ui_framework }}

    - id: fetch-state
      name: Add State Management
      action: fetch:template
      input:
        url: ./skeleton/state-${{ parameters.state_management }}

    - id: fetch-routing
      name: Add Application Shell
      action: fetch:template
      input:
        url: ./skeleton/routing-${{ parameters.routing }}

    - id: fetch-api
      name: Add API Client
      action: fetch:template
      input:
        url: ./skeleton/api-${{ parameters.api_client }}

    - id: fetch-mock-api
      name: Add Mock Service Worker
      if: ${{ parameters.enable_mock_api }}
      action: fetch:template
      input:
        url: ./skeleton/mock-api

    - id: fetch-api-stub
      name: Add API Stub for Tests
      if: ${{ not parameters.enable_mock_api }}
      action: fetch:template
      input:
        url: ./skeleton/api-stub-${{ 'axios' if parameters.api_client == 'axios' else 'fetch' }}

    - id: fetch-linting
      name: Add Biome
      if: ${{ parameters.enable_linting }}
      action: fetch:template
      input:
        url: ./skeleton/linting
        copyWithoutTemplating:
          - .github/workflows/*

    - id: fetch-storybook
      name: Add Storybook
      if: ${{ parameters.enable_storybook }}
      action: fetch:template
      input:
        url: ./skeleton/storybook
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          ui_framework: ${{ parameters.ui_framework }}
          enable_pwa: ${{ parameters.enable_pwa }}

    - id: fetch-pwa
      name: Add Web App Icons
      if: ${{ parameters.enable_pwa }}
      action: fetch:template
      input:
        url: ./skeleton/pwa

    - id: fetch-monitoring
      name: Add Web Vitals Reporting
      if: ${{ parameters.enable_monitoring }}
      action: fetch:template
      input:
        url: ./skeleton/monitoring

    - id: fetch-docker
      name: Add Docker Image
      if: ${{ parameters.enable_docker }}
      action: fetch:template
      input:
        url: ./skeleton/docker
        copyWithoutTemplating:
          - .github/workflows/*

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        repoVisibility: private
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: CI runs
        url: ${{ steps['publish'].output.remoteUrl + '/actions' }}
