apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  annotations:
    # Within an Application, resources of a lower wave are applied and healthy
    # first. Secrets are wave -1, so they exist before the pods start.
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          args:
            - --port=9898
            - --level=info
          ports:
            - name: http
              containerPort: 9898
          envFrom:
            # Created in wave -1 by the secrets tooling of this repository.
            # Optional, so that an app without secrets needs no change here.
            - secretRef:
                name: podinfo-config
                optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
