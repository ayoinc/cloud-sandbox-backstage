# External Secrets Operator: copies secrets from your secret manager into
# Kubernetes Secrets. It is synced before the apps (wave -1) because their
# ExternalSecret resources need its CRDs.
#
# The connection to the secret manager is the ClusterSecretStore
# "${{ values.secret_store }}". It is specific to your provider and identity set-up
# (workload identity, not static keys) and is owned by the platform team.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ${{ values.name }}-platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      valuesObject:
        installCRDs: true
        serviceMonitor:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too large for client-side apply annotations.
      - ServerSideApply=true
