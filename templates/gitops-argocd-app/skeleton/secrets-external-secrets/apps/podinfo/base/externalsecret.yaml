# Creates the Secret "podinfo-config" from an entry of the secret manager.
# Nothing secret is stored in Git: this resource only says where to read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: podinfo-config
  annotations:
    # Before the Deployment (wave 0), so the Secret exists when the pods start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${{ values.secret_store }}
  target:
    name: podinfo-config
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    # Every key of the remote entry becomes a key of the Secret. Overlays
    # replace the key with podinfo/<environment>.
    - extract:
        key: podinfo/base
