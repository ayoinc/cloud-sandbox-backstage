---
# meta/main.yml - Role metadata
# Generated for: ${{ values.name }}

galaxy_info:
  # Galaxy allows only lower-case letters, digits and underscores in both
  role_name: ${{ values.name | lower | replace('-', '_') | dump }}
  namespace: ${{ values.destination.owner | lower | replace('-', '_') | dump }}
  author: ${{ values.owner | dump }}
  description: ${{ values.description | dump }}
  company: ''
  license: MIT
  min_ansible_version: '2.9'

  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Debian
      versions:
        - bullseye
        - bookworm
    - name: EL
      versions:
        - '8'
        - '9'

  galaxy_tags:
    - docker
    - containers
    - devops
    - automation

dependencies: []
