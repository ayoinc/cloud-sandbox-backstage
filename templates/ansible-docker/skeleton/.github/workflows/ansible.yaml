---
name: Ansible Role CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

      - name: Install dependencies
        run: pip install ansible-lint yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for misconfigurations and committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '1'

  molecule:
    name: Molecule Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu2204
          - debian12
          - rockylinux9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

      - name: Install dependencies
        run: pip install ansible molecule "molecule-plugins[docker]"

      - name: Run Molecule tests
        run: molecule test
        env:
          MOLECULE_DISTRO: {% raw %}${{ matrix.distro }}{% endraw %}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

  galaxy-credentials:
    name: Check Galaxy credentials
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      available: {% raw %}${{ steps.check.outputs.available }}{% endraw %}
    steps:
      - name: Report whether GALAXY_API_KEY is configured
        id: check
        env:
          GALAXY_API_KEY: {% raw %}${{ secrets.GALAXY_API_KEY }}{% endraw %}
        run: |
          if [ -n "$GALAXY_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GALAXY_API_KEY is not set, so the Galaxy release is skipped."
          fi

  release:
    name: Release to Galaxy
    runs-on: ubuntu-latest
    needs: [molecule, security, galaxy-credentials]
    if: needs.galaxy-credentials.outputs.available == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: {% raw %}${{ env.PYTHON_VERSION }}{% endraw %}

      - name: Install Ansible
        run: pip install ansible-core

      - name: Import to Ansible Galaxy
        env:
          GALAXY_API_KEY: {% raw %}${{ secrets.GALAXY_API_KEY }}{% endraw %}
          REPOSITORY_OWNER: {% raw %}${{ github.repository_owner }}{% endraw %}
          REPOSITORY_NAME: {% raw %}${{ github.event.repository.name }}{% endraw %}
        run: |
          ansible-galaxy role import \
            --token "$GALAXY_API_KEY" \
            "$REPOSITORY_OWNER" \
            "$REPOSITORY_NAME"
