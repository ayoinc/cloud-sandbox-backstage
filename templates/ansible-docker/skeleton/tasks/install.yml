---
# tasks/install.yml - Install Docker packages
# Generated for: ${{ values.name }}

- name: Install Docker (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - "{{ docker_package }}{{ docker_version | ternary('=' + docker_version + '*', '') }}"
      - "{{ docker_package }}-cli{{ docker_version | ternary('=' + docker_version + '*', '') }}"
      - containerd.io
      - docker-buildx-plugin
    state: '{{ docker_package_state }}'
    update_cache: true
  when: ansible_facts.os_family == 'Debian'
  notify: Restart Docker

- name: Install Docker (RedHat/CentOS)
  ansible.builtin.dnf:
    name:
      - "{{ docker_package }}{{ docker_version | ternary('-' + docker_version, '') }}"
      - "{{ docker_package }}-cli{{ docker_version | ternary('-' + docker_version, '') }}"
      - containerd.io
      - docker-buildx-plugin
    state: '{{ docker_package_state }}'
  when: ansible_facts.os_family == 'RedHat'
  notify: Restart Docker

- name: Ensure Docker service is started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
