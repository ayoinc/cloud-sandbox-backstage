site_name: ${{ values.name | dump }}
site_description: ${{ values.description | dump }}

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Examples: examples.md

plugins:
  - techdocs-core
  - d2:
      theme: 4

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
