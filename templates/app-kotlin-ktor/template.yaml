apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: app-kotlin-ktor
  title: Kotlin Ktor Service
  description: Create a Ktor 3 service in Kotlin with a Gradle version catalog, kotlinx.serialization, JSON logs, tests and a distroless image
  tags:
    - kotlin
    - ktor
    - api
    - backend
    - docker
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:software-backend
  type: service

  parameters:
    - title: Project Information
      required:
        - name
        - owner
      properties:
        name:
          title: Project Name
          type: string
          description: Name of the project, the repository and the catalog entry
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 50
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What this project is for
        owner:
          title: Owner
          type: string
          description: Team that owns this resource
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Service Configuration
      required:
        - packageName
      properties:
        packageName:
          title: Kotlin Package
          type: string
          description: Package of the generated sources and Gradle group, in reverse domain notation
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
          ui:placeholder: org.yourorganisation.orders

        port:
          title: Port
          type: integer
          description: Port the service listens on
          default: 8080
          minimum: 1024
          maximum: 65535

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description or 'Ktor service' }}
          owner: ${{ parameters.owner }}
          packageName: ${{ parameters.packageName }}
          port: ${{ parameters.port or 8080 }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: 'Ktor service: ${{ parameters.name }}'
        repoVisibility: private
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
