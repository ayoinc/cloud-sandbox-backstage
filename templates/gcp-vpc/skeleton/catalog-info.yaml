apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.name }}
  description: ${{ (values.description or 'GCP VPC network') | dump }}
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
  tags:
    - gcp
    - vpc
    - networking
    - ${{ values.environment }}
  links:
    - url: https://console.cloud.google.com/networking/networks
      title: GCP Console
      icon: cloud
spec:
  type: network
  owner: ${{ values.owner }}
  lifecycle: ${{ values.environment }}
  system: cloud-infrastructure
