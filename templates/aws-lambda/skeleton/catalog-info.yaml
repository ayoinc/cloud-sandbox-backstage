apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ (values.description or ('AWS Lambda Function - ' + values.environment)) | dump }}
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
  tags:
    - terraform
    - aws
    - lambda
spec:
  type: infrastructure
  lifecycle: production
  owner: ${{ values.owner }}
