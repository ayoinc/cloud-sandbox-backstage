apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: docker-application-template
  title: Docker Application
  description: Create a containerised service with a tested, scanned and published Docker image
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - recommended
    - docker
    - application
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Basic Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the application
          pattern: '^([a-z0-9\-])+$'
          ui:autofocus: true
          ui:help: 'Use lowercase letters, numbers, and hyphens only'
        description:
          title: Description
          type: string
          description: Brief description of the application
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
    - title: Repository Information
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
    - title: Docker Configuration
      required:
        - baseImage
      properties:
        baseImage:
          title: Base Image
          type: string
          description: Image the application is built on. It also selects the language of the starter application.
          default: 'node:24-alpine'
          enum:
            - 'node:24-alpine'
            - 'python:3.13-alpine'
            - 'eclipse-temurin:21-jdk-alpine'
            - 'golang:1.27-alpine'
          enumNames:
            - 'Node.js 24 (Alpine)'
            - 'Python 3.13 (Alpine)'
            - 'Java 21, Eclipse Temurin (Alpine)'
            - 'Go 1.27 (Alpine)'
        port:
          title: Container Port
          type: integer
          description: Port the application listens on. The container runs as a non-root user, so use 1024 or higher.
          default: 8080
          minimum: 1024
          maximum: 65535
        includeHealthcheck:
          title: Include Healthcheck
          type: boolean
          description: Add a HEALTHCHECK instruction that calls /health to the Dockerfile
          default: true
  steps:
    - id: fetch
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton/base
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          baseImage: ${{ parameters.baseImage }}
          port: ${{ parameters.port or 8080 }}
          includeHealthcheck: ${{ parameters.includeHealthcheck }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-node
      name: Add Node.js Application
      if: ${{ parameters.baseImage == 'node:24-alpine' }}
      action: fetch:template
      input:
        url: ./skeleton/node
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          baseImage: ${{ parameters.baseImage }}
          port: ${{ parameters.port or 8080 }}
          includeHealthcheck: ${{ parameters.includeHealthcheck }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-python
      name: Add Python Application
      if: ${{ parameters.baseImage == 'python:3.13-alpine' }}
      action: fetch:template
      input:
        url: ./skeleton/python
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          baseImage: ${{ parameters.baseImage }}
          port: ${{ parameters.port or 8080 }}
          includeHealthcheck: ${{ parameters.includeHealthcheck }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-java
      name: Add Java Application
      if: ${{ parameters.baseImage == 'eclipse-temurin:21-jdk-alpine' }}
      action: fetch:template
      input:
        url: ./skeleton/java
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          baseImage: ${{ parameters.baseImage }}
          port: ${{ parameters.port or 8080 }}
          includeHealthcheck: ${{ parameters.includeHealthcheck }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: fetch-golang
      name: Add Go Application
      if: ${{ parameters.baseImage == 'golang:1.27-alpine' }}
      action: fetch:template
      input:
        url: ./skeleton/golang
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          baseImage: ${{ parameters.baseImage }}
          port: ${{ parameters.port or 8080 }}
          includeHealthcheck: ${{ parameters.includeHealthcheck }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: 'Initial commit from Docker Application template'

    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
