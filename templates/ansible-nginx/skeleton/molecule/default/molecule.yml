---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: instance
    # Systemd-enabled images; MOLECULE_DISTRO selects the distribution.
    image: 'geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2204}-ansible:latest'
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    # converge.yml refers to the role by the name of its checkout directory.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
