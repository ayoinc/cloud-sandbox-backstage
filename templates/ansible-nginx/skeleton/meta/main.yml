---
galaxy_info:
  # Galaxy allows only lower-case letters, digits and underscores in both
  role_name: ${{ values.name | lower | replace('-', '_') }}
  namespace: ${{ values.destination.owner | lower | replace('-', '_') }}
  author: ${{ values.owner }}
  description: ${{ values.description }}
  license: MIT
  min_ansible_version: '2.9'

  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Debian
      versions:
        - bullseye
        - bookworm
    - name: EL
      versions:
        - '8'
        - '9'

  galaxy_tags:
    - nginx
    - webserver
    - web
    - http

dependencies: []
