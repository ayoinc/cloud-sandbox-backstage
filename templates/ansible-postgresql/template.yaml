apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ansible-postgresql
  title: Ansible PostgreSQL Role
  description: Create a PostgreSQL role with tuned configuration, declared roles and databases, pgBackRest backups and an optional streaming replica
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - ansible
    - postgresql
    - database
    - backup
    - replication
spec:
  owner: platform-team
  type: ansible-role

  parameters:
    - title: Role Configuration
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Name of the role repository (lower-case letters, digits, hyphens and underscores)
          pattern: '^[a-z0-9]([a-z0-9_-]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What this repository is for, in one sentence
        owner:
          title: Owner
          type: string
          description: Team or user that owns the repository
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User

    - title: PostgreSQL
      required:
        - postgresVersion
      properties:
        postgresVersion:
          title: PostgreSQL Version
          type: string
          description: Major version installed from the PGDG repositories
          default: '18'
          enum:
            - '18'
            - '17'
            - '16'
        storageType:
          title: Storage
          type: string
          description: Kind of disk under the data directory; sets planner cost and I/O concurrency
          default: ssd
          enum:
            - ssd
            - hdd
          enumNames:
            - Solid state (SSD, NVMe, cloud block storage)
            - Spinning disk
        enableReplication:
          title: Streaming Replication
          type: boolean
          description: Prepare the primary for streaming replicas and allow hosts to be seeded as replicas
          default: false

    - title: Backups
      properties:
        enableBackups:
          title: pgBackRest Backups
          type: boolean
          description: Install pgBackRest, archive WAL and schedule full and differential backups
          default: true
        backupRepoType:
          title: Backup Repository
          type: string
          description: Where pgBackRest stores backups and archived WAL
          default: posix
          enum:
            - posix
            - s3
            - azure
            - gcs
          enumNames:
            - Local or mounted file system
            - S3-compatible object storage
            - Azure Blob Storage
            - Google Cloud Storage

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: template
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - '**/*.j2'
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          postgresVersion: ${{ parameters.postgresVersion }}
          storageType: ${{ parameters.storageType }}
          enableBackups: ${{ parameters.enableBackups }}
          backupRepoType: ${{ parameters.backupRepoType }}
          enableReplication: ${{ parameters.enableReplication }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
