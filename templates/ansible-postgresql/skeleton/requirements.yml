---
# Collections the role and its tests need, pinned to exact versions.
#
#   ansible-galaxy collection install -r requirements.yml
collections:
  # Roles, databases, extensions, replication slots and queries.
  - name: community.postgresql
    version: 5.1.1
  # Molecule's Docker driver creates test instances with these modules.
  - name: community.docker
    version: 5.4.0
