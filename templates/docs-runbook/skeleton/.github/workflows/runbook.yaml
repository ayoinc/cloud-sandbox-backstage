name: Runbook Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  D2_VERSION: '0.9.0'

jobs:
  validate:
    name: Validate Runbooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runbook files
        run: bash scripts/validate-runbooks.sh

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs with the TechDocs and D2 plugins
        run: pip install mkdocs-techdocs-core==1.7.1 mkdocs-d2-plugin==1.7.0

      - name: Install D2
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2

      - name: Build documentation
        run: mkdocs build --strict
