site_name: ${{ values.name | dump }}
site_description: ${{ values.description | dump }}

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - On-Call Guide: getting-started/oncall-guide.md
  - Incidents:
      - Overview: incidents/index.md
      - High CPU: incidents/high-cpu.md
      - High Memory: incidents/high-memory.md
      - Service Down: incidents/service-down.md
      - Database Issues: incidents/database-issues.md
  - Procedures:
      - Overview: procedures/index.md
      - Deployment: procedures/deployment.md
      - Rollback: procedures/rollback.md
      - Scaling: procedures/scaling.md
{%- if values.includeTemplates %}
  - Templates: runbook-templates.md
{%- endif %}

plugins:
  - techdocs-core
  - d2

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
