{%- set windows = values.base_os == "windows-2022" -%}
{%- set provider = values.cloud_provider -%}
name: Packer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKER_VERSION: '1.16.2'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: {% raw %}${{ env.PACKER_VERSION }}{% endraw %}

      - name: Check formatting
        run: packer fmt -check -diff -recursive .

      - name: Install plugins
        run: packer init .
        env:
          PACKER_GITHUB_API_TOKEN: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}

      # Checks the whole template, plugins included, without contacting the
      # provider.
      - name: Validate template
        run: packer validate .
{%- if provider == "gcp" %}
        # Placeholder for a value that only a build needs.
        env:
          GOOGLE_CLOUD_PROJECT: validate-only
{%- elif provider == "vmware" %}
        # Placeholders for values that only a build needs.
        env:
          VSPHERE_SERVER: vcenter.invalid
          VSPHERE_USER: validate-only
          VSPHERE_PASSWORD: validate-only
          VSPHERE_CLUSTER: validate-only
          PACKER_GUEST_USERNAME: validate-only
          PACKER_GUEST_PASSWORD: validate-only
{%- endif %}

  scripts:
    name: Lint provisioning scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
{%- if windows %}

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $findings = Invoke-ScriptAnalyzer -Path scripts/provision.ps1 -Severity Warning, Error
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }
{%- else %}

      - name: Check shell syntax
        run: bash -n scripts/provision.sh

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
{%- endif %}

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan for committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'

  # A build needs access to the provider. Until it is configured the build is
  # skipped, so a new repository is green from its first push.
  credentials:
    name: Check build credentials
    runs-on: ubuntu-24.04
    outputs:
      available: {% raw %}${{ steps.check.outputs.available }}{% endraw %}
    steps:
      - name: Look for build credentials
        id: check
        env:
{%- if provider == "aws" %}
          REQUIRED: {% raw %}${{ secrets.AWS_ROLE_ARN }}{% endraw %}
          MISSING: AWS_ROLE_ARN
{%- elif provider == "azure" %}
          REQUIRED: {% raw %}${{ secrets.AZURE_CLIENT_ID && secrets.AZURE_TENANT_ID && secrets.AZURE_SUBSCRIPTION_ID }}{% endraw %}
          MISSING: AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID
{%- elif provider == "gcp" %}
          REQUIRED: {% raw %}${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER && secrets.GCP_SERVICE_ACCOUNT && secrets.GCP_PROJECT_ID }}{% endraw %}
          MISSING: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT and GCP_PROJECT_ID
{%- elif provider == "vmware" %}
          REQUIRED: {% raw %}${{ secrets.VSPHERE_SERVER && secrets.VSPHERE_USER && secrets.VSPHERE_PASSWORD }}{% endraw %}
          MISSING: VSPHERE_SERVER, VSPHERE_USER and VSPHERE_PASSWORD
{%- endif %}
        run: |
          if [ -n "$REQUIRED" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Image build skipped. Set the repository secrets $MISSING to enable it."
          fi

  build:
    name: Build image
    needs: [validate, scripts, secret-scan, credentials]
    if: needs.credentials.outputs.available == 'true' && github.event_name != 'pull_request'
{%- if provider == "vmware" %}
    # vCenter is rarely reachable from GitHub-hosted runners; set the
    # PACKER_RUNNER variable to the label of a self-hosted runner that is.
    runs-on: {% raw %}${{ vars.PACKER_RUNNER || 'ubuntu-24.04' }}{% endraw %}
{%- else %}
    runs-on: ubuntu-24.04
{%- endif %}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: {% raw %}${{ env.PACKER_VERSION }}{% endraw %}
{%- if provider == "aws" %}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: {% raw %}${{ secrets.AWS_ROLE_ARN }}{% endraw %}
          aws-region: ${{ values.region }}
{%- elif provider == "azure" %}

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: {% raw %}${{ secrets.AZURE_CLIENT_ID }}{% endraw %}
          tenant-id: {% raw %}${{ secrets.AZURE_TENANT_ID }}{% endraw %}
          subscription-id: {% raw %}${{ secrets.AZURE_SUBSCRIPTION_ID }}{% endraw %}
{%- elif provider == "gcp" %}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: {% raw %}${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}{% endraw %}
          service_account: {% raw %}${{ secrets.GCP_SERVICE_ACCOUNT }}{% endraw %}
          project_id: {% raw %}${{ secrets.GCP_PROJECT_ID }}{% endraw %}
{%- endif %}

      - name: Install plugins
        run: packer init .
        env:
          PACKER_GITHUB_API_TOKEN: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}

      - name: Build image
        run: packer build -color=false .
{%- if provider == "azure" %}
        env:
          ARM_SUBSCRIPTION_ID: {% raw %}${{ secrets.AZURE_SUBSCRIPTION_ID }}{% endraw %}
{%- elif provider == "gcp" %}
        env:
          GOOGLE_CLOUD_PROJECT: {% raw %}${{ secrets.GCP_PROJECT_ID }}{% endraw %}
{%- elif provider == "vmware" %}
        env:
          VSPHERE_SERVER: {% raw %}${{ secrets.VSPHERE_SERVER }}{% endraw %}
          VSPHERE_USER: {% raw %}${{ secrets.VSPHERE_USER }}{% endraw %}
          VSPHERE_PASSWORD: {% raw %}${{ secrets.VSPHERE_PASSWORD }}{% endraw %}
          VSPHERE_CLUSTER: {% raw %}${{ vars.VSPHERE_CLUSTER }}{% endraw %}
          VSPHERE_DATASTORE: {% raw %}${{ vars.VSPHERE_DATASTORE }}{% endraw %}
          PACKER_GUEST_USERNAME: {% raw %}${{ secrets.PACKER_GUEST_USERNAME }}{% endraw %}
          PACKER_GUEST_PASSWORD: {% raw %}${{ secrets.PACKER_GUEST_PASSWORD }}{% endraw %}
{%- endif %}

      - name: Upload build manifest
        uses: actions/upload-artifact@v6
        with:
          name: packer-manifest
          path: manifest.json
