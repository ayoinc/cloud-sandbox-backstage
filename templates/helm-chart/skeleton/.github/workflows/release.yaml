name: Release

# Publishes the chart when a tag v<chart version> is pushed.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  HELM_UNITTEST_VERSION: v1.2.1

jobs:
  publish:
    name: Publish, sign and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The OIDC token of this run is the signing identity: no keys are stored.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Check that the tag matches the chart version
        id: chart
        run: |
          set -- charts/*/
          if [ "$#" -ne 1 ]; then
            echo "::error::Expected exactly one chart in charts/, found $#"
            exit 1
          fi
          chart="${1%/}"
          name="$(helm show chart "$chart" | awk '$1 == "name:" { print $2 }')"
          version="$(helm show chart "$chart" | awk '$1 == "version:" { print $2 }')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in $chart/Chart.yaml"
            exit 1
          fi
          {
            echo "dir=$chart"
            echo "name=$name"
            echo "version=$version"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          } >> "$GITHUB_OUTPUT"

      - name: Lint and unit test
        env:
          CHART: ${{ steps.chart.outputs.dir }}
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION" --verify=false
          helm lint "$CHART" --strict
          helm unittest "$CHART"

      - name: Package
        env:
          CHART: ${{ steps.chart.outputs.dir }}
        run: helm package "$CHART" --destination dist

      - name: Log in to the GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push
        id: push
        env:
          NAME: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          REGISTRY: ${{ steps.chart.outputs.registry }}
        run: |
          # A published version is immutable: consumers pin it.
          if helm show chart "oci://$REGISTRY/$NAME" --version "$VERSION" >/dev/null 2>&1; then
            echo "::error::$NAME $VERSION is already published. Increase the version in Chart.yaml."
            exit 1
          fi
          helm push "dist/$NAME-$VERSION.tgz" "oci://$REGISTRY" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(awk '$1 == "Digest:" { print $2 }' "$RUNNER_TEMP/push.log")"
          if [ -z "$digest" ]; then
            echo "::error::helm push did not report a digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless signing: cosign obtains a short-lived certificate for this
      # workflow's identity and records the signature in the transparency log.
      - name: Sign with cosign
        env:
          IMAGE: ${{ steps.chart.outputs.registry }}/${{ steps.chart.outputs.name }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # GitHub keeps attestations for public repositories, and for private
      # ones only on Enterprise Cloud: set the ATTEST_PRIVATE variable to
      # 'true' there.
      - name: Attest build provenance
        if: (!github.event.repository.private || vars.ATTEST_PRIVATE == 'true')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.chart.outputs.registry }}/${{ steps.chart.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          NAME: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          REGISTRY: ${{ steps.chart.outputs.registry }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published $NAME $VERSION"
            echo
            echo '```sh'
            echo "helm install my-release oci://$REGISTRY/$NAME --version $VERSION"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
