apiVersion: v2
name: ${{ values.name }}
description: ${{ values.description | dump }}
type: application

# Version of the chart. Increase it with every change to the chart, following
# semantic versioning. A Git tag v<version> publishes it.
version: 0.1.0

# Version of the application the chart deploys by default: the image tag.
appVersion: ${{ values.app_version | dump }}

kubeVersion: '>=1.31.0-0'

home: https://github.com/${{ values.destination.owner }}/${{ values.destination.repo }}
sources:
  - https://github.com/${{ values.destination.owner }}/${{ values.destination.repo }}
keywords:
  - ${{ values.name }}
annotations:
  artifacthub.io/license: UNLICENSED
