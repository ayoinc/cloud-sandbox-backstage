# Run by "helm test": calls the Service from inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "${{ values.name }}.fullname" . }}-test-connection
  labels:
    {{- include "${{ values.name }}.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0
      command: ["wget"]
      args:
        - --spider
        - --timeout=5
        - http://{{ include "${{ values.name }}.fullname" . }}:{{ .Values.service.port }}{{ dig "httpGet" "path" "/" .Values.readinessProbe }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
