name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  D2_VERSION: '0.9.0'
  PANDOC_VERSION: '3.13'
  TYPST_VERSION: '0.15.1'

jobs:
  site:
    name: Build the pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install D2
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2

      - name: Build documentation
        run: uvx --with mkdocs-techdocs-core==1.7.1 --with mkdocs-d2-plugin==1.7.0 mkdocs build --strict

  export:
    name: Export PDF and Word
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install D2, pandoc, typst and librsvg
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/pandoc-${PANDOC_VERSION}/bin/pandoc" /usr/local/bin/pandoc
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin fonts-liberation2

      - name: Export the documents
        run: uv run scripts/export.py

      - name: Keep the documents
        uses: actions/upload-artifact@v4
        with:
          name: design-documents
          path: out/*.pdf
          if-no-files-found: error

      - name: Keep the Word documents
        uses: actions/upload-artifact@v4
        with:
          name: design-documents-word
          path: out/*.docx
          if-no-files-found: error
