# Production configuration for containerized deployment
# This file is merged with app-config.yaml

app:
  title: Developer Portal
  # The address people open, for example https://portal.example.org
  baseUrl: ${APP_BASE_URL:-http://localhost}

organization:
  # What the portal is called outside an organisation. At an organisation's
  # address (/o/<slug>) the app uses the organisation's own name instead.
  name: Developer Portal

backend:
  baseUrl: ${APP_BASE_URL:-http://localhost}
  listen: ':7007'
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    # SECURITY: Restrict CORS to specific origins
    # Set CORS_ORIGIN environment variable to your frontend domain
    # Examples: "https://backstage.example.com" or "http://localhost:3000"
    origin: ${CORS_ORIGIN:-http://localhost}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # PostgreSQL database
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: backstage

  # Redis cache
  cache:
    store: redis
    connection: redis://${REDIS_HOST}:${REDIS_PORT}
    redis:
      client:
        namespace: backstage

# GitHub integration
integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

# Kubernetes - provide empty clusters to satisfy required config
kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: config
      clusters: []

# TechDocs with MinIO (S3-compatible) storage
techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
    mkdocs:
      # The generator drops plugins it does not know, and without this one
      # every D2 diagram is published as a block of source text.
      dangerouslyAllowAdditionalPlugins: [d2]
  publisher:
    type: 'awsS3'
    awsS3:
      bucketName: ${TECHDOCS_BUCKET}
      endpoint: http://${MINIO_HOST}:${MINIO_PORT}
      region: us-east-1
      s3ForcePathStyle: true
      credentials:
        accessKeyId: ${MINIO_ACCESS_KEY}
        secretAccessKey: ${MINIO_SECRET_KEY}

auth:
  environment: production
  providers:
    # Guest sign-in is ON. Installs rely on it until GitHub sign-in is
    # configured. Everyone who uses it shares one account
    # (user:development/guest), which can register catalog files and run
    # templates, and sees what that account registered. To turn it off once
    # another way to sign in works, replace the two lines below with
    # `guest: null`, or set dangerouslyAllowOutsideDevelopment to false.
    guest:
      dangerouslyAllowOutsideDevelopment: true
    # GitHub OAuth for real GitHub users
    github:
      production:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        callbackUrl: ${APP_BASE_URL:-http://localhost}/api/auth/github/handler/frame

scaffolder:
  defaultAuthor:
    name: ${SCAFFOLDER_AUTHOR_NAME:-Developer Portal}
    email: ${SCAFFOLDER_AUTHOR_EMAIL:-portal@localhost}
  defaultCommitMessage: 'Initial commit from a portal template'

catalog:
  # Automatically delete orphaned entities when their source is removed
  orphanStrategy: delete
  # Refresh entities automatically - check every 30 seconds for changes
  processingInterval: { seconds: 30 }
  rules:
    - allow:
        [
          Component,
          System,
          API,
          Resource,
          Location,
          Domain,
          Template,
          User,
          Group,
        ]

  # GitHub Organization Entity Provider - syncs teams and members
  providers:
    githubOrg:
      - id: production
        githubUrl: https://github.com
        orgs:
          - ${GITHUB_ORG}
        schedule:
          initialDelay: { seconds: 10 }
          frequency: { minutes: 5 }
          timeout: { minutes: 3 }

  locations:
    # Users and Groups
    - type: file
      target: ./catalog/users.yaml
      rules:
        - allow: [User, Group]

    # Domains
