apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: kubernetes-platform
  title: Multi-Cloud Kubernetes Platform
  description: Production-ready Kubernetes platform with GitOps, observability, and security on AWS EKS, Azure AKS, or GCP GKE
  tags:
    - kubernetes
    - multi-cloud
    - gitops
    - platform
    - terraform
    - recommended
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Project Configuration
      required:
        - projectName
        - environment
        - owner
        - cloudProvider
      properties:
        projectName:
          title: Project Name
          type: string
          description: Name for the Kubernetes platform, used as a prefix for resource names (lowercase letters, digits and hyphens, at most 16 characters)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 16
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: Team or user that owns this infrastructure
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User
        environment:
          title: Environment
          type: string
          enum:
            - dev
            - staging
            - production
          default: dev
        cloudProvider:
          title: Cloud Provider
          type: string
          enum:
            - aws
            - azure
            - gcp
          enumNames:
            - Amazon Web Services (EKS)
            - Microsoft Azure (AKS)
            - Google Cloud Platform (GKE)
          default: aws
      dependencies:
        cloudProvider:
          oneOf:
            - properties:
                cloudProvider:
                  enum:
                    - aws
                awsRegion:
                  title: AWS Region
                  type: string
                  enum:
                    - us-east-1
                    - us-west-2
                    - eu-west-1
                    - eu-central-1
                    - ap-southeast-1
                  default: us-east-1
            - properties:
                cloudProvider:
                  enum:
                    - azure
                azureRegion:
                  title: Azure Region
                  type: string
                  enum:
                    - eastus
                    - westus2
                    - westeurope
                    - northeurope
                    - southeastasia
                  default: eastus
                azureSubscriptionId:
                  title: Azure Subscription ID
                  type: string
                  description: Subscription the resources are created in. Leave empty to use the subscription of the pipeline's credentials.
                  pattern: '^([0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12})?$'
            - required:
                - gcpProjectId
              properties:
                cloudProvider:
                  enum:
                    - gcp
                gcpRegion:
                  title: GCP Region
                  type: string
                  enum:
                    - us-central1
                    - us-east1
                    - europe-west1
                    - europe-west2
                    - asia-east1
                  default: us-central1
                gcpProjectId:
                  title: GCP Project ID
                  type: string
                  description: ID of the Google Cloud project the resources are created in
                  pattern: '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'

    - title: Cluster Configuration
      properties:
        kubernetesVersion:
          title: Kubernetes Version
          type: string
          enum:
            - '1.37'
            - '1.36'
            - '1.35'
          default: '1.36'
        nodePoolConfig:
          title: Node Pool Configuration
          type: object
          properties:
            minNodes:
              title: Minimum Nodes
              type: integer
              minimum: 1
              maximum: 100
              default: 3
            maxNodes:
              title: Maximum Nodes
              type: integer
              minimum: 1
              maximum: 100
              default: 10
            nodeSize:
              title: Node Size
              type: string
              enum:
                - small
                - medium
                - large
              enumNames:
                - Small (2 vCPU, 4GB)
                - Medium (4 vCPU, 16GB)
                - Large (8 vCPU, 32GB)
              default: medium

    - title: Platform Components
      properties:
        enableGitOps:
          title: Enable GitOps (ArgoCD)
          type: boolean
          default: true
          description: Install ArgoCD for GitOps-based deployments
        enableObservability:
          title: Enable Observability Stack
          type: boolean
          default: true
          description: Install Prometheus, Grafana, and Loki
        enableServiceMesh:
          title: Enable Service Mesh (Istio)
          type: boolean
          default: false
          description: Install Istio service mesh
        enableCertManager:
          title: Enable Cert-Manager
          type: boolean
          default: true
          description: Install cert-manager for TLS certificate management
        enableExternalDns:
          title: Enable External-DNS
          type: boolean
          default: true
          description: Install external-dns for automatic DNS management
        enableIngress:
          title: Ingress Controller
          type: string
          description: Traefik is maintained. ingress-nginx was retired by the Kubernetes project in March 2026 and gets no further releases; choose it only for existing setups.
          enum:
            - traefik
            - nginx
            - none
          enumNames:
            - Traefik
            - ingress-nginx (retired)
            - None
          default: traefik

    - title: Security Configuration
      properties:
        enablePodSecurityPolicies:
          title: Enable Pod Security Standards
          type: boolean
          default: true
        enableNetworkPolicies:
          title: Enable Network Policies
          type: boolean
          default: true
        enableOPA:
          title: Enable OPA/Gatekeeper
          type: boolean
          default: false
          description: Install OPA Gatekeeper for policy enforcement
        enableVaultIntegration:
          title: Enable HashiCorp Vault Integration
          type: boolean
          default: false

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-platform
      name: Fetch Platform Components
      action: fetch:template
      input:
        url: ./skeleton/common
        values: &values
          projectName: ${{ parameters.projectName }}
          environment: ${{ parameters.environment }}
          cloudProvider: ${{ parameters.cloudProvider }}
          awsRegion: ${{ parameters.awsRegion or 'us-east-1' }}
          azureRegion: ${{ parameters.azureRegion or 'eastus' }}
          azureSubscriptionId: ${{ parameters.azureSubscriptionId }}
          gcpRegion: ${{ parameters.gcpRegion or 'us-central1' }}
          gcpProjectId: ${{ parameters.gcpProjectId }}
          kubernetesVersion: ${{ parameters.kubernetesVersion or '1.36' }}
          minNodes: ${{ parameters.nodePoolConfig.minNodes or 3 }}
          maxNodes: ${{ parameters.nodePoolConfig.maxNodes or 10 }}
          nodeSize: ${{ parameters.nodePoolConfig.nodeSize or 'medium' }}
          enableGitOps: ${{ parameters.enableGitOps if parameters.enableGitOps is defined else true }}
          enableObservability: ${{ parameters.enableObservability if parameters.enableObservability is defined else true }}
          enableServiceMesh: ${{ parameters.enableServiceMesh if parameters.enableServiceMesh is defined else false }}
          enableCertManager: ${{ parameters.enableCertManager if parameters.enableCertManager is defined else true }}
          enableExternalDns: ${{ parameters.enableExternalDns if parameters.enableExternalDns is defined else true }}
          enableIngress: ${{ parameters.enableIngress or 'traefik' }}
          enablePodSecurityPolicies: ${{ parameters.enablePodSecurityPolicies if parameters.enablePodSecurityPolicies is defined else true }}
          enableNetworkPolicies: ${{ parameters.enableNetworkPolicies if parameters.enableNetworkPolicies is defined else true }}
          enableOPA: ${{ parameters.enableOPA if parameters.enableOPA is defined else false }}
          enableVaultIntegration: ${{ parameters.enableVaultIntegration if parameters.enableVaultIntegration is defined else false }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          # Commit of github.com/ayoinc/cloud-sandbox-backstage the Terraform modules are taken from
          moduleRef: 83f9ff7222d2731d5cc0da4ab1fc1f7c46da3693

    - id: fetch-cluster
      name: Fetch Cluster for the Chosen Cloud
      action: fetch:template
      input:
        url: ./skeleton/${{ parameters.cloudProvider }}
        values: *values

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        repoUrl: ${{ parameters.repoUrl }}
        description: Kubernetes Platform Infrastructure for ${{ parameters.projectName }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
