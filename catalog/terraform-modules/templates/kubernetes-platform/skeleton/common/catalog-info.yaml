apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.destination.repo }}
  description: Kubernetes platform for ${{ values.projectName }} on ${{ values.cloudProvider }} (${{ values.environment }})
  annotations:
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - terraform
    - kubernetes
    - ${{ values.cloudProvider }}
    - platform
  links:
    - url: https://github.com/${{ values.destination.owner }}/${{ values.destination.repo }}/actions/workflows/terraform.yml
      title: Terraform pipeline
      icon: dashboard
spec:
  type: infrastructure
  lifecycle: ${{ 'production' if values.environment == 'production' else 'experimental' }}
  owner: ${{ values.owner | dump }}
