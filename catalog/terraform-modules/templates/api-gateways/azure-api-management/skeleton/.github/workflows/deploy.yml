name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'
  # Terraform signs in with the same federated identity as azure/login.
  ARM_USE_OIDC: 'true'
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  credentials:
    name: Deployment credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check that an Azure identity and a state storage account are configured
        id: check
        env:
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          if [ -n "$ARM_CLIENT_ID" ] && [ -n "$ARM_TENANT_ID" ] && [ -n "$ARM_SUBSCRIPTION_ID" ] && [ -n "$TF_STATE_STORAGE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Plan and apply are skipped until AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and TF_STATE_STORAGE_ACCOUNT are configured."
          fi

  plan:
    name: Plan
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Initialise
        run: >
          terraform init
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER || 'tfstate' }}"
          -backend-config="key=${{ github.event.repository.name }}/terraform.tfstate"
          -backend-config="use_azuread_auth=true"

      # The plan is shown in the log only. A saved plan file would contain the
      # secrets held in the state, so none is uploaded.
      - name: Plan
        run: terraform plan

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # Creating an API Management instance takes 30 to 60 minutes.
    timeout-minutes: 180
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Initialise
        run: >
          terraform init
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER || 'tfstate' }}"
          -backend-config="key=${{ github.event.repository.name }}/terraform.tfstate"
          -backend-config="use_azuread_auth=true"

      - name: Apply
        run: terraform apply -auto-approve
