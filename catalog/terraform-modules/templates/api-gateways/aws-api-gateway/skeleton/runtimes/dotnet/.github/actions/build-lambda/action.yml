name: Build Lambda package
description: Runs the unit tests of the function and writes build/lambda.zip

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Run unit tests
      shell: bash
      run: dotnet test Api.slnx --configuration Release

    - name: Check formatting
      shell: bash
      run: dotnet format Api.slnx --verify-no-changes --no-restore

    - name: Package the function
      shell: bash
      run: bash scripts/package.sh
