name: Terraform

# Validation, tests against mocked providers, linting and the security scan run
# on every push and pull request and need no cloud account.
#
# Plan and apply run once the repository can reach Azure:
#   secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#             identity with a federated credential for this repository (GitHub OIDC)
#   variables TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT
#             storage account that holds the Terraform state in its container "tfstate"
# The cost estimate runs once the secret INFRACOST_API_KEY is set.
# Until then those jobs are skipped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the changes to Azure after planning
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARM_USE_OIDC: 'true'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TERRAFORM_VERSION: '1.17.1'
  TFLINT_VERSION: v0.66.0
  TRIVY_VERSION: v0.76.2
{% raw %}
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialise without the state backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Test against mocked providers
        run: terraform test

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --format compact

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan the Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Use the checks built into this Trivy version, so a finding is always a change in this repository.
          TRIVY_SKIP_CHECK_UPDATE: 'true'
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          tf-vars: terraform.tfvars
          severity: HIGH,CRITICAL
          exit-code: '1'

  credentials:
    name: Check credentials
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.check.outputs.cloud }}
      infracost: ${{ steps.check.outputs.infracost }}
    steps:
      - name: See which credentials are configured
        id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ] &&
            [ -n "$TF_STATE_RESOURCE_GROUP" ] && [ -n "$TF_STATE_STORAGE_ACCOUNT" ]; then
            echo "cloud=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloud=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Plan and apply are skipped: set the secrets AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID and the variables TF_STATE_RESOURCE_GROUP and TF_STATE_STORAGE_ACCOUNT to enable them."
          fi
          if [ -n "$INFRACOST_API_KEY" ]; then
            echo "infracost=true" >> "$GITHUB_OUTPUT"
          else
            echo "infracost=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: Plan
    needs: [validate, security, credentials]
    if: needs.credentials.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialise
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - name: Plan
        run: terraform plan

  cost:
    name: Cost estimate
    needs: [validate, credentials]
    if: needs.credentials.outputs.infracost == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: infracost/actions/scan@v5
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          path: .

  apply:
    name: Apply
    needs: [plan]
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialise
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - name: Apply
        run: terraform apply -auto-approve
{% endraw %}