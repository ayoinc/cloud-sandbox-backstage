apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.destination.repo }}
  description: AWS data platform for ${{ values.projectName }} (${{ values.environment }})
  annotations:
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - terraform
    - aws
    - data-platform
  links:
    - url: https://${{ values.awsRegion }}.console.aws.amazon.com/s3/buckets?region=${{ values.awsRegion }}
      title: S3 buckets in the AWS console
      icon: dashboard
spec:
  type: infrastructure
  lifecycle: ${{ 'production' if values.environment == 'production' else 'experimental' }}
  owner: ${{ values.owner | dump }}
