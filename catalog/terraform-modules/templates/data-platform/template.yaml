apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: data-platform
  title: Multi-Cloud Data Platform
  description: Production-ready data platform with data lake, warehouse, and ETL/ELT pipelines on AWS, Azure, or GCP
  tags:
    - data
    - analytics
    - multi-cloud
    - data-lake
    - terraform
    - recommended
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Project Configuration
      required:
        - projectName
        - environment
        - owner
        - cloudProvider
      properties:
        projectName:
          title: Project Name
          type: string
          description: Name for the data platform, used as a prefix for resource names (lowercase letters, digits and hyphens, at most 16 characters)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 16
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: Team or user that owns this infrastructure
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User
        environment:
          title: Environment
          type: string
          enum:
            - dev
            - staging
            - production
          default: dev
        cloudProvider:
          title: Cloud Provider
          type: string
          enum:
            - aws
            - azure
            - gcp
          enumNames:
            - Amazon Web Services
            - Microsoft Azure
            - Google Cloud Platform
          default: aws
      dependencies:
        cloudProvider:
          oneOf:
            - properties:
                cloudProvider:
                  enum:
                    - aws
                awsRegion:
                  title: AWS Region
                  type: string
                  enum:
                    - us-east-1
                    - us-west-2
                    - eu-west-1
                    - eu-central-1
                  default: us-east-1
            - properties:
                cloudProvider:
                  enum:
                    - azure
                azureRegion:
                  title: Azure Region
                  type: string
                  enum:
                    - eastus
                    - westus2
                    - westeurope
                    - northeurope
                  default: eastus
                azureSubscriptionId:
                  title: Azure Subscription ID
                  type: string
                  description: Subscription the resources are created in. Leave empty to use the subscription of the pipeline's credentials.
                  pattern: '^([0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12})?$'
            - required:
                - gcpProjectId
              properties:
                cloudProvider:
                  enum:
                    - gcp
                gcpRegion:
                  title: GCP Region
                  type: string
                  enum:
                    - us-central1
                    - us-east1
                    - europe-west1
                    - europe-west2
                  default: us-central1
                gcpProjectId:
                  title: GCP Project ID
                  type: string
                  description: ID of the Google Cloud project the resources are created in
                  pattern: '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'

    - title: Data Lake Configuration
      properties:
        enableDataLake:
          title: Enable Data Lake
          type: boolean
          default: true
          description: Object storage for raw, processed and curated data (S3 / ADLS Gen2 / Cloud Storage)
        dataLakeStorageClass:
          title: Storage Class
          type: string
          enum:
            - standard
            - infrequent
            - archive
          default: standard
          description: Standard keeps data in the hot tier; infrequent and archive move older raw and processed data to cheaper tiers
        enableDataCatalog:
          title: Enable Data Catalog
          type: boolean
          default: true
          description: AWS Glue Data Catalog / Microsoft Purview / Dataplex

    - title: Data Warehouse Configuration
      properties:
        enableDataWarehouse:
          title: Enable Data Warehouse
          type: boolean
          default: true
          description: Redshift / Synapse dedicated SQL pool / BigQuery
        warehouseSize:
          title: Warehouse Size
          type: string
          enum:
            - small
            - medium
            - large
          enumNames:
            - Small
            - Medium
            - Large
          default: small
          description: 'AWS: 2, 4 or 8 Redshift nodes. Azure: DW100c, DW500c or DW1000c. GCP: up to 100, 200 or 400 BigQuery slots.'

    - title: ETL/ELT Configuration
      properties:
        enableEtlPipelines:
          title: Enable ETL/ELT Pipelines
          type: boolean
          default: true
        etlEngine:
          title: ETL Engine
          type: string
          enum:
            - spark
            - native
          enumNames:
            - Apache Spark (EMR Serverless / Databricks / Dataproc)
            - Native (Glue / Data Factory / Dataflow)
          default: native
        enableOrchestration:
          title: Enable Workflow Orchestration
          type: boolean
          default: true
          description: Step Functions / Data Factory / Cloud Composer (Airflow)

    - title: Streaming Configuration
      properties:
        enableStreaming:
          title: Enable Streaming
          type: boolean
          default: false
          description: Kinesis / Event Hubs / Pub/Sub
        streamingRetention:
          title: Streaming Retention (hours)
          type: integer
          minimum: 24
          maximum: 168
          default: 24
          description: How long the stream keeps records, between 24 and 168 hours (the range every cloud supports)

    - title: Analytics & BI
      properties:
        enableBiTools:
          title: Enable BI Integration
          type: boolean
          default: false
          description: Access for a BI tool. AWS gets an Athena workgroup and a role for QuickSight, Azure opens the Synapse SQL endpoint to Power BI, GCP gets BigQuery BI Engine and a read-only service account for Looker
        enableMlPlatform:
          title: Enable ML Platform
          type: boolean
          default: false
          description: SageMaker domain / Azure Machine Learning workspace / Vertex AI Workbench

    - title: Security & Governance
      properties:
        enableEncryption:
          title: Enable Encryption at Rest
          type: boolean
          default: true
          description: Customer-managed keys (KMS / Key Vault / Cloud KMS) instead of provider-managed encryption
        enableDataLineage:
          title: Enable Data Lineage
          type: boolean
          default: true
          description: OpenLineage into Amazon DataZone / Purview lineage from Data Factory and Synapse / Data Lineage API
        enableAccessControl:
          title: Enable Fine-Grained Access Control
          type: boolean
          default: true
          description: Lake Formation permissions / Entra ID-only access with per-zone roles / per-bucket and per-dataset IAM with policy tags

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton/${{ parameters.cloudProvider }}
        values:
          projectName: ${{ parameters.projectName }}
          environment: ${{ parameters.environment }}
          cloudProvider: ${{ parameters.cloudProvider }}
          awsRegion: ${{ parameters.awsRegion or 'us-east-1' }}
          azureRegion: ${{ parameters.azureRegion or 'eastus' }}
          azureSubscriptionId: ${{ parameters.azureSubscriptionId }}
          gcpRegion: ${{ parameters.gcpRegion or 'us-central1' }}
          gcpProjectId: ${{ parameters.gcpProjectId }}
          enableDataLake: ${{ parameters.enableDataLake if parameters.enableDataLake is defined else true }}
          dataLakeStorageClass: ${{ parameters.dataLakeStorageClass or 'standard' }}
          enableDataCatalog: ${{ parameters.enableDataCatalog if parameters.enableDataCatalog is defined else true }}
          enableDataWarehouse: ${{ parameters.enableDataWarehouse if parameters.enableDataWarehouse is defined else true }}
          warehouseSize: ${{ parameters.warehouseSize or 'small' }}
          enableEtlPipelines: ${{ parameters.enableEtlPipelines if parameters.enableEtlPipelines is defined else true }}
          etlEngine: ${{ parameters.etlEngine or 'native' }}
          enableOrchestration: ${{ parameters.enableOrchestration if parameters.enableOrchestration is defined else true }}
          enableStreaming: ${{ parameters.enableStreaming if parameters.enableStreaming is defined else false }}
          streamingRetention: ${{ parameters.streamingRetention or 24 }}
          enableBiTools: ${{ parameters.enableBiTools if parameters.enableBiTools is defined else false }}
          enableMlPlatform: ${{ parameters.enableMlPlatform if parameters.enableMlPlatform is defined else false }}
          enableEncryption: ${{ parameters.enableEncryption if parameters.enableEncryption is defined else true }}
          enableDataLineage: ${{ parameters.enableDataLineage if parameters.enableDataLineage is defined else true }}
          enableAccessControl: ${{ parameters.enableAccessControl if parameters.enableAccessControl is defined else true }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          # Commit of github.com/ayoinc/cloud-sandbox-backstage the Terraform modules are taken from
          moduleRef: 83f9ff7222d2731d5cc0da4ab1fc1f7c46da3693

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        repoUrl: ${{ parameters.repoUrl }}
        description: Data Platform Infrastructure for ${{ parameters.projectName }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
