apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.destination.repo }}
  description: Azure three-tier infrastructure for ${{ values.projectName }} (${{ values.environment }})
  annotations:
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - terraform
    - azure
    - three-tier
  links:
    - url: https://portal.azure.com/#browse/Microsoft.Network%2FapplicationGateways
      title: Application gateways in the Azure portal
      icon: dashboard
spec:
  type: infrastructure
  lifecycle: ${{ 'production' if values.environment == 'production' else 'experimental' }}
  owner: ${{ values.owner | dump }}
