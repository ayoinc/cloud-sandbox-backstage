apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.destination.repo }}
  description: AWS three-tier infrastructure for ${{ values.projectName }} (${{ values.environment }})
  annotations:
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - terraform
    - aws
    - three-tier
  links:
    - url: https://${{ values.region }}.console.aws.amazon.com/ec2/home?region=${{ values.region }}#LoadBalancers
      title: Load balancers in the AWS console
      icon: dashboard
spec:
  type: infrastructure
  lifecycle: ${{ 'production' if values.environment == 'production' else 'experimental' }}
  owner: ${{ values.owner | dump }}
