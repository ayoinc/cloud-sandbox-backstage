apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-three-tier-webapp
  title: AWS 3-Tier Web Application
  description: Production-ready 3-tier architecture with ALB, ECS/EC2, and RDS on AWS
  tags:
    - aws
    - three-tier
    - web-app
    - production-ready
    - terraform
    - recommended
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Project Configuration
      required:
        - projectName
        - environment
        - owner
      properties:
        projectName:
          title: Project Name
          type: string
          description: Name for the project, used as a prefix for resource names (lowercase letters, digits and hyphens, at most 16 characters)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 16
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: Team or user that owns this infrastructure
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User
        environment:
          title: Environment
          type: string
          enum:
            - dev
            - staging
            - production
          default: dev
        region:
          title: AWS Region
          type: string
          enum:
            - us-east-1
            - us-west-2
            - eu-west-1
            - eu-central-1
            - ap-southeast-1
          default: us-east-1

    - title: Network Configuration
      properties:
        vpcCidr:
          title: VPC CIDR Block
          type: string
          default: '10.0.0.0/16'
          pattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|20)$'
          description: CIDR block for the VPC, between /16 and /20

    - title: Compute Configuration
      required:
        - computeType
      properties:
        computeType:
          title: Compute Type
          type: string
          enum:
            - ecs-fargate
            - ecs-ec2
            - ec2-asg
          enumNames:
            - ECS with Fargate (Serverless)
            - ECS with EC2
            - EC2 Auto Scaling Group
          default: ecs-fargate
        instanceType:
          title: Instance Type
          type: string
          default: t3.medium
          pattern: '^[a-z][a-z0-9-]*\.[a-z0-9]+$'
          description: EC2 instance type (for ECS-EC2 or ASG)
        minCapacity:
          title: Minimum Capacity
          type: integer
          minimum: 1
          maximum: 100
          default: 2
        maxCapacity:
          title: Maximum Capacity
          type: integer
          minimum: 1
          maximum: 100
          default: 10

    - title: Database Configuration
      required:
        - databaseEngine
      properties:
        databaseEngine:
          title: Database Engine
          type: string
          enum:
            - postgres
            - mysql
            - mariadb
          default: postgres
        databaseInstanceClass:
          title: Database Instance Class
          type: string
          default: db.t3.medium
          pattern: '^db\.[a-z0-9-]+\.[a-z0-9]+$'
        multiAz:
          title: Enable Multi-AZ
          type: boolean
          default: true

    - title: Security & CDN
      properties:
        enableWaf:
          title: Enable WAF
          type: boolean
          default: true
          description: Enable AWS WAF for web application firewall
        enableCloudfront:
          title: Enable CloudFront
          type: boolean
          default: false
          description: Enable CloudFront CDN for global distribution

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          projectName: ${{ parameters.projectName }}
          environment: ${{ parameters.environment }}
          region: ${{ parameters.region or 'us-east-1' }}
          vpcCidr: ${{ parameters.vpcCidr or '10.0.0.0/16' }}
          computeType: ${{ parameters.computeType or 'ecs-fargate' }}
          instanceType: ${{ parameters.instanceType or 't3.medium' }}
          minCapacity: ${{ parameters.minCapacity or 2 }}
          maxCapacity: ${{ parameters.maxCapacity or 10 }}
          databaseEngine: ${{ parameters.databaseEngine or 'postgres' }}
          databaseInstanceClass: ${{ parameters.databaseInstanceClass or 'db.t3.medium' }}
          multiAz: ${{ parameters.multiAz if parameters.multiAz is defined else true }}
          enableWaf: ${{ parameters.enableWaf if parameters.enableWaf is defined else true }}
          enableCloudfront: ${{ parameters.enableCloudfront if parameters.enableCloudfront is defined else false }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          # Commit of github.com/ayoinc/cloud-sandbox-backstage the Terraform modules are taken from
          moduleRef: 83f9ff7222d2731d5cc0da4ab1fc1f7c46da3693

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        repoUrl: ${{ parameters.repoUrl }}
        description: AWS 3-Tier Infrastructure for ${{ parameters.projectName }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
