apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: gcp-three-tier-webapp
  title: GCP 3-Tier Web Application
  description: Production-ready 3-tier architecture with Cloud Load Balancer, GKE/MIG, and Cloud SQL on GCP
  tags:
    - gcp
    - three-tier
    - web-app
    - production-ready
    - terraform
    - recommended
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Project Configuration
      required:
        - projectName
        - environment
        - owner
        - gcpProjectId
      properties:
        projectName:
          title: Project Name
          type: string
          description: Name for the project, used as a prefix for resource names (lowercase letters, digits and hyphens, at most 16 characters)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          maxLength: 16
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: Team or user that owns this infrastructure
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User
        environment:
          title: Environment
          type: string
          enum:
            - dev
            - staging
            - production
          default: dev
        gcpProjectId:
          title: GCP Project ID
          type: string
          description: ID of the existing Google Cloud project the infrastructure is created in
          pattern: '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
        region:
          title: GCP Region
          type: string
          enum:
            - us-central1
            - us-east1
            - us-west1
            - europe-west1
            - europe-west2
            - asia-east1
            - asia-southeast1
          default: us-central1

    - title: Network Configuration
      properties:
        vpcCidr:
          title: VPC CIDR Block
          type: string
          default: '10.0.0.0/16'
          description: Address range the subnet, the GKE pod and service ranges and the database peering range are carved from (prefix length 16 to 20)
          pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(1[6-9]|20)$'

    - title: Compute Configuration
      required:
        - computeType
      properties:
        computeType:
          title: Compute Type
          type: string
          enum:
            - gke-autopilot
            - gke-standard
            - mig
          enumNames:
            - GKE Autopilot (Serverless)
            - GKE Standard
            - Managed Instance Group
          default: gke-autopilot
      dependencies:
        computeType:
          oneOf:
            - properties:
                computeType:
                  enum:
                    - gke-autopilot
            - properties:
                computeType:
                  enum:
                    - gke-standard
                    - mig
                machineType:
                  title: Machine Type
                  type: string
                  default: e2-medium
                  description: Compute Engine machine type of the GKE nodes or the instances
                  pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)+$'
                minNodes:
                  title: Minimum Nodes
                  type: integer
                  default: 2
                  minimum: 1
                  maximum: 100
                  description: Lower bound of the autoscaler (GKE nodes or instances)
                maxNodes:
                  title: Maximum Nodes
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 100
                  description: Upper bound of the autoscaler (GKE nodes or instances)

    - title: Database Configuration
      required:
        - databaseEngine
      properties:
        databaseEngine:
          title: Database Engine
          type: string
          enum:
            - POSTGRES
            - MYSQL
          enumNames:
            - PostgreSQL
            - MySQL
          default: POSTGRES
        databaseTier:
          title: Database Tier
          type: string
          default: db-custom-2-4096
          description: Cloud SQL machine tier
          pattern: '^db-[a-z0-9]+(-[a-z0-9]+)*$'
        highAvailability:
          title: Enable High Availability
          type: boolean
          default: true

    - title: Security & CDN
      properties:
        enableCloudArmor:
          title: Enable Cloud Armor
          type: boolean
          default: true
          description: Enable Cloud Armor WAF for DDoS protection
        enableCloudCdn:
          title: Enable Cloud CDN
          type: boolean
          default: false
          description: Enable Cloud CDN for global content delivery

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          projectName: ${{ parameters.projectName }}
          environment: ${{ parameters.environment }}
          gcpProjectId: ${{ parameters.gcpProjectId }}
          region: ${{ parameters.region or 'us-central1' }}
          vpcCidr: ${{ parameters.vpcCidr or '10.0.0.0/16' }}
          computeType: ${{ parameters.computeType }}
          machineType: ${{ parameters.machineType or 'e2-medium' }}
          minNodes: ${{ parameters.minNodes or 2 }}
          maxNodes: ${{ parameters.maxNodes or 10 }}
          databaseEngine: ${{ parameters.databaseEngine }}
          databaseTier: ${{ parameters.databaseTier or 'db-custom-2-4096' }}
          highAvailability: ${{ parameters.highAvailability if parameters.highAvailability is defined else true }}
          enableCloudArmor: ${{ parameters.enableCloudArmor if parameters.enableCloudArmor is defined else true }}
          enableCloudCdn: ${{ parameters.enableCloudCdn if parameters.enableCloudCdn is defined else false }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          # Commit of github.com/ayoinc/cloud-sandbox-backstage the Terraform modules are taken from
          moduleRef: 83f9ff7222d2731d5cc0da4ab1fc1f7c46da3693

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        repoUrl: ${{ parameters.repoUrl }}
        description: GCP 3-Tier Infrastructure for ${{ parameters.projectName }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
