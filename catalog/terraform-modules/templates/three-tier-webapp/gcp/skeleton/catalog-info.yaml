apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.destination.repo }}
  description: GCP three-tier infrastructure for ${{ values.projectName }} (${{ values.environment }})
  annotations:
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - terraform
    - gcp
    - three-tier
  links:
    - url: https://console.cloud.google.com/net-services/loadbalancing/list/loadBalancers?project=${{ values.gcpProjectId }}
      title: Load balancers in the Google Cloud console
      icon: dashboard
spec:
  type: infrastructure
  lifecycle: ${{ 'production' if values.environment == 'production' else 'experimental' }}
  owner: ${{ values.owner | dump }}
