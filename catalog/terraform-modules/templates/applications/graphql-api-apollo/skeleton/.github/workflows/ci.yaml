name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-{% raw %}${{ github.ref }}{% endraw %}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
{% if values.databaseType != 'sqlite' or values.enableCache %}
    services:
{% if values.databaseType == 'postgresql' %}
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username app --dbname app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
{% elif values.databaseType == 'mysql' %}
      db:
        image: mysql:8.4
        env:
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_DATABASE: app
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host 127.0.0.1 --user app --password=app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
{% endif %}
{% if values.enableCache %}
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
{% endif %}
    env:
{% if values.databaseType == 'postgresql' %}
      DATABASE_URL: postgres://app:app@localhost:5432/app
{% elif values.databaseType == 'mysql' %}
      DATABASE_URL: mysql://app:app@localhost:3306/app
{% endif %}
{% if values.enableCache %}
      REDIS_URL: redis://localhost:6379
{% endif %}
{% endif %}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the generated types match the schema
        run: |
          npm run codegen
          git diff --exit-code -- src/generated

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the API with its dependencies
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Query the running API
        run: |
          curl --fail --silent --show-error http://localhost:4000/graphql \
            --header 'content-type: application/json' \
            --data '{"query":"{ products { id } }"}' | tee response.json
          grep --quiet '"products":\[\]' response.json

      - name: Show the container logs
        if: failure()
        run: docker compose logs

      - name: Stop the containers
        if: always()
        run: docker compose down --volumes
{% if values.enableSchemaRegistry %}

  # The schema registry needs an Apollo GraphOS graph. Without the secret
  # APOLLO_KEY and the variable APOLLO_GRAPH_REF, the next job is skipped.
  schema-registry-config:
    name: Look for schema registry credentials
    runs-on: ubuntu-latest
    outputs:
      configured: {% raw %}${{ steps.check.outputs.configured }}{% endraw %}
    steps:
      - name: Check for APOLLO_KEY and APOLLO_GRAPH_REF
        id: check
        env:
          APOLLO_KEY: {% raw %}${{ secrets.APOLLO_KEY }}{% endraw %}
          APOLLO_GRAPH_REF: {% raw %}${{ vars.APOLLO_GRAPH_REF }}{% endraw %}
        run: |
          if [ -n "$APOLLO_KEY" ] && [ -n "$APOLLO_GRAPH_REF" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Schema registry skipped: set the secret APOLLO_KEY and the variable APOLLO_GRAPH_REF to turn it on."
          fi

  schema-registry:
    name: Schema registry
    runs-on: ubuntu-latest
    needs: [test, schema-registry-config]
    if: needs.schema-registry-config.outputs.configured == 'true'
    env:
      APOLLO_KEY: {% raw %}${{ secrets.APOLLO_KEY }}{% endraw %}
      APOLLO_GRAPH_REF: {% raw %}${{ vars.APOLLO_GRAPH_REF }}{% endraw %}
      APOLLO_ELV2_LICENSE: accept
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rover
        run: |
          curl --fail --silent --show-error --location https://rover.apollo.dev/nix/v1.0.1 | sh
          echo "$HOME/.rover/bin" >> "$GITHUB_PATH"

      - name: Check the schema against the registry
        if: github.event_name == 'pull_request'
        run: npm run --silent schema:print | rover graph check "$APOLLO_GRAPH_REF" --schema -

      - name: Publish the schema
        if: github.event_name == 'push'
        run: npm run --silent schema:print | rover graph publish "$APOLLO_GRAPH_REF" --schema -
{% endif %}
