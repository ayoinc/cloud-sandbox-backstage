apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: graphql-api-apollo
  title: GraphQL API (Apollo Server)
  description: Create a GraphQL API with Apollo Server and TypeScript, with a database, authentication, subscriptions, caching, monitoring and a pipeline that tests it
  tags:
    - graphql
    - apollo
    - api
    - nodejs
    - typescript
    - subscriptions
spec:
  owner: platform-team
  type: api

  parameters:
    - title: API Information
      required:
        - apiName
        - description
        - owner
      properties:
        apiName:
          title: API Name
          type: string
          description: Name of the GraphQL API in lowercase with hyphens (e.g., product-catalog-api)
          pattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 50
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Description of the GraphQL API
        apiVersion:
          title: API Version
          type: string
          description: API version (semver)
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          default: '1.0.0'
        owner:
          title: Owner
          type: string
          description: Owner of the API
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User

    - title: Database & Data
      properties:
        databaseType:
          title: Database Type
          type: string
          description: Database the API stores its data in
          default: postgresql
          enum:
            - postgresql
            - mysql
            - sqlite
          enumNames:
            - PostgreSQL
            - MySQL
            - SQLite
        enableCache:
          title: Enable Redis Cache
          type: boolean
          description: Cache query responses, in Redis when one is configured
          default: true

    - title: GraphQL Features
      properties:
        enableSubscriptions:
          title: Enable Subscriptions
          type: boolean
          description: Enable real-time subscriptions with WebSockets
          default: true
        queryComplexity:
          title: Query Complexity Limit
          type: integer
          description: Maximum query complexity score
          minimum: 1
          default: 1000

    - title: Authentication & Authorization
      properties:
        enableAuth:
          title: Enable Authentication
          type: boolean
          description: Require a token for mutations
          default: true
        authProvider:
          title: Auth Provider
          type: string
          description: How tokens are verified
          default: jwt
          enum:
            - jwt
            - oauth2
          enumNames:
            - JWT signed with a shared secret
            - OAuth 2.0 identity provider (JWKS)
        enableRBAC:
          title: Enable RBAC
          type: boolean
          description: Require the admin role for mutations (role-based access control)
          default: true

    - title: Monitoring & Tracing
      properties:
        enableMetrics:
          title: Enable Metrics
          type: boolean
          description: Serve Prometheus metrics of the GraphQL requests
          default: true
        enableTracing:
          title: Enable Tracing
          type: boolean
          description: Enable distributed tracing (OpenTelemetry)
          default: true

    - title: Development Tools
      properties:
        enablePlayground:
          title: Enable GraphQL Playground
          type: boolean
          description: Serve Apollo Sandbox on the API for trying out queries
          default: true
        enableSchemaRegistry:
          title: Enable Schema Registry
          type: boolean
          description: Add a pipeline job that checks and publishes the schema to the Apollo GraphOS schema registry once its credentials are configured
          default: true

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Fetch API Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/release.yaml
        trimBlocks: true
        lstripBlocks: true
        values:
          apiName: ${{ parameters.apiName }}
          description: ${{ parameters.description }}
          apiVersion: ${{ parameters.apiVersion }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          databaseType: ${{ parameters.databaseType }}
          enableCache: ${{ parameters.enableCache }}
          enableSubscriptions: ${{ parameters.enableSubscriptions }}
          queryComplexity: ${{ parameters.queryComplexity }}
          enableAuth: ${{ parameters.enableAuth }}
          authProvider: ${{ parameters.authProvider }}
          enableRBAC: ${{ parameters.enableRBAC }}
          enableMetrics: ${{ parameters.enableMetrics }}
          enableTracing: ${{ parameters.enableTracing }}
          enablePlayground: ${{ parameters.enablePlayground }}
          enableSchemaRegistry: ${{ parameters.enableSchemaRegistry }}

    - id: lockfile
      name: Select Lockfile for the Database Driver
      action: fs:rename
      input:
        files:
          - from: locks/package-lock.${{ parameters.databaseType }}.json
            to: package-lock.json

    - id: remove-lockfiles
      name: Remove Unused Lockfiles
      action: fs:delete
      input:
        files:
          - locks

    - id: publish
      name: Publish to Repository
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: 'feat: initial commit - GraphQL API'

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: CI Pipeline
        icon: github
        url: https://${{ (parameters.repoUrl | parseRepoUrl).host }}/${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}/actions
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
