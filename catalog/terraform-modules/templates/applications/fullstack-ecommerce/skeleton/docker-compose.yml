# The whole store on one machine, for local runs and the pipeline's smoke test:
#   docker compose up --build
# The storefront is then on http://localhost:3000.
services:
  frontend:
    build: ./frontend
    ports:
      - '3000:8080'
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: postgres://store:store@db:5432/store
{% if values.enableCaching %}
      REDIS_URL: redis://redis:6379
{% endif %}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
      SEED_SAMPLE_DATA: 'true'
    depends_on:
      db:
        condition: service_healthy
{% if values.enableCaching %}
      redis:
        condition: service_healthy
{% endif %}
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:8080/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - '5432:5432'
    healthcheck:
      test: [CMD-SHELL, pg_isready --username store --dbname store]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - data:/var/lib/postgresql/data
{% if values.enableCaching %}

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
{% endif %}

volumes:
  data:
