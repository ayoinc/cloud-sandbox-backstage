name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-{% raw %}${{ github.ref }}{% endraw %}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username store --dbname store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
{% if values.enableCaching %}
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
{% endif %}
    env:
      DATABASE_URL: postgres://store:store@localhost:5432/store
{% if values.enableCaching %}
      REDIS_URL: redis://localhost:6379
{% endif %}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Check the formatting
        run: terraform fmt -check -recursive -diff

      - name: Download the providers
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0

      - name: Lint
        run: tflint

  store:
    name: Build the images and smoke-test the store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the store
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Browse the catalogue and place an order
        run: bash scripts/smoke-test.sh

      - name: Show the container logs
        if: failure()
        run: docker compose logs

      - name: Stop the store
        if: always()
        run: docker compose down --volumes
