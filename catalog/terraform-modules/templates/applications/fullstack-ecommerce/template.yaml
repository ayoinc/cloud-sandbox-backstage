apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: fullstack-ecommerce
  title: Full-Stack E-Commerce Platform
  description: Create an online store with a React storefront, a Node.js API, a PostgreSQL database, cloud infrastructure in Terraform and a pipeline that tests all of it
  tags:
    - recommended
    - fullstack
    - ecommerce
    - react
    - nodejs
    - terraform
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Project Information
      required:
        - projectName
        - environment
        - businessUnit
        - description
        - owner
      properties:
        projectName:
          title: Project Name
          type: string
          description: Name of the e-commerce project in lowercase with hyphens (e.g., acme-store)
          pattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 24
          ui:autofocus: true
        environment:
          title: Environment
          type: string
          description: Environment the infrastructure code is set up for
          enum:
            - dev
            - stg
            - prod
          enumNames:
            - Development
            - Staging
            - Production
        businessUnit:
          title: Business Unit
          type: string
          enum:
            - engineering
            - platform
            - ecommerce
            - retail
          enumNames:
            - Engineering
            - Platform Engineering
            - E-Commerce Team
            - Retail Operations
        description:
          title: Description
          type: string
          description: Description of the e-commerce platform
        owner:
          title: Owner
          type: string
          description: Owner of the store
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User

    - title: Cloud Provider & Region
      required:
        - provider
      properties:
        provider:
          title: Cloud Provider
          type: string
          description: Cloud provider the infrastructure code is written for
          enum:
            - azure
            - aws
            - gcp
          enumNames:
            - Microsoft Azure
            - Amazon Web Services
            - Google Cloud Platform
      dependencies:
        provider:
          oneOf:
            - required:
                - region
              properties:
                provider:
                  enum:
                    - azure
                region:
                  title: Primary Region
                  type: string
                  description: Azure region to deploy to
                  default: eastus
                  enum:
                    - eastus
                    - eastus2
                    - westus2
                    - westeurope
                    - northeurope
                    - uksouth
                    - southeastasia
                    - australiaeast
            - required:
                - region
              properties:
                provider:
                  enum:
                    - aws
                region:
                  title: Primary Region
                  type: string
                  description: AWS region to deploy to
                  default: us-east-1
                  enum:
                    - us-east-1
                    - us-east-2
                    - us-west-2
                    - eu-west-1
                    - eu-west-2
                    - eu-central-1
                    - ap-southeast-1
                    - ap-southeast-2
            - required:
                - region
              properties:
                provider:
                  enum:
                    - gcp
                region:
                  title: Primary Region
                  type: string
                  description: Google Cloud region to deploy to
                  default: us-central1
                  enum:
                    - us-central1
                    - us-east1
                    - us-west1
                    - europe-west1
                    - europe-west2
                    - europe-west3
                    - asia-southeast1
                    - australia-southeast1

    - title: Platform Features
      properties:
        enableCMS:
          title: Product Management
          type: boolean
          description: Include the admin API and admin page for managing products
          default: true
        enablePayments:
          title: Payment Step
          type: boolean
          description: Include a payment step at checkout with a pluggable payment provider (a sandbox provider is included)
          default: true
        enableSearch:
          title: Search
          type: boolean
          description: Include product search in the catalogue
          default: true
        enableReviews:
          title: Product Reviews
          type: boolean
          description: Include customer reviews and ratings
          default: true
        enableInventory:
          title: Inventory Management
          type: boolean
          description: Include stock levels that orders reduce and cannot exceed
          default: true
        enableAnalytics:
          title: Analytics Dashboard
          type: boolean
          description: Include sales figures on the admin page
          default: true

    - title: Scalability & Performance
      properties:
        enableCDN:
          title: CDN for the Storefront
          type: boolean
          description: Put a content delivery network in front of the storefront
          default: true
        enableCaching:
          title: Redis Cache
          type: boolean
          description: Cache catalogue reads in Redis
          default: true
        autoScaling:
          title: Auto-Scaling
          type: boolean
          description: Scale the storefront and the API with the load
          default: true

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Fetch Store Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/release.yaml
        trimBlocks: true
        lstripBlocks: true
        values:
          projectName: ${{ parameters.projectName }}
          appTitle: ${{ parameters.projectName | replace('-', ' ') | title }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          environment: ${{ parameters.environment }}
          businessUnit: ${{ parameters.businessUnit }}
          provider: ${{ parameters.provider }}
          region: ${{ parameters.region }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          enableCMS: ${{ parameters.enableCMS }}
          enablePayments: ${{ parameters.enablePayments }}
          enableSearch: ${{ parameters.enableSearch }}
          enableReviews: ${{ parameters.enableReviews }}
          enableInventory: ${{ parameters.enableInventory }}
          enableAnalytics: ${{ parameters.enableAnalytics }}
          enableCDN: ${{ parameters.enableCDN }}
          enableCaching: ${{ parameters.enableCaching }}
          autoScaling: ${{ parameters.autoScaling }}

    - id: select-infra
      name: Select Infrastructure for the Cloud Provider
      action: fs:rename
      input:
        files:
          - from: infra-${{ parameters.provider }}
            to: infra

    - id: remove-other-infra
      name: Remove Infrastructure of Other Providers
      action: fs:delete
      input:
        files:
          - infra-*

    - id: publish
      name: Publish to Repository
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: 'feat: initial commit - e-commerce platform'

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    - id: next-steps
      name: Next Steps
      action: debug:log
      input:
        message: |
          The store was created and its pipeline is running.

          Run it locally: docker compose up --build, then open http://localhost:3000
          Deploy it: see docs/operations.md
            cd infra && terraform init
            terraform apply -var-file=environments/${{ parameters.environment }}.tfvars

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: CI Pipeline
        icon: github
        url: https://${{ (parameters.repoUrl | parseRepoUrl).host }}/${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}/actions
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
