# Production override: restart always, resource limits, larger log retention and
# only nginx exposed on the host.
#
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --wait

services:
  nginx:
    restart: always

  backstage:
    restart: always
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  postgres:
    restart: always
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  redis:
    restart: always
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  minio:
    restart: always
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
