kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters: []

permission:
  enabled: true

# https://backstage.io/docs/ai/mcp-actions
mcpActions:
  name: 'Developer Portal'
  description: 'Tools for managing the software catalog, creating services from templates, and exploring the developer portal'

# =============================================================================
# PLACEHOLDER: Enterprise Plugin Configuration
# =============================================================================
# Uncomment and configure these sections when ready to enable the plugins
# Ensure corresponding environment variables are set in .env
# =============================================================================

# -----------------------------------------------------------------------------
# ArgoCD - GitOps Continuous Delivery
# -----------------------------------------------------------------------------
# Requires frontend: @roadiehq/backstage-plugin-argo-cd
# Requires backend: @roadiehq/scaffolder-backend-argocd
# argocd:
#   baseUrl: ${ARGOCD_BASE_URL}
#   username: ${ARGOCD_USERNAME}
#   password: ${ARGOCD_PASSWORD}
#   # Optional: for multiple ArgoCD instances
#   # appLocatorMethods:
#   #   - type: 'config'
#   #     instances:
#   #       - name: main
#   #         url: ${ARGOCD_BASE_URL}
#   #         username: ${ARGOCD_USERNAME}
#   #         password: ${ARGOCD_PASSWORD}

# -----------------------------------------------------------------------------
# Grafana - Monitoring Dashboards and Alerts
# -----------------------------------------------------------------------------
# Requires frontend: @backstage-community/plugin-grafana

grafana:
  domain: ${GRAFANA_DOMAIN:-localhost:3000}
  unifiedAlerting: false

# -----------------------------------------------------------------------------
# SonarQube - Code Quality Analysis
# -----------------------------------------------------------------------------
# Requires frontend: @backstage-community/plugin-sonarqube
# Requires backend: @backstage-community/plugin-sonarqube-backend
# sonarqube:
#   baseUrl: ${SONARQUBE_BASE_URL}
#   apiKey: ${SONARQUBE_API_KEY}
#   # For multiple SonarQube instances:
#   # instances:
#   #   - name: default
#   #     baseUrl: ${SONARQUBE_BASE_URL}
#   #     apiKey: ${SONARQUBE_API_KEY}

# -----------------------------------------------------------------------------
# Cost Insights - Cloud Cost Management
# -----------------------------------------------------------------------------
# Requires frontend: @backstage-community/plugin-cost-insights
# Needs custom CostInsightsClient implementation (page:cost-insights is disabled under app.extensions until then)
costInsights:
  engineerCost: 200000
  products:
    computeEngine:
      name: Compute Engine
      icon: compute
    cloudStorage:
      name: Cloud Storage
      icon: storage
