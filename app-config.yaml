app:
  title: Developer Portal
  baseUrl: http://localhost
  # Discover every frontend plugin listed in packages/app/package.json
  packages: all

  extensions:
    # The brand themes (from @internal/brand) replace the stock ones
    - theme:app/light: false
    - theme:app/dark: false
    # The catalog is the landing page
    - app/routes:
        config:
          redirects:
            - from: /
              to: /catalog

    # Visit tracking feeds the Most/Recently Visited home widgets (stored via user settings)
    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - home-page-widget:home/toolkit:
        config:
          tools:
            - url: https://backstage.io/docs
              label: Backstage Docs
              icon: docs
            - url: https://github.com/ayoinc/cloud-sandbox-backstage
              label: GitHub
              icon: github
            - url: /create
              label: Create a Component
              icon: kind:template
            - url: /catalog-import
              label: Register a Component
              icon: kind:component
    - page:home:
        config:
          defaultConfig:
            - component: HomePageSearchBar
              column: 0
              row: 0
              width: 12
              height: 2
              deletable: false
            - component: GettingStarted
              column: 0
              row: 1
              width: 4
              height: 11
            - component: HomePageStarredEntities
              column: 4
              row: 2
              width: 4
              height: 4
            - component: HomePageToolkit
              column: 8
              row: 2
              width: 4
              height: 4
            - component: HomePageMostVisited
              column: 4
              row: 6
              width: 4
              height: 4
            - component: HomePageRecentlyVisited
              column: 8
              row: 6
              width: 4
              height: 4
    - home-page-widget:home/random-joke: false
    - home-page-widget:home/world-clock: false

    # Entity page layout
    - entity-card:catalog-graph/relations:
        config:
          height: 400
          filter:
            $not:
              kind:
                $in: [user, group]
    # Provided/consumed APIs live on the service "API" tab, not the overview
    - entity-card:api-docs/provided-apis: false
    - entity-card:api-docs/consumed-apis: false
    - entity-content:api-docs/apis:
        config:
          path: /api
          title: API
          filter:
            kind: component
            spec.type: service
    # Dependencies live on the custom "Dependencies" tab (modules/catalog)
    - entity-card:catalog/depends-on-components: false
    - entity-card:catalog/depends-on-resources: false
    - entity-content:techdocs:
        config:
          title: Docs
          filter:
            metadata.annotations.backstage.io/techdocs-ref:
              $exists: true
    - addon:techdocs/expandable-navigation: false
    - addon:techdocs/text-size: false
    - addon:techdocs/light-box: false
    # GitHub Actions: CI/CD tab for entities annotated with github.com/project-slug
    - entity-content:github-actions:
        config:
          path: /ci-cd
          title: CI/CD
    - entity-card:github-actions/latest-workflow-run: false
    - entity-card:github-actions/latest-branch-workflow-runs: false
    - entity-card:github-actions/recent-workflow-runs: false
    # Argo CD: only for entities annotated for Argo CD (requires the argocd config below)
    - entity-card:argocd/overviewCard:
        config:
          filter: &argocdAnnotated
            $any:
              - metadata.annotations.argocd/app-name: { $exists: true }
              - metadata.annotations.argocd/app-selector: { $exists: true }
              - metadata.annotations.argocd/project-name: { $exists: true }
    - entity-card:argocd/historyCard:
        config:
          filter: *argocdAnnotated
    - entity-content:argocd/ArgoCdPage:
        config:
          filter: *argocdAnnotated
    # Cost Insights ships only an example (fake data) client; enable once a real
    # CostInsightsApi is provided
    - page:cost-insights: false

organization:
  # What the portal is called outside an organisation. At an organisation's
  # address (/o/<slug>) the app uses the organisation's own name instead.
  name: Developer Portal

backend:
  baseUrl: http://localhost
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    # Use PostgreSQL for persistence (tokens survive container restarts)
    client: pg
    connection:
      host: ${POSTGRES_HOST:-postgres}
      port: ${POSTGRES_PORT:-5432}
      user: ${POSTGRES_USER:-backstage}
      password: ${POSTGRES_PASSWORD:-backstage}
      database: ${POSTGRES_DB:-backstage}
    # Fallback to in-memory SQLite for local development without Docker
    # client: better-sqlite3
    # connection: ':memory:'

  # Redis cache - improves performance for catalog, auth, and plugin data
  # See: https://backstage.io/docs/backend-system/core-services/cache
  cache:
    store: redis
    connection: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
    redis:
      client:
        namespace: backstage
  # MCP actions exposed to AI agents: https://backstage.io/docs/ai/mcp-actions#actions-configuration
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
    mkdocs:
      # The generator drops plugins it does not know, and without this one
      # every D2 diagram is published as a block of source text.
      dangerouslyAllowAdditionalPlugins: [d2]
  publisher:
    type: 'awsS3'
    awsS3:
      bucketName: ${TECHDOCS_BUCKET:-techdocs}
      endpoint: http://${MINIO_HOST:-minio}:${MINIO_PORT:-9000}
      region: us-east-1
      s3ForcePathStyle: true
      credentials:
        accessKeyId: ${MINIO_ACCESS_KEY:-backstage}
        secretAccessKey: ${MINIO_SECRET_KEY:-backstage123}

auth:
  # Session configuration
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    # Guest sign-in is ON. Everyone who uses it shares one account
    # (user:development/guest), which can register catalog files and run
    # templates, and sees what that account registered. To turn it off once
    # GitHub sign-in is configured, replace the two lines below with
    # `guest: null`, or set dangerouslyAllowOutsideDevelopment to false
    # (it then works only when NODE_ENV is development).
    guest:
      dangerouslyAllowOutsideDevelopment: true
    # GitHub OAuth for real GitHub users
    github:
      development:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        callbackUrl: http://localhost/api/auth/github/handler/frame
  # https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  clientIdMetadataDocuments:
    enabled: false

scaffolder: {}

catalog:
  # Automatically delete orphaned entities when their source is removed
  orphanStrategy: delete
  # Process entities frequently to detect orphans quickly
  processingInterval: { seconds: 30 }
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow:
        [
          Component,
          System,
          API,
          Resource,
          Location,
          Domain,
          Template,
          User,
          Group,
        ]
  locations:
    # Users and Groups
    - type: file
      target: ../../catalog/users.yaml
      rules:
        - allow: [User, Group]

    # Domains
    - type: file
      target: ../../catalog/domains.yaml
      rules:
        - allow: [Domain]
    - type: file
      target: ../../catalog/devops-domains.yaml
